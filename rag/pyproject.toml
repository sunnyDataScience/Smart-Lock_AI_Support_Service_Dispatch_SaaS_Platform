[project]
name = "smart-lock-rag"
version = "0.1.0"
description = "RAG 語義層 — pgvector 語料 + MCP server（WBS 2.2.1 / ADR-010；per-brand bundle 元件）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=1.2.0",                # MCP python SDK（FastMCP server）
    "litellm>=1.84.0",           # embed() 統一介面（vertex_ai/text-embedding-004）
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
