# infra/casdoor/app.conf — Casdoor 本機 dev 設定(WBS 2.1.1/CR-0141 D1)
#
# ⚠ 僅本機 dev:資料庫密碼 0000 寫死(與各 stack dev 慣例一致);
#   prod 部署時整份 conf 由 Secret Manager 注入,admin 密碼必換(CR-0141 §8-2)。
# 掛載:web/platform-console/docker-compose.yml 的 casdoor service(profile idp)
#   把本檔掛到 /conf/app.conf。

appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = postgres
dataSourceName = "user=lock password=0000 host=casdoor-db port=5432 sslmode=disable dbname=casdoor"
dbName = casdoor
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin =
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
initDataNewOnly = false
initDataFile = ""
frontendBaseDir = "../cc_0"
