[project]
name = "smart-lock-platform"
version = "0.1.0"
description = "Smart Lock AI Support & Service Dispatch SaaS Platform — monorepo workspace root"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# 把三個 workspace member 列為 deps，`uv sync` 才會把它們的 deps 拉進共用 venv
dependencies = [
    "lock-cs-agent[eval]",  # eval extra=openpyxl(eval 腳本讀 xlsx;原搭 langchain 傳遞便車,Phase A 瘦身後顯式帶上)
    "smart-lock-api",
    "smart-lock-knowledge-pipeline",
    "smart-lock-rag",
    "smart-lock-refinery",
]

[dependency-groups]
# 開發階段三個 module 共用的工具（lint / test / format）
# 用：uv sync --group dev
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Q4=C 拍板：月結 SLA 7 工作日 + 國定假日跳過
    # 使用 holidays 套件取得台灣國定假日；agent/core/workday.py 為唯一呼叫點
    "holidays>=0.50",
]

# CI / 測試專用工具（與 dev 分離，本機可跳過）
# 用：uv sync --group test
# 對應 docs/_flows-bdd-test/v-model-right/E7x--test-plan-and-readiness.md §10 / §14
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",            # coverage report（HTML / XML for diff-cover）
    "diff-cover>=9.0",            # PR coverage diff 留言
    "schemathesis>=3.36",         # OpenAPI 合約 fuzz（91 ops × N examples）
    "factory-boy>=3.3",           # 測試資料工廠（替代 hardcoded fixtures）
    "respx>=0.21",                # httpx mock（測 LLM / LINE 對外呼叫）
    "hypothesis>=6.100",          # property-based test（派工計分 / settlement Decimal）
]

# ── uv workspace 設定 ──
# 三個 module 各為獨立 package，但共用同一個 .venv 與 uv.lock
# 預設：`uv sync --all-packages` 同時裝 agent / api / knowledge-pipeline 所有 deps
[tool.uv.workspace]
members = ["agent", "api", "knowledge-pipeline", "agent/rag", "knowledge-pipeline/refinery"]

[tool.uv.sources]
lock-cs-agent = { workspace = true }
smart-lock-api = { workspace = true }
smart-lock-knowledge-pipeline = { workspace = true }
smart-lock-rag = { workspace = true }
smart-lock-refinery = { workspace = true }

# Root 本身不打包成 wheel（沒有 .py code，只當 workspace 容器）
[tool.uv]
package = false

# ── pytest 全域設定（root 層；api/ 仍保留自己的 api/pytest.ini） ──
# 測試金字塔分層 markers，對應 E7x §5.2
[tool.pytest.ini_options]
# 根 tests/ 已整併(2026-07-09):smoke→scripts/ci、其餘隨舊架構移除。
# 根層 pytest 預設跑 agent 套件(無 DB 依賴);api 套件須 cd api 並用隔離 scratch DB。
testpaths = ["agent/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "unit: 純函式單元測試（無 I/O、無 DB、無網路；< 1s/case）",
    "component: 元件測試（API router + DB stub 或單頁 + mock fetch；< 5s/case）",
    "contract: 合約測試（OpenAPI / AsyncAPI 形狀；schemathesis / parser）",
    "e2e: 端到端測試（多服務串接；Playwright / 真 webhook）",
    "slow: 預期 > 30s 的測試（property fuzz / load smoke）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
