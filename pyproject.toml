[project]
name = "smart-lock-platform"
version = "0.1.0"
description = "Smart Lock AI Support & Service Dispatch SaaS Platform — monorepo workspace root"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# 把三個 workspace member 列為 deps，`uv sync` 才會把它們的 deps 拉進共用 venv
dependencies = [
    "smart-lock-agent",
    "smart-lock-api",
    "smart-lock-data",
]

[dependency-groups]
# 開發階段三個 module 共用的工具（lint / test / format）
# 用：uv sync --group dev
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# ── uv workspace 設定 ──
# 三個 module 各為獨立 package，但共用同一個 .venv 與 uv.lock
# 預設：`uv sync --all-packages` 同時裝 agent / api / data 所有 deps
[tool.uv.workspace]
members = ["agent", "api", "data"]

[tool.uv.sources]
smart-lock-agent = { workspace = true }
smart-lock-api = { workspace = true }
smart-lock-data = { workspace = true }

# Root 本身不打包成 wheel（沒有 .py code，只當 workspace 容器）
[tool.uv]
package = false
