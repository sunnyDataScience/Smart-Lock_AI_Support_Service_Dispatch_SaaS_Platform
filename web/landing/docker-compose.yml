# docker-compose.landing.yml — 公開行銷一頁式(landing)獨立容器
#
# 業主 2026-07-05 需求:把一頁式介紹網頁部署成獨立 container。
# landing 是**對外門面**,與登入後的派工/師傅系統關注點不同,故獨立部署:
#   - 同一份 web image(web/Dockerfile),以 NEXT_PUBLIC_APP_MODE=landing build。
#   - 只渲染 `/`(行銷頁),其餘路徑導派工 portal(見 appMode.crossModeRedirect)。
#   - CTA 全外導絕對 URL:師傅接單 → 師傅 portal /tech-login?tab=register;
#     登入 → 派工 portal /login;品牌申請 modal → 打派工 API /vendors/register。
#   - 無 DB、無後端依賴 —— 純靜態 SSR + 瀏覽器打各服務,可完全獨立起。
#
# 埠位:landing 3002(派工 web 3000 / 師傅 web 3001 / 派工 api 8001)。
#
# 用法(本機;需派工 stack 已起以供 CTA 目標與 /vendors/register):
#   docker compose -f docker-compose.landing.yml up -d --build
#   → http://localhost:3002
#
# 雲端(一品牌一專案時,landing 可掛品牌網域根、各 portal 指 Cloud Run URL):
#   LANDING_API_BASE_URL=https://<api-url> TECH_PORTAL_URL=https://<tech-web-url> \
#   DISPATCH_PORTAL_URL=https://<web-url> \
#     docker compose -f docker-compose.landing.yml up -d --build

name: lock-landing

services:
  landing-web:
    build:
      context: ../..
      dockerfile: web/landing/Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: "landing"
        # 派工 API base(保留;landing 其餘站內連結沿用)
        NEXT_PUBLIC_API_BASE_URL: "${LANDING_API_BASE_URL:-http://localhost:8001}"
        # CR-0114 R2:品牌申請表單打 platform API 的 /brand-applications(瀏覽器端直連)
        NEXT_PUBLIC_PLATFORM_API_BASE_URL: "${LANDING_PLATFORM_API_BASE_URL:-http://localhost:8003}"
        # CTA 外導目標(build-time 烤入)
        NEXT_PUBLIC_TECH_PORTAL_URL: "${TECH_PORTAL_URL:-http://localhost:3001}"
        NEXT_PUBLIC_DISPATCH_PORTAL_URL: "${DISPATCH_PORTAL_URL:-http://localhost:3000}"
        # 品牌申請導入頁在 platform 站 /platform/apply(品牌 CTA 外導)
        NEXT_PUBLIC_PLATFORM_PORTAL_URL: "${PLATFORM_PORTAL_URL:-http://localhost:3003}"
    # UAT-D-004：上面 build args 給瀏覽器直連；下面 runtime env 給 server-side
    # proxy(src/lib/serverApiProxy.ts)。NEXT_PUBLIC_* 為空時瀏覽器改走本站
    # /api-proxy，proxy 讀不到這裡就整站 503（health check 打 `/` 仍會綠）。
    # landing 是**獨立 stack**（無自己的 api 服務），故走 host 對外埠而非服務名。
    environment:
      API_BASE_URL: "${LANDING_PROXY_API_BASE_URL:-http://host.docker.internal:8001}"
      PLATFORM_API_BASE_URL: "${LANDING_PROXY_PLATFORM_API_BASE_URL:-http://host.docker.internal:8003}"
    ports:
      - "${LANDING_WEB_PORT:-3002}:8080"
    restart: unless-stopped
