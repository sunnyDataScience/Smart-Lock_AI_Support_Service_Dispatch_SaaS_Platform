# docker-compose.dispatch.yml — 派工方(品牌)stack:db + api + agent + web
#
# CR-0112 雙 stack 拆分(20260702 會議 §三「一品牌一專案 + 獨立 DB」的本機映射):
#   - 派工方 stack = 每品牌一套(db/api/agent/web 全獨立,BRAND 參數化)
#   - 師傅 stack   = 全品牌共用一套 → 見 docker-compose.tech.yml
#   - 資料面(業主 2026-07-03 裁決方案 A):師傅 stack 不帶 DB,經本 stack 的
#     network 連同一顆品牌 DB;技師庫物理拆分待 AI-2/AI-3 同步層設計後再做。
#
# 用法(預設品牌 locksmart,埠沿用舊 compose:db 5433 / api 8001 / agent 8000 / web 3000):
#   docker compose -f docker-compose.dispatch.yml up -d --build
#   docker compose -f docker-compose.dispatch.yml --profile init run --rm db-init   # 全新 DB 初始化(套 schema+migrations+seeds)
#   docker compose -f docker-compose.dispatch.yml down                              # 停(保留資料)
#
# 第二個品牌(埠位/資料全隔離,web 的 API base 需 build-time 指到該品牌 api 埠):
#   BRAND=brandx DB_PORT=5434 API_PORT=8011 AGENT_PORT=8010 WEB_PORT=3010 \
#   NEXT_PUBLIC_API_BASE_URL=http://localhost:8011 \
#   NEXT_PUBLIC_REALTIME_BASE_URL=ws://localhost:8011 \
#   TECH_PORTAL_URL=http://localhost:3001 \
#     docker compose -f docker-compose.dispatch.yml up -d --build
#
# 資料沿革:預設品牌 volume `lock-dispatch-locksmart-pgdata` 由舊
# `smart-lock_..._pgdata` 於 2026-07-03 clone 而來(舊 volume 留作備援)。
# ngrok 不納:host 跑 `ngrok http 8000` 接 LINE webhook(<ngrok>/callback)。

name: lock-dispatch-${BRAND:-locksmart}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lock
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: lock_AI_data
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lock -d lock_AI_data"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # 一次性初始化(profile 隔離,平時 up 不會啟動):全新品牌空庫套
  # Schema.sql → Schema_*.sql → migrations → seeds(順序同 scripts/dev/quickstart.sh)。
  db-init:
    image: pgvector/pgvector:pg17
    profiles: ["init"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: lock
      PGPASSWORD: "0000"
      PGDATABASE: lock_AI_data
    volumes:
      - ../../SQL:/init/SQL:ro
      - ../../scripts/dev/compose-db-init.sh:/init/db-init.sh:ro
    entrypoint: ["bash", "/init/db-init.sh"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8001}:8080"
    env_file:
      - .env                      # API_JWT_SECRET_KEY / GEMINI / OPIK 等
    environment:
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      # 雙庫模式(CR-0112 方案 B):技師身分權威庫在師傅 stack 的 tech-db。
      # 預設空 = 單庫 fallback(dispatch stack 可獨立起);跑雙庫時傳:
      #   TECH_POSTGRES_URI=postgresql://lock:0000@tech-db:5432/lock_tech \
      #     docker compose -f docker-compose.dispatch.yml up -d api
      # (tech-db 由師傅 stack 提供並掛在本 stack 的 network 上)
      TECH_POSTGRES_URI: "${TECH_POSTGRES_URI:-}"
      API_SURFACE: dispatch       # 完整後台面 + 背景 worker(見 api/main.py CR-0112)
      # 三個前端網域都要放行:派工 web(3000)+ 師傅 web(3001)+ landing(3002)
      # 打同一品牌 api 的 WS/媒體/vendors註冊。雲端每品牌換成實際網域清單。
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000 http://localhost:3001 http://localhost:3002}"
      MEDIA_ROOT: /app/api/data/media
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      AGENT_TENANT_ID: "${AGENT_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
    volumes:
      # 證據照片/簽名檔實體與師傅 stack 的 tech-api 共用(named volume 跨 stack external 掛載)
      - media:/app/api/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    ports:
      - "${AGENT_PORT:-8000}:8080"
    env_file:
      - .env                      # LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN
    environment:
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      # 容器內走 compose 網路用 service 名連 api（非 host port）。
      LOCK_API_BASE_URL: "http://api:8080"
    volumes:
      # Vertex 認證：本機用 credentials.json（雲端才走 SA ADC）。唯讀掛載，不入映像。
      - ../../agent/credentials.json:/app/agent/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # knowledge-refinery 審核服務（WBS 2.3.2/CR-0140；ADR-018 License 附加系統）。
  # profile 隔離：平時 up 不啟動；開通品牌用
  #   docker compose --profile refinery up -d refinery   → UI 在 :8002
  # auth interim＝與 api 共驗 API_JWT_SECRET_KEY（.env）；Casdoor OIDC 隨 2.1.1 替換。
  refinery:
    build:
      context: ../..
      dockerfile: refinery/Dockerfile
    profiles: ["refinery"]
    ports:
      # 8004:8002 已被師傅 stack tech-api 占用(埠位表見 docker-compose.platform.yml 檔頭)
      - "${REFINERY_PORT:-8004}:8080"
    env_file:
      - .env                      # API_JWT_SECRET_KEY（與 api 同 secret 共驗）
    environment:
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      REFINERY_TENANT_ID: "${AGENT_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
      LOCK_API_BASE_URL: "http://api:8080"
    volumes:
      # Publisher embed 走 Vertex：本機用 credentials.json（雲端 SA ADC）。唯讀，不入映像。
      - ../../agent/credentials.json:/app/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: web/brand-portal/Dockerfile
      args:
        # NEXT_PUBLIC_* 均 build-time 烤入 bundle(見 web/Dockerfile)。
        NEXT_PUBLIC_REALTIME_BASE_URL: "${NEXT_PUBLIC_REALTIME_BASE_URL:-ws://localhost:8001}"
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-}"   # 空 → 前端 fallback localhost:8001
        NEXT_PUBLIC_APP_MODE: "dispatch"                            # 派工方 build:擋師傅工作台路由
        NEXT_PUBLIC_PEER_PORTAL_URL: "${TECH_PORTAL_URL:-http://localhost:3001}"
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped

networks:
  default:
    # 固定名稱供師傅 stack(docker-compose.tech.yml)external 加入 → tech-api 以
    # service 名 `db` 解析到本品牌 DB(方案 A:資料面共用)。
    name: lock-dispatch-${BRAND:-locksmart}-net

volumes:
  pgdata:
    name: lock-dispatch-${BRAND:-locksmart}-pgdata
  media:
    name: lock-dispatch-${BRAND:-locksmart}-media
