# docker-compose.platform.yml — 平台方管理 console stack(CR-0114)
#
# 平台方(Lock AI)自用後台:師傅註冊申請審核 + 品牌申請審核。非師傅/品牌用。
#   - platform-db  = 平台自有資料(platform_admin 帳號/revoked_jti/品牌申請)。
#     獨立容器(非掛 tech-db 第二 database):備份邊界乾淨、憑證可獨立、
#     維持「一 instance 一 database」repo 慣例。
#   - platform-api = 同一份 api image,API_SURFACE=platform 只掛 /api/v1/platform
#     前綴並停用背景 worker(api/main.py CR-0114)。三連線:
#       POSTGRES_URI          → 主品牌庫(MVP:技師審核 mirror 落點,R3 起用)
#       TECH_POSTGRES_URI     → 技師身分權威庫(R3 師傅審核直寫)
#       PLATFORM_POSTGRES_URI → 平台庫(未設 = fallback 主連線,單庫模式)
#   - platform-web = 同一份 web image,NEXT_PUBLIC_APP_MODE=platform 只渲染
#     /platform 頁群(appMode.crossModeRedirect)。
#
# ⚠️ JWT 隔離:PLATFORM_JWT_SECRET_KEY **絕不可與品牌 .env 的 API_JWT_SECRET_KEY
#   共用值** —— 同名 env 不同值即達成「平台 token 與品牌 token 互不通用」。
#   故本 stack 不 env_file: .env,機密全部顯式列出。
#
# 先決條件與啟動順序(network/tech-db 由 dispatch/tech stack 擁有):
#   1. docker compose -f docker-compose.dispatch.yml up -d --build   # 品牌 stack(network 擁有者)
#   2. docker compose -f docker-compose.tech.yml up -d --build       # 師傅 stack(tech-db)
#   3. PLATFORM_JWT_SECRET_KEY=<獨立值> \
#        docker compose -f docker-compose.platform.yml up -d --build # 本 stack
#   4. ./scripts/db/init-platform-db.sh --email <email>   # 首次:schema+seed(密碼互動輸入不回顯)
#
# 埠位:platform-db 5435 / platform-api 8003 / platform-web 3003
# (派工 5433/8001/3000;師傅 5434/8002/3001;landing 3002)。

name: lock-platform

services:
  # 平台自有資料庫(管理員帳號/品牌申請)
  platform-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lock
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:-0000}"
      POSTGRES_DB: lock_platform
    ports:
      - "${PLATFORM_DB_PORT:-5435}:5432"
    volumes:
      - platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lock -d lock_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  platform-api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    ports:
      - "${PLATFORM_API_PORT:-8003}:8080"
    environment:
      # 主品牌庫(R3 技師審核 mirror 落點;external network 上以 service 名 `db` 解析)
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      # 技師身分權威庫(R3 師傅審核直寫;service 名 `tech-db` 由 tech stack 提供)
      TECH_POSTGRES_URI: "postgresql://lock:0000@tech-db:5432/lock_tech"
      # 平台庫(拿掉此行 = 單庫 fallback,platform 資料落主連線 —— 僅測試用)
      PLATFORM_POSTGRES_URI: "postgresql://lock:${PLATFORM_DB_PASSWORD:-0000}@platform-db:5432/lock_platform"
      API_SURFACE: platform       # 只掛 /api/v1/platform、停用背景 worker(api/main.py CR-0114)
      DB_URI_STRICT: "1"          # CR-0153:三庫 URI 啟動守衛(漏設拒啟,ADR-020)
      # ⚠️ 必填且必須與品牌/師傅 stack 不同值(token 密碼學隔離)。
      #   未設 → compose 直接拒起(:?);main.py 對 platform surface 另有啟動守衛
      #   (拒絕過短/含 dev 標記的密鑰)。絕不提供 repo 內預設值 —— 這是簽發
      #   platform_admin(跨品牌最高權限)token 的密鑰,公開預設值 = 任何人可偽造。
      API_JWT_SECRET_KEY: "${PLATFORM_JWT_SECRET_KEY:?必須設定 PLATFORM_JWT_SECRET_KEY(平台 token 簽章密鑰,≥16 字元且不可與品牌 .env 共用值)}"
      # console(3003)+ landing(3002,R2 品牌申請公開表單瀏覽器直打)
      CORS_ORIGINS: "${PLATFORM_CORS_ORIGINS:-http://localhost:3003 http://localhost:3002}"
      # CR-0115 S7:師傅 KYC 註冊文件由 tech-api 寫入共用 media volume 的
      # kyc-registration/ 子樹;platform 審核檢視需讀同一顆 volume。
      MEDIA_ROOT: /app/api/data/media
      # PII 加密金鑰:必須與 tech stack 同值(tech-api 加密、platform-api 解密;
      # 兩邊不同值 → reveal 靜默回 null)。未設 = 兩邊都用 dev fallback(僅本機)。
      KYC_ENCRYPTION_KEY: "${KYC_ENCRYPTION_KEY:-}"
    volumes:
      - media:/app/api/data/media
    depends_on:
      platform-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  platform-web:
    build:
      context: ../..
      dockerfile: web/platform-console/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PLATFORM_API_BASE_URL:-http://localhost:8003}"
        NEXT_PUBLIC_APP_MODE: "platform"   # 只渲染 /platform 頁群
        # CR-0116 維運監控「詳細用量」連結 → GCP 方案 1 Metrics Scope dashboard。
        # 未設 = 前端不顯示該連結;建好 dashboard 後填其 URL 即可。
        NEXT_PUBLIC_GCP_MONITORING_URL: "${PLATFORM_GCP_MONITORING_URL:-}"
        # UAT R2 W3-5/W3-6:師傅補件連結指向的 tech-portal 基底 URL(免 email
        # 方案——連結由平台管理員以 LINE/電話轉交師傅)。本機預設 :3001。
        NEXT_PUBLIC_TECH_PORTAL_BASE_URL: "${PLATFORM_TECH_PORTAL_BASE_URL:-http://localhost:3001}"
    ports:
      - "${PLATFORM_WEB_PORT:-3003}:8080"
    restart: unless-stopped

  # ── Casdoor 統一 IdP(WBS 2.1.1/CR-0141/ADR-004;集中共用元件,ADR-002)──
  # profile 隔離:平時 up 不啟動。啟用:
  #   docker compose -f docker-compose.platform.yml --profile idp up -d casdoor
  # 首次啟動後跑 bootstrap 同步 org/角色/使用者:
  #   uv run python scripts/idp/casdoor_bootstrap.py --help
  # ⚠ 內建 admin 密碼(admin/123)僅限本機;prod 必換 + HA/備份(13_Security L46)。
  casdoor-db:
    image: pgvector/pgvector:pg17
    profiles: ["idp"]
    environment:
      POSTGRES_USER: lock
      POSTGRES_PASSWORD: "0000"     # 與 infra/casdoor/app.conf dataSourceName 對齊(僅本機)
      POSTGRES_DB: casdoor
    ports:
      - "${CASDOOR_DB_PORT:-5436}:5432"
    volumes:
      - casdoor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lock -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  casdoor:
    image: casbin/casdoor:latest    # prod 部署時 pin 版本
    profiles: ["idp"]
    ports:
      - "${CASDOOR_PORT:-8005}:8000"
    volumes:
      - ../../infra/casdoor/app.conf:/conf/app.conf:ro
    depends_on:
      casdoor-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    # 加入派工方 stack 的 network(該 stack 先起)以解析 `db` 與 `tech-db`。
    name: lock-dispatch-${PLATFORM_NET_BRAND:-locksmart}-net
    external: true

volumes:
  platform_pgdata:
    name: lock-platform-pgdata
  casdoor_pgdata:
    name: lock-platform-casdoor-pgdata
  media:
    # 與派工/tech stack 共用同一顆(dispatch compose 建立並擁有)。
    # external:必標 —— 否則本 stack `down -v` 會把整顆品牌媒體(工單照片/
    # 簽名/KYC 文件)一起刪掉。
    name: lock-dispatch-${PLATFORM_NET_BRAND:-locksmart}-media
    external: true
