# docker-compose.yml — 本機「全 docker」開發編排（db + api + agent + web）
#
# 設計（見對話 2026-06-16）：
#   - DB 納入 compose：pgvector/pg17 + named volume `pgdata`（自包含，一鍵全起）。
#     資料由舊 `lock_AI` 容器 pg_dump/restore 遷入；舊容器停用留作備援。
#   - ngrok 不納：維持你自己在 host 跑 `ngrok http 8000` → 打 agent 的 published 8000。
#   - 機密讀專案根 .env（env_file）；host 專屬值（POSTGRES_URI / LOCK_API_BASE_URL 等）
#     在 environment 覆蓋（compose 中 environment 優先於 env_file）。
#
# 用法：
#   docker compose up -d --build          # 起 db/api/agent/web（背景）
#   ngrok http 8000                       # 另開：對外接 LINE（webhook = <ngrok>/callback）
#   docker compose logs -f agent          # 看 agent log
#   docker compose down                   # 停（保留資料）
#   docker compose down -v                # ⚠️ 連同 pgdata volume 一起刪 —— 會清空資料庫！平時別加 -v
#
# 連線埠（host:container）：db 5433:5432 / api 8001:8080 / agent 8000:8080 / web 3000:8080。
# web 的 NEXT_PUBLIC_API_BASE_URL build 時烤成 http://localhost:8001（瀏覽器端），
# 故 api 必須 published 在 host 8001。服務間（agent→api、*→db）走 compose 內網。

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lock
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: lock_AI_data
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lock -d lock_AI_data"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8001:8080"
    env_file:
      - .env                      # API_JWT_SECRET_KEY / GEMINI / OPIK 等
    environment:
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      AGENT_TENANT_ID: "${AGENT_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8080"
    env_file:
      - .env                      # LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN
    environment:
      POSTGRES_URI: "postgresql://lock:0000@db:5432/lock_AI_data"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-dev-internal-token}"
      # 容器內走 compose 網路用 service 名連 api（非 host port）。
      LOCK_API_BASE_URL: "http://api:8080"
    volumes:
      # Vertex 認證：本機用 credentials.json（雲端才走 SA ADC）。唯讀掛載，不入映像。
      - ./agent/credentials.json:/app/agent/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  pgdata:
