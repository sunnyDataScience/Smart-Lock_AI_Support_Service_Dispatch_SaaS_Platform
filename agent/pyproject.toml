[project]
name = "lock-cs-agent"
version = "0.0.1"
description = "鎖匠客服機器人 — nanobot 核心 + Hermes 記憶(per-user)− 自我學習"
requires-python = ">=3.11"
# LockCore(fork 自 nanobot)核心所需的 runtime deps(僅核心用到的子集;不含 channels)。
# 供應商層改用 litellm 統一多家(取代 anthropic SDK 等各家 client)。
dependencies = [
    # 資安全修(2026-07-07,PYSEC-2026-388)
    "litellm>=1.84.0",
    "pydantic>=2.12",
    # 資安全修(2026-07-07,GHSA-4xgf-cpjx-pc3j)
    "pydantic-settings>=2.14.2",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "rich>=14.0",
    "croniter>=6.0",
    "typer>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vertex = ["google-cloud-aiplatform>=1.60", "google-genai>=1.0"]  # Vertex AI(Gemini/Claude on Vertex)
line = ["line-bot-sdk>=3.0", "aiohttp>=3.14.1"]  # LINE 通道接入(webhook + reply);aiohttp 資安全修
eval = ["openpyxl>=3.1"]  # 跑 scripts/eval_reply_quality.py(讀 987 題訓練集 xlsx)
postgres = [
    "psycopg[binary]>=3.1",  # memory.backend="postgres"(agent schema / pg_trgm,見 CR-0023)
    "psycopg-pool>=3.2",  # SkillSync 長壽命連線池（Cloud SQL idle 斷線可回收）
]
rag = [  # CR-0187/ADR-010：RAG-via-MCP 同容器 stdio。缺這兩個 → config.toml 的
    # [mcp_servers.locksmith-rag] 起不來，agent 每則訊息嘗試連線失敗被 fail-soft
    # 吞掉（噪音且 RAG 永遠無結果）。litellm 已是主依賴、psycopg 由 --extra postgres
    # 提供，故 rag/pyproject.toml 的四個依賴只差這兩個。
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
]
otel = [  # CR-0156/ADR-007 可觀測性 opt-in:OTel OTLP(SigNoz)+ OPIK LLM 追蹤;未裝=no-op
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opik>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
