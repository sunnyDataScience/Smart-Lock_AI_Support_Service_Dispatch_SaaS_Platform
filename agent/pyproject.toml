[project]
name = "lock-cs-agent"
version = "0.0.1"
description = "鎖匠客服機器人 — nanobot 核心 + Hermes 記憶(per-user)− 自我學習"
requires-python = ">=3.11"
# LockCore(fork 自 nanobot)核心所需的 runtime deps(僅核心用到的子集;不含 channels)。
# 供應商層改用 litellm 統一多家(取代 anthropic SDK 等各家 client)。
dependencies = [
    "litellm>=1.70",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "loguru>=0.7",
    "rich>=14.0",
    "croniter>=6.0",
    "typer>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
vertex = ["google-cloud-aiplatform>=1.60", "google-genai>=1.0"]  # Vertex AI(Gemini/Claude on Vertex)
line = ["line-bot-sdk>=3.0", "aiohttp>=3.9"]  # LINE 通道接入(webhook + reply)
eval = ["openpyxl>=3.1"]  # 跑 scripts/eval_reply_quality.py(讀 987 題訓練集 xlsx)
postgres = ["psycopg[binary]>=3.1"]  # memory.backend="postgres"(agent schema / pg_trgm,見 CR-0023)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
