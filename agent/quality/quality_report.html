/3", "elapsed_sec": 4.0, "simplified_chars": []}, {"id": "H-4", "category": "硬體維修", "question": "全自動鎖匣的鎖舌感應機制是什麼？", "expected": "解釋其具備感應器，當門關閉後會自動驅動鎖栓伸出上鎖", "answer": "全自動鎖匣的感應機制主要是透過鎖體上的「鎖舌感應器」或「小鎖舌」來運作。\n\n當您關上門時，這個感應器會被門框上的受口片壓入，系統偵測到門已關閉後，馬達就會自動驅動鎖栓伸出完成上鎖。\n\n請問您目前的電子鎖是什麼品牌或型號呢？了解型號後我可以為您說明更具體的運作方式。", "skills_loaded": ["product-knowledge"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 3.4, "simplified_chars": []}, {"id": "H-5", "category": "硬體維修", "question": "鎖舌在室內拉不開門的緊急處理？", "expected": "指導「先將門推緊，再拉動把手」的緩解動作", "answer": "如果鎖舌卡住縮不回去且門目前是關著的，這通常是鎖舌與門框的受口片產生了嚴重的摩擦力。\n\n您可以先嘗試以下方法：\n1. **消除壓力**：請用力將門往「關門的方向」推緊（如果是往外開的門就往外推，往內開就往內拉），同時嘗試轉動把手或按開鎖鍵，這能幫助鎖舌脫離卡住的位置。\n2. **手動旋鈕**：如果是 AI-99 或 A90 型號，請嘗試轉動室內面板下方的「手動旋鈕」來強制縮回鎖舌。\n\n如果嘗試後還是無法開啟，可能需要師傅現場處理。請問您的型號是 AI-99 還是 A90？另外，目前室內的手動旋鈕轉得動嗎？", "skills_loaded": ["troubleshoot"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 9.1, "simplified_chars": []}, {"id": "H-6", "category": "硬體維修", "question": "Dormakaba 鎖在室外推不開門的緊急處理？", "expected": "指導先拉緊把手使門閉合，完成解鎖後再用力推動", "answer": "Dormakaba 電子鎖在室外推不開，通常是因為鎖舌與門框受口片產生摩擦力卡住了。您可以嘗試以下緊急處理步驟：\n\n1. **先拉再推**：解鎖前，請先用力「拉緊」把手，讓門板貼合門框以消除摩擦力，完成解鎖動作後再推開。\n2. **緊急鑰匙**：如果電子鎖完全沒反應，請檢查鎖體底部是否有蓋子，撥開後可以使用隨附的實體鑰匙手動開門。\n3. **緊急供電**：若是因為沒電導致無法解鎖，請在鎖體下方的緊急供電孔接上 9V 電池或行動電源（依型號而定）後再嘗試驗證。\n\n為了提供更精確的協助，請問您的鎖目前有發出任何警報聲或顯示特定燈號嗎？另外，方便提供您的型號（例如 AS701 或 RL360）嗎？", "skills_loaded": ["troubleshoot"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 6.3, "simplified_chars": []}, {"id": "H-7", "category": "硬體維修", "question": "門扇反弓會對鎖舌造成什麼具體影響？", "expected": "指出鉸鏈區域擠壓問題會導致鎖舌與受口片卡澀難開，也可能無法開啟。需將門先拉緊或推緊後解鎖，再放開手才能開門", "answer": "門扇反弓對鎖舌最直接的影響就是**「對不準」**與**「過度摩擦」**。\n\n具體來說會造成以下問題：\n1. **鎖舌卡澀**：因為門扇會往外或往內彈開，導致鎖舌在伸出時會不斷摩擦門框上的受口片，長期下來會造成鎖舌磨損，甚至導致馬達因阻力過大而燒毀。\n2. **自動上鎖失敗**：當門扇無法精準歸位時，電子鎖偵測不到門已關好，鎖舌就無法順利彈出，這也是為什麼很多反弓門會一直發出警報聲。\n3. **開門困難**：鎖舌被門框緊緊夾住，導致您在解鎖時會覺得卡卡的，甚至需要用力推或拉門才能順利開鎖。\n\n這通常是門扇鉸鏈（後鈕）的問題，不是鎖壞掉喔！為了幫您確認狀況，想請問：\n1. 您的電子鎖是什麼品牌呢？\n2. 當您把門打開約 45 度放手時，門是會自動往外彈還是往內彈？\n3. 目前是門很難關，還是關上後鎖不上呢？", "skills_loaded": ["troubleshoot", "ts-door-rebound"], "keyword_hits": "4/4", "verdict": "pass", "reason": "keyword 4/4", "elapsed_sec": 6.3, "simplified_chars": []}, {"id": "H-8", "category": "硬體維修", "question": "出現關鎖失敗警報時，使用者可以如何自行初步排查？", "expected": "指導在開門狀態下測試鎖栓伸縮是否正常，之後再確認是否為受口位移造成", "answer": "出現關鎖失敗警報時，通常是因為鎖舌無法順利伸入門框的受口片。您可以先嘗試以下幾個簡單的排查步驟：\n\n1. **推緊門板**：在關門時，試著將門往門框方向稍微「推緊」或「拉緊」，確保鎖舌沒有被門框卡住，讓它能順利對準孔位。\n2. **檢查異物**：查看門框上的受口片孔洞內是否有灰塵、小石子或裝潢碎屑阻礙鎖舌伸入。\n3. **檢查門縫**：確認門縫是否有加裝過厚的隔音條或氣密條，這可能會導致門扇反彈，讓鎖舌無法完全到位。\n\n由於 Dormakaba 不同型號的警報聲與燈號含義略有不同，為了提供您更精確的排查建議，請問您的型號是 AS701、DP850 還是其他型號呢？", "skills_loaded": ["troubleshoot"], "keyword_hits": "2/3", "verdict": "pass", "reason": "keyword 2/3", "elapsed_sec": 5.3, "simplified_chars": []}, {"id": "H-9", "category": "硬體維修", "question": "Dormakaba 雙重認證模式啟動後會有什麼現象？", "expected": "說明單一指紋或密碼或卡片將無法開門，需兩者同時驗證。如果只有管理者密碼可以開門但其他方式無法開門，就是啟動了雙重驗證模式，需將其解除", "answer": "Dormakaba 電子鎖啟動「雙重認證模式」後，開門時需要**同時驗證兩種方式**（例如：密碼＋指紋，或卡片＋指紋）才能成功解鎖。\n\n這項功能是為了提高安全性，即使其中一種開鎖資訊外流，門鎖依然不會被開啟。不過要提醒您，開啟這個模式後，每次進門都會稍微多花一點時間驗證喔！\n\n請問您的電子鎖目前是什麼型號呢？我可以幫您確認該型號具體的設定步驟。", "skills_loaded": ["product-knowledge"], "keyword_hits": "3/4", "verdict": "pass", "reason": "keyword 3/4", "elapsed_sec": 4.5, "simplified_chars": []}, {"id": "H-10", "category": "硬體維修", "question": "Chatlock貓眼鏡頭旁閃爍紅燈的含義？", "expected": "說明鏡頭正在主動啟動人臉或掌靜脈辨識，屬於正常工作狀態", "answer": "Chatlock（特別是 AI-99 型號）貓眼鏡頭旁的紅燈閃爍，通常代表以下幾種情況：\n\n1. **人臉/掌靜脈偵測中**：當您靠近門鎖時，紅外線感應器會啟動進行辨識，此時紅燈會閃爍或亮起。\n2. **有人按門鈴**：當訪客按下門鈴，鏡頭會啟動抓拍並將影像傳送到您的手機 APP，過程中紅燈會閃爍提示正在錄影或連線。\n3. **移動偵測警報**：如果有人在門前逗留過久，觸發了防撬或逗留偵測功能，鏡頭也會閃爍紅燈並錄影存證。\n\n請問您目前是只有閃紅燈，還是有伴隨其他的語音提示或無法開鎖的情況呢？", "skills_loaded": ["product-knowledge"], "keyword_hits": "2/3", "verdict": "pass", "reason": "keyword 2/3", "elapsed_sec": 3.7, "simplified_chars": []}, {"id": "S-1", "category": "報價客服", "question": "預約師傅到府安裝電子鎖的具體流程？", "expected": "說明諮詢、照片評估、選型、支付全額，將鎖寄出給客戶，排期安裝日期及教學", "answer": "預約師傅到府安裝的流程非常簡單，主要分為以下幾個步驟：\n\n1. **門扇評估**：請您先拍幾張門的照片（包含門的正面、側面鎖匣處），讓我們確認門的材質與厚度是否適合安裝。\n2. **選擇方案**：我們會根據您的門況與功能需求（如：指紋、密碼、APP 遠端等）推薦適合的型號與報價。\n3. **預約時間**：確認型號並支付訂金後，我們會幫您安排師傅上門安裝。建議安排在平日早上 10:30 或下午 1:30，比較不會吵到鄰居。\n4. **完工教學**：師傅安裝完成後，會現場教您如何設定管理者權限、新增用戶以及緊急供電的操作。\n\n請問您是新門要安裝，還是現有門要更換電子鎖呢？另外，方便提供您的安裝地址嗎？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/4", "verdict": "pass", "reason": "keyword 3/4", "elapsed_sec": 3.7, "simplified_chars": []}, {"id": "S-2", "category": "報價客服", "question": "小米電子鎖代工安裝為什麼一定要看門扇照片？", "expected": "解釋是為了確認現場環境是否符合安裝標準", "answer": "看門扇照片主要是為了幫您確認安裝的相容性，因為每扇門的厚度、材質，以及原本鎖孔的位置都不一樣。\n\n透過照片，師傅可以先判斷：\n1. **鎖匣規格**：確認您的門是否需要特殊規格的側板，避免現場無法安裝。\n2. **安裝空間**：確認門邊寬度是否足夠，會不會卡到門框或裝飾條。\n3. **施工難度**：判斷是否需要額外切割或補孔，這樣報價也會比較準確。\n\n您可以直接拍一張「門的正面」和「門側邊鎖舌處」的照片傳過來，我先幫您初步評估喔！", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/4", "verdict": "pass", "reason": "keyword 3/4", "elapsed_sec": 3.9, "simplified_chars": []}, {"id": "S-3", "category": "報價客服", "question": "師傅完成安裝後會提供哪些教學服務？", "expected": "告知會現場教學管理員設定、用戶錄入及緊急供電操作", "answer": "師傅在安裝完成後，會提供非常完整的現場教學服務，確保您能順手使用。教學內容主要包含：\n\n1. **管理者設定**：協助您設定最高權限的密碼或指紋。\n2. **用戶新增**：教您如何增加家人或朋友的指紋、卡片及密碼。\n3. **緊急供電操作**：這點很重要！師傅會示範萬一沒電時，如何使用行動電源或實體鑰匙緊急開門。\n\n舊鎖的部分，師傅通常會交還給您自行保存。請問您是近期有安裝需求，還是已經預約好時間了呢？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 3.8, "simplified_chars": []}, {"id": "S-4", "category": "報價客服", "question": "自備鎖請你們代工，如果之後壞了有保固嗎？", "expected": "說明代工服務僅針對安裝品質，產品本身故障需洽原購買商", "answer": "關於代工安裝的保固，我們主要負責的是「安裝品質」的部分。\n\n如果是因為安裝施工導致的問題，我們都會負責處理；但如果是電子鎖「產品本身」的硬體故障或軟體問題，因為鎖具不是從我們這邊購買的，這部分就需要請您聯繫原購買廠商提供保固服務喔！\n\n另外，代工安裝的費用會依據您的門扇材質和鎖具型號而定，建議您可以拍一張門的正反面照片傳過來，我再請專員為您評估報價。", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 3.5, "simplified_chars": []}, {"id": "S-5", "category": "報價客服", "question": "林口以外的地區有提供電子鎖安裝服務嗎？", "expected": "告知安裝服務可跨區，或引導聯繫門市確認皆可", "answer": "有的，我們的電子鎖安裝服務是可以跨區提供的喔！\n\n除了林口以外，其他地區我們也都有安排師傅前往安裝。您可以先提供您想安裝的地區，我再幫您確認相關細節。", "skills_loaded": ["store-info"], "keyword_hits": "2/3", "verdict": "pass", "reason": "keyword 2/3", "elapsed_sec": 2.9, "simplified_chars": []}, {"id": "S-6", "category": "報價客服", "question": "遺失實體鑰匙導致無法進門，這在保固範圍內嗎？", "expected": "明確告知鑰匙遺失屬於人為因素，不包含在免費保固中。需將鎖破壞掉才能進入", "answer": "實體鑰匙遺失屬於人為因素，通常**不在保固範圍內**喔！\n\n保固主要是針對產品本身的機械故障或安裝品質。如果是因為鑰匙遺失導致無法進門，這會視為緊急維修案件，需要另外安排師傅前往處理，並會產生相關的服務費用。\n\n為了幫您安排，請問您目前的地址在哪裡？另外，您現在能透過密碼、指紋或其他方式進門嗎？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 574.0, "simplified_chars": []}, {"id": "S-7", "category": "報價客服", "question": "如果我想更換整組鎖體，建議先準備什麼資料？", "expected": "引導使用者提供現有門鎖的照片與側板尺寸等資訊以供評估", "answer": "如果您想更換整組鎖體，建議您先準備以下資料，方便我們為您評估最適合的款式：\n\n1. **門的照片**：請拍一張門的正面，以及側面鎖匣（鎖舌伸出來的地方）的照片。\n2. **測量尺寸**：測量一下門側面金屬片（側板）的寬度與長度。\n3. **門的類型**：是新門要安裝，還是現有的門要更換電子鎖？\n4. **安裝地址**：方便我們確認服務區域。\n\n有了這些資訊，我們就能更精準地建議適合的型號並提供後續預約服務喔！", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 3.7, "simplified_chars": []}, {"id": "S-8", "category": "報價客服", "question": "電子鎖更換完成後，舊的傳統鎖會如何處理？", "expected": "說明技師通常會將舊鎖交還客戶保存", "answer": "更換電子鎖後，師傅通常會將拆下來的舊鎖交還給您自行保存，我們不負責回收舊鎖喔！\n\n建議您可以先留著，未來如果搬家或有其他需求想換回傳統鎖時，舊鎖就能派上用場。請問您是近期有安裝需求，還是已經預約好師傅了呢？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "2/3", "verdict": "pass", "reason": "keyword 2/3", "elapsed_sec": 3.1, "simplified_chars": []}, {"id": "S-9", "category": "報價客服", "question": "為什麼建議在早上十點半或下午一點半施工？", "expected": "解釋是為了遵守社區大樓的噪音管制規定", "answer": "這主要是為了遵守社區大樓的噪音管制規定喔！\n\n因為安裝電子鎖時可能會涉及鑽孔或切割，會產生較大的聲響。建議預約在**早上 10:30** 或**下午 1:30** 開始施工，通常這段時間是社區允許施工的時段，比較不會吵到鄰居或被管委會關切。\n\n請問您是近期有安裝需求，想要預約師傅過去嗎？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 3.1, "simplified_chars": []}, {"id": "S-10", "category": "報價客服", "question": "有網路連線功能的電子鎖，對生活有哪些具體好處？", expected": "告知無法提供食譜，引導回歸電子鎖話題", "answer": "不好意思，我這邊是「鎖市」電子鎖的智慧客服，專門幫大家解決電子鎖的疑難雜症。\n\n牛肉麵怎麼煮我可能不太在行，但如果您家裡的電子鎖有任何設定、沒電或是打不開的問題，我隨時都在喔！請問您的電子鎖目前使用還順利嗎？", "skills_loaded": [], "keyword_hits": "1/2", "verdict": "pass", "reason": "keyword 1/2", "elapsed_sec": 1.6, "simplified_chars": []}, {"id": "E-1", "category": "硬體維修", "question": "換完電池還是會一直無法上鎖", "expected": "應確認電池品牌是否正確，建議使用 Panasonic 鹼性電池", "answer": "首先要提醒您，**金鼎（Duracell）電池因為電力輸出特性，容易造成電子鎖馬達電壓不足或漏液**，這很可能就是換了電池卻還是無法順利帶動鎖舌上鎖的原因。建議您先更換為「Panasonic 國際牌鹼性電池（黑標）」再觀察看看。\n\n另外，因為您的鎖是自動上鎖的，請幫我確認一下：\n1. 門打開時，用手壓住側邊三角形感應器，鎖舌會伸出來嗎？\n2. 關門後，門跟門框之間有沒有貼合？（如果縫隙太大壓不到感應器，鎖就不會動）\n\n如果換了電池且手壓感應器也沒反應，可能需要安排師傅檢查。請問您的型號是 AI-99 還是 A90 呢？", "skills_loaded": ["troubleshoot", "ts-auto-lock"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 8.8, "simplified_chars": []}, {"id": "E-2", "category": "硬體維修", "question": "螢幕一直閃爍，無法感應任何開鎖方式", "expected": "鎖栓可能卡到門框受口片，需先將門拉或推至關好門的位置", "answer": "螢幕閃爍且無法感應，通常是鎖栓卡到門框受口片，導致系統偵測異常而拒絕操作。您可以先試試看這兩個方法：\n\n1. **推緊門板**：先將門往門框方向「推緊」或「拉緊」，讓鎖栓能順利對準受口片，再嘗試感應開鎖。\n2. **緊急供電**：若電力不足也可能導致感應失效，可用行動電源接在鎖體底部的 Type-C 接口試試。\n\n為了給您更精準的排查步驟，請問您的 Chatlock 是 AI-99、A90 還是其他型號呢？", "skills_loaded": ["troubleshoot"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 5.5, "simplified_chars": []}, {"id": "E-3", "category": "硬體維修", "question": "Chatlock電子鎖網路一直斷線", "expected": "檢查室內螢幕是否插好安裝正確（網路模組在螢幕裡），確認 2.4G 與 5G 頻道是否分開，是否為 mesh 或 WiFi 6/7 以上路由器", "answer": "Chatlock 電子鎖網路不穩或離線，通常與 Wi-Fi 頻段設定有關。您可以先嘗試以下幾個簡單的排查步驟：\n\n1. **確認 Wi-Fi 頻段**：電子鎖僅支援 **2.4GHz** 頻段。如果您的路由器開啟了「雙頻合一」功能（2.4G 與 5G 使用同一個名稱），建議進入路由器設定將兩個頻段分開，並讓鎖連線至 2.4G 訊號。\n2. **檢查路由器位置**：如果鎖與路由器之間隔了太多道牆，訊號太弱也會導致斷線。\n3. **重新配網**：若上述設定都正確，建議在 APP 中刪除設備，並按照配對流程重新連線一次。\n\n為了更精確地協助您，請問您的型號是 **AI-99**、**A90** 還是 **AI-88** 呢？不同型號的網路模組設定可能會有些微差異。", "skills_loaded": ["troubleshoot", "product-knowledge"], "keyword_hits": "2/4", "verdict": "pass", "reason": "keyword 2/4", "elapsed_sec": 12.4, "simplified_chars": []}, {"id": "E-4", "category": "硬體維修", "question": "家中是mesh路由器，電子鎖網路很不穩定", "expected": "Mesh 路由器可能導致視訊開門卡頓不穩定，建議使用獨立的 2.4GHz 或 IoT Network", "answer": "AI-99 在 Mesh 網路環境下，確實容易因為路由器自動切換頻段或節點，導致連線不穩或視訊卡頓。\n\n您可以先嘗試以下幾個方法改善：\n1. **確認頻段**：請檢查路由器設定，確保電子鎖連接的是 **2.4GHz** 頻段，因為電子鎖不支援 5GHz。\n2. **固定節點**：如果您的 Mesh 系統支援，建議在 APP 中將電子鎖「綁定」在距離最近的那個路由器節點上，避免它在不同節點間切換。\n3. **關閉快速漫遊**：部分 Mesh 的「快速漫遊 (Roaming)」功能會導致電子鎖斷線，可以試著針對電子鎖這個裝置關閉該功能。\n\n如果調整後還是不穩定，建議您可以提供路由器的型號，我再幫您確認是否有特定的設定需要調整。", "skills_loaded": ["troubleshoot"], "keyword_hits": "3/3", "verdict": "pass", "reason": "keyword 3/3", "elapsed_sec": 6.0, "simplified_chars": []}, {"id": "E-5", "category": "硬體維修", "question": "Chatlock推拉電子鎖轉把手後不會自己彈回正，會卡住", "expected": "判斷為機械問題，建議派工請師傅到場檢修調整", "answer": "鎖舌卡在中間通常是因為鎖栓與門框的受口片產生摩擦力，導致馬達帶不動鎖舌。您可以嘗試以下方法排除：\n\n1. **推緊/拉緊門片**：如果您在門外，請先將門往內「推緊」或往外「拉緊」，讓鎖舌對準門框孔位消除壓力，再嘗試用指紋或密碼解鎖。\n2. **手動轉把輔助**：如果您在室內，請一邊推拉門片，一邊嘗試手動轉動轉把，幫助鎖舌縮回。\n3. **檢查電力**：若馬達聲音聽起來很虛弱，可能是電力不足，請嘗試用行動電源接底部的 Type-C 孔緊急供電後再試。\n\n請問您現在是在門內還是門外？另外您的型號是 AI-99 還是 A90 呢？確認型號後我能提供更精準的步驟。", "skills_loaded": ["troubleshoot", "product-knowledge"], "keyword_hits": "0/2", "verdict": "fail", "reason": "keyword 0/2", "elapsed_sec": 17.5, "simplified_chars": []}, {"id": "E-6", "category": "硬體維修", "question": "為什麼只有動畫在跑動但是沒有感應人臉辨識？", "expected": "確認鏡頭兩旁是否有紅燈亮起，沒有紅燈代表經過的人較多導致感應太多次失敗，先使用其他方式開門", "answer": "AI-99 出現動畫在跑但沒感應人臉，通常是感應器暫時偵測不到環境變化，或是設定上的小問題。\n\n您可以先嘗試以下幾個簡單的排查動作：\n1. **手動喚醒感應器**：請用手掌遮擋一下人臉感應器（鏡頭區域），再移開讓它重新偵測。\n2. **檢查鏡頭遮擋**：確認鏡頭表面有沒有指紋油汙或灰塵，可以用乾淨的乾布輕輕擦拭。\n3. **檢查感應距離**：建議站在門前約 40-80 公分處，並確保環境光線不要太暗或有強烈背光。\n\n如果以上動作都沒有改善，可能是 APP 裡的「人臉感應」功能不小心被關掉了，或是需要重新校正。請問您最近有更換過電池，或是調整過 APP 裡的設定嗎？", "skills_loaded": ["troubleshoot"], "keyword_hits": "1/3", "verdict": "partial", "reason": "keyword 1/3", "elapsed_sec": 5.8, "simplified_chars": []}, {"id": "E-7", "category": "硬體維修", "question": "請問我的門可以安裝嗎？", "expected": "請客戶提供門的正面、背面、側面、門框位置的照片以進行評估", "answer": "沒問題，我可以幫您初步評估！為了確認您的門是否適合安裝電子鎖，需要麻煩您提供以下資訊：\n\n1. 是新門要安裝，還是現有門要更換電子鎖呢？\n2. 方便請您拍一張門的「正面」以及「側面鎖匣（
