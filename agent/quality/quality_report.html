ted": "解釋其具備感應器，當門關閉後會自動驅動鎖栓伸出上鎖。", "answer": "您好！全自動鎖匣的鎖舌感應機制主要是透過內建的鎖舌或鎖榫感應器來運作。當門關上時，這個感應器會偵測到門已到位，然後自動伸出鎖舌完成上鎖。\n\n請問您的電子鎖是什麼品牌和型號呢？這樣我可以提供更詳細的資訊給您。", "skills_loaded": ["product-knowledge"], "keyword_hits": "2/3", "verdict": "pass", "reason": "AI回答完整解釋了感應器如何偵測門關閉並自動上鎖，完全符合預期方向。", "elapsed_sec": 2.6}, {"id": "H-5", "category": "硬體維修", "question": "鎖舌在室內拉不開門的緊急處理？", "expected": "指導「先將門推緊，再拉動把手」的緩解動作。", "answer": "聽起來有點著急，這情況通常是門跟門框擠壓到，導致鎖舌卡住了。\n\n請您試試看，在拉動室內把手的「同時」，用另一隻手或身體「用力把門推緊」，不要留縫隙，然後再拉開門。\n\n這個動作可以消除鎖舌跟門框之間的壓力，讓它可以順利縮回去。您先試試看這個方法！", "skills_loaded": ["troubleshoot", "ts-lock-tongue-chatlock"], "keyword_hits": "3/3", "verdict": "pass", "reason": "AI回答的核心動作與預期方向完全一致，並提供了合理的解釋。", "elapsed_sec": 21.7}, {"id": "H-6", "category": "硬體維修", "question": "鎖在室外推不開門的緊急處理？", "expected": "指導「先拉緊把手使門閉合，完成解鎖後再用力推動」。", "answer": "您好，Dormakaba 的鎖因為是擺動式設計，如果門跟門框貼太緊，有時候會卡住。\n\n請您先試著用力把門往自己的方向拉緊，不要放手，然後再按一次解鎖，試試看能不能推開。\n\n另外想請問，您在按解鎖的時候，有聽到鎖頭發出「嗡嗡」的馬達運轉聲嗎？如果這個方法沒用，也可以先找找鎖體下方蓋子裡，通常會有備用鑰匙孔可以應急喔。", "skills_loaded": ["troubleshoot", "ts-door-stuck-dormakaba"], "keyword_hits": "2/3", "verdict": "pass", "reason": "AI回答的核心步驟「拉緊門、解鎖、推開」完全符合預期方向，並提供了額外的診斷和備用方案，提升了實用性。", "elapsed_sec": 28.9}, {"id": "H-7", "category": "硬體維修", "question": "門扇反弓會對鎖舌造成什麼具體影響？", "expected": "指出鉸鏈區域擠壓問題會導致鎖舌與受口片卡澀難開，也可能會無法開啟。需將門先拉緊或推緊後解鎖，再放開手才能開門。", "answer": "您好，門扇反弓通常是門扇本身或鉸鏈變形造成的，而不是電子鎖的故障喔。\n\n當門扇反弓時，最直接的影響就是會讓電子鎖的「鎖舌」跟門框上的「受口片」（就是鎖舌要伸進去的那個孔洞）位置對不準。這樣會導致幾個問題：\n\n1.  **開關門困難**：您會覺得門很卡，要很用力才能關上。\n2.  **自動上鎖失敗**：因為鎖舌對不準或被卡住，門關上後，鎖舌伸不出來，鎖就不會自動上鎖。\n3.  **門縫過大**：門關上後，門扇跟門框之間可能還是會有明顯的縫隙。\n\n這種情況需要請師傅到現場實際檢查，調整門扇或鉸鏈才能解決，比較沒辦法透過遠端設定來改善。", "skills_loaded": ["troubleshoot", "ts-door-rebound"], "keyword_hits": "4/4", "verdict": "pass", "reason": "AI 回答指出鎖舌與受口片對不準導致開關門困難，符合預期方向中『卡澀難開』的核心意思，並提供了其他相關影響。", "elapsed_sec": 23.2}, {"id": "H-8", "category": "硬體維修", "question": "出現關鎖失敗警報時，使用者可以如何自行初步排查？", "expected": "指導在開門狀態下測試鎖栓伸縮是否正常，之後再確認是否為受口位移造成。", "answer": "好的，關於 Dormakaba 電子鎖的關鎖失敗警報，您可以這樣自己檢查看看。\n\n這個警報聲通常是「長鳴 3 秒」，代表鎖舌沒有成功伸進門框的洞裡。最常見的原因就是鎖舌跟門框的「受口片」位置沒有對準。\n\n您可以做一個簡單的測試：\n1. 把門打開。\n2. 在門打開的狀態下，手動把鎖鎖上。\n\n如果門打開時，鎖舌可以順利伸出來，那就代表鎖本身沒問題，是門跟門框的對位跑掉了。這時候可以檢查門框上的受口片，看看是不是有鬆動或跑位，導致鎖舌撞到邊邊。", "skills_loaded": ["troubleshoot", "ts-alarm-dormakaba"], "keyword_hits": "1/3", "verdict": "pass", "reason": "AI 回答完整涵蓋了預期方向中的兩個主要排查步驟：開門測試鎖栓伸縮，以及檢查受口位移。", "elapsed_sec": 24.3}, {"id": "H-9", "category": "硬體維修", "question": "Dormakaba 雙重認證模式啟動後會有什麼現象？", "expected": "說明單一指紋或密碼或卡片將無法開門，需兩者同時驗證。如果只有管理者密碼可以開門，但是其他卡片或是指紋無法開門，就是啟動的雙重驗證模式，需將其解除。", "answer": "好的，關於 Dormakaba 的雙重認證模式，啟動後最主要的現象就是，您會需要用「兩種不同」的驗證方式組合才能開門。\n\n例如，要先輸入密碼再刷卡，或是先用指紋再輸入密碼，這樣才能成功解鎖。\n\n有時候會感覺好像只有管理者密碼能用，但其他指紋或卡片都失效，這通常就是不小心開到雙重認證了。如果您想關掉這個功能，可以試試看這個步驟：先把門打開，按下 'Close' 鍵，輸入您的管理者密碼後按「*」，再按數字「8」就可以了。", "skills_loaded": ["product-knowledge", "ts-dual-auth-dormakaba"], "keyword_hits": "4/4", "verdict": "pass", "reason": "AI回答完整說明了雙重認證模式啟動後的現象，並涵蓋了預期回答方向中的所有關鍵點，甚至提供了額外的解除步驟，表現良好。", "elapsed_sec": 20.0}, {"id": "H-10", "category": "硬體維修", "question": "Chatlock貓眼鏡頭旁閃爍紅燈的含義？", "expected": "說明鏡頭正在主動啟動人臉或掌靜脈辨識，屬於正常工作狀態。", "answer": "您好，貓眼鏡頭旁的紅燈亮起，是代表電子鎖正在啟動人臉或掌靜脈的辨識功能，這是正常的喔！\n\n為了防止剛關門離開的人又被辨識開門，電子鎖上鎖後大約會有 20 秒的「防回頭時間」，期間內紅燈不會主動亮起。\n\n如果您在這段時間需要使用人臉辨識，只要用手觸摸一下螢幕，就能喚醒電子鎖，紅燈也會馬上亮起開始感應了。", "skills_loaded": ["troubleshoot", "ts-face-chatlock"], "keyword_hits": "3/3", "verdict": "pass", "reason": "AI回答清楚說明紅燈含義為正常辨識狀態，並提供額外實用資訊，完全符合預期方向。", "elapsed_sec": 21.2}, {"id": "S-1", "category": "報價客服", "question": "預約師傅到府安裝電子鎖的具體流程？", "expected": "說明諮詢、照片評估、選型、支付全額，將鎖寄出給客戶，排期安裝日期及教學。", "answer": "好的，預約師傅到府安裝電子鎖的流程是這樣的：\n\n1.  **諮詢**：我們會先了解您的需求。\n2.  **門扇評估**：您可以提供門的正面和鎖匣部分的照片，或者我們可以安排現場勘查。\n3.  **選擇方案**：根據您的預算、對外觀和功能的需求，我們會提供適合您的方案。\n4.  **決定與支付訂金**。\n5.  **安排安裝時間**。\n6.  **完工教學**：安裝完成後，師傅會教您如何設定管理者、新增用戶以及緊急供電操作。\n\n請問您是新門要安裝，還是現有門要更換電子鎖呢？方便提供門的正面和鎖匣部分的照片給我評估嗎？", "skills_loaded": ["dispatch-guide"], "keyword_hits": "4/4", "verdict": "pass", "reason": "AI回答涵蓋了預期方向中的所有核心步驟，僅在支付細節（訂金 vs 全額）和鎖的寄送方式上略有不同，但不影響整體流程的理解。", "elapsed_sec": 2.8}, {"id": "S-2", "category
