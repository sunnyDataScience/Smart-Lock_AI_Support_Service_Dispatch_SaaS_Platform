# ==========================================
# Component Graph - Smart Lock Domain
# ==========================================
# Source data:
#   - Real locksmith component knowledge
#   - Brand catalogs: Milre, AiLock, dormakaba, Philips, Kaadas
#
# Hardware architecture:
#   Front machine (exterior panel) ←ribbon cable→ Rear machine (interior panel)
#   Lock body (mortise) sits inside the door
#   Receiver plate on the door frame
#
# Field descriptions:
#   label         — component Chinese name
#   type          — module | bus | board | power | structure | communication
#   group         — physical grouping: exterior, interior, lock_body,
#                   door_frame, power, communication, structure
#   connects_to   — direct physical/electrical connections
#   part_of       — parent assembly (optional)
#   powered_by    — power source
#   shared_fault  — downstream components affected when this fails
#   brands        — brand-specific notes (optional)
# ==========================================


# ==========================================================
# Group: exterior (Front Machine / Exterior Panel)
# ==========================================================

[components.front_panel]
label        = "前機 (外面板總成)"
type         = "board"
group        = "exterior"
connects_to  = ["ribbon_cable"]
powered_by   = "power_supply"
shared_fault = ["fingerprint_sensor", "keypad", "card_reader", "camera", "screen", "alarm_speaker"]

[components.fingerprint_sensor]
label        = "指紋感應器"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []

[components.keypad]
label        = "密碼觸控鍵盤"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []

[components.card_reader]
label        = "卡片/NFC 感應模組"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []

[components.camera]
label        = "鏡頭 (人臉辨識)"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []
brands       = { Kaadas = "藍寶堅尼3D人臉辨識搭載", AiLock = "七合一旗艦款搭載" }

[components.screen]
label        = "螢幕顯示模組"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []
brands       = { AiLock = "AI99/A90/AI88螢幕整合Wi-Fi模組" }

[components.alarm_speaker]
label        = "警報蜂鳴器/喇叭"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "front_panel"
shared_fault = []

[components.emergency_power_port]
label        = "緊急供電接口 (USB Type-C)"
type         = "module"
group        = "exterior"
part_of      = "front_panel"
connects_to  = ["front_panel"]
powered_by   = "external"
shared_fault = []
brands       = { dormakaba = "位於外側把手底部" }


# ==========================================================
# Group: interior (Rear Machine / Interior Panel)
# ==========================================================

[components.rear_panel]
label        = "後機 (內面板總成)"
type         = "board"
group        = "interior"
connects_to  = ["ribbon_cable"]
powered_by   = "power_supply"
shared_fault = ["handle", "lock_unlock_button", "reset_button"]

[components.handle]
label        = "內側把手"
type         = "module"
group        = "interior"
part_of      = "rear_panel"
connects_to  = ["clutch"]
shared_fault = ["clutch"]

[components.clutch]
label        = "離合器"
type         = "module"
group        = "interior"
part_of      = "rear_panel"
connects_to  = ["handle", "lock_body"]
shared_fault = ["handle"]
brands       = { Philips = "紅燈閃3次=離合器異常", dormakaba = "紅燈閃4次=馬達異常可能關聯離合器" }

[components.lock_unlock_button]
label        = "室內開關鎖鈕"
type         = "module"
group        = "interior"
part_of      = "rear_panel"
connects_to  = ["ribbon_cable"]
powered_by   = "rear_panel"
shared_fault = []

[components.reset_button]
label        = "重置按鈕"
type         = "module"
group        = "interior"
part_of      = "rear_panel"
connects_to  = ["mainboard"]
shared_fault = []

[components.battery_compartment]
label        = "電池槽"
type         = "module"
group        = "interior"
part_of      = "rear_panel"
connects_to  = ["power_supply"]
shared_fault = ["power_supply"]


# ==========================================================
# Group: lock_body (Mortise / Lock Body)
# ==========================================================

[components.lock_body]
label        = "鎖體 (mortise)"
type         = "structure"
group        = "lock_body"
connects_to  = ["motor", "latch", "deadbolt", "tongue_sensor"]
shared_fault = ["latch", "deadbolt", "motor", "tongue_sensor"]

[components.latch]
label        = "斜舌"
type         = "module"
group        = "lock_body"
part_of      = "lock_body"
connects_to  = ["receiver_plate"]
shared_fault = []

[components.deadbolt]
label        = "鎖栓 (方舌/主鎖舌)"
type         = "module"
group        = "lock_body"
part_of      = "lock_body"
connects_to  = ["motor", "receiver_plate"]
shared_fault = []

[components.motor]
label        = "馬達"
type         = "module"
group        = "lock_body"
part_of      = "lock_body"
connects_to  = ["motor_driver", "deadbolt"]
powered_by   = "mainboard"
shared_fault = ["deadbolt"]
brands       = { dormakaba = "紅燈閃4次=馬達異常(需派工)", Kaadas = "紅燈閃5次=馬達堵轉(需派工)" }

[components.tongue_sensor]
label        = "鎖舌感應器 (自動上鎖型)"
type         = "module"
group        = "lock_body"
part_of      = "lock_body"
connects_to  = ["mainboard"]
powered_by   = "mainboard"
shared_fault = []
brands       = { Milre = "長鳴不斷=鎖舌感應異常" }

[components.motor_driver]
label        = "馬達驅動電路"
type         = "bus"
group        = "lock_body"
part_of      = "mainboard"
connects_to  = ["motor"]
shared_fault = ["motor"]


# ==========================================================
# Group: door_frame (Door Frame Components)
# ==========================================================

[components.receiver_plate]
label        = "受口片 (strike plate)"
type         = "structure"
group        = "door_frame"
connects_to  = ["latch", "deadbolt"]
shared_fault = []

[components.door_structure]
label        = "門扇/門框結構"
type         = "structure"
group        = "door_frame"
connects_to  = ["lock_body", "receiver_plate", "hinge"]
shared_fault = ["receiver_plate"]

[components.hinge]
label        = "鉸鏈"
type         = "structure"
group        = "door_frame"
part_of      = "door_structure"
connects_to  = ["door_structure"]
shared_fault = ["receiver_plate"]


# ==========================================================
# Group: power (Power System)
# ==========================================================

[components.power_supply]
label        = "電源供應 (電池)"
type         = "power"
group        = "power"
connects_to  = ["battery_compartment", "mainboard"]
shared_fault = ["mainboard", "front_panel", "rear_panel"]

[components.mainboard]
label        = "主機板 (MCU)"
type         = "board"
group        = "power"
powered_by   = "power_supply"
connects_to  = ["ribbon_cable", "motor_driver", "tongue_sensor"]
shared_fault = [
    "fingerprint_sensor", "keypad", "card_reader", "camera",
    "screen", "motor", "alarm_speaker", "wifi_module",
    "lock_unlock_button",
]

[components.firmware]
label        = "韌體"
type         = "module"
group        = "power"
part_of      = "mainboard"
shared_fault = []
brands       = { Milre = "面板全亮後熄滅=主機板異常(需派工)" }


# ==========================================================
# Group: communication (Communication Modules)
# ==========================================================

[components.ribbon_cable]
label        = "排線 (前後機連接線)"
type         = "bus"
group        = "communication"
connects_to  = ["front_panel", "rear_panel", "mainboard"]
shared_fault = ["fingerprint_sensor", "keypad", "card_reader", "camera", "screen", "alarm_speaker"]

[components.wifi_module]
label        = "Wi-Fi 模組 (2.4GHz)"
type         = "communication"
group        = "communication"
connects_to  = ["mainboard"]
powered_by   = "mainboard"
shared_fault = []
brands       = { AiLock = "AI99/A90/AI88整合於螢幕模組中, 間歇嗶聲每30秒=Wi-Fi斷線" }

[components.bluetooth_module]
label        = "藍牙模組"
type         = "communication"
group        = "communication"
connects_to  = ["mainboard"]
powered_by   = "mainboard"
shared_fault = []


# ==========================================================
# Group: structure (Structural / Installation)
# ==========================================================

[components.side_plate]
label        = "側板 (faceplate)"
type         = "structure"
group        = "structure"
part_of      = "lock_body"
connects_to  = ["lock_body"]
shared_fault = []
brands       = { notes = "規格因標準而異: 歐規/美規/義大利規/日規/韓規" }


# ==========================================================
# Brand-Specific Overrides
# ==========================================================
# Merged at runtime by KnowledgeLoader.get_component_graph(brand=...)
# Only fields that differ from the shared tree are listed.

[brand_overrides.dormakaba.components.motor]
error_codes    = ["紅燈閃4次=馬達異常", "紅燈常亮=系統錯誤"]
dispatch_signals = ["red_flash_4", "red_steady_on"]
notes          = "dormakaba 馬達異常以紅色 LED 閃爍4次為特徵信號"

[brand_overrides.dormakaba.components.mainboard]
error_codes    = ["紅燈常亮=系統錯誤"]
dispatch_signals = ["red_steady_on"]

[brand_overrides.Kaadas.components.motor]
error_codes    = ["紅燈閃5次=馬達堵轉"]
dispatch_signals = ["red_flash_5"]
notes          = "Kaadas 馬達堵轉以紅色 LED 閃爍5次為特徵信號"

[brand_overrides.Kaadas.components.camera]
label          = "3D人臉辨識鏡頭"
notes          = "Kaadas 高階款搭載 3D 結構光人臉辨識"

[brand_overrides.Philips.components.clutch]
error_codes    = ["紅燈閃3次=離合器故障"]
dispatch_signals = ["red_flash_3"]
notes          = "Philips 離合器故障以紅色 LED 閃爍3次為特徵信號"

[brand_overrides.Milre.components.mainboard]
error_codes    = ["全燈亮後熄滅=主機板故障", "鎖舌感應器異常"]
dispatch_signals = ["all_lights_on_then_off"]
notes          = "Milre 主機板故障以全燈同時亮後熄滅為特徵信號"

[brand_overrides.Milre.components.tongue_sensor]
error_codes    = ["鎖舌感應器異常"]
notes          = "Milre 鎖舌感應器較敏感，需定期校正"
