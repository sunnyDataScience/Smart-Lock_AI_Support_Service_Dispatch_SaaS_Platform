# ==========================================
# Symptom Taxonomy - Smart Lock Domain
# ==========================================
# Source data:
#   - 06_客戶常用口語對照表.md (colloquial → technical mappings)
#   - 07_故障分類體系.md (7 fault categories)
#   - 03_故障碼_蜂鳴聲_燈號對照表.md (brand-specific error codes)
#
# Field descriptions:
#   id          — unique symptom identifier
#   label       — standard Chinese name (for logs and reports)
#   aliases     — colloquial user expressions (for LLM mapping)
#   component   — related hardware component (for Tier 2 correlation)
#   severity    — 1 (minor) to 5 (critical/safety)
#   category    — fault classification from 07_故障分類體系
#   brands      — brand-specific notes (optional)
# ==========================================


# ==========================================================
# Category 1: 門扇卡死無法開啟 (Physical Deadlock)
# ==========================================================

[symptoms.lock_tongue_stuck]
label     = "鎖舌卡死"
aliases   = [
    "鎖卡住了", "門打不開", "鎖死了", "門卡住", "開不了門",
    "被鎖在外面", "鑰匙轉不動", "鎖舌卡住",
    "長嗶+馬達聲+無法開門",
]
component = "lock_body"
severity  = 5
category  = "door_physical"

[symptoms.motor_sound_no_open]
label     = "馬達有聲但門不開"
aliases   = [
    "有聽到馬達聲但打不開", "鎖有反應但開不了", "聽到聲音但卡住",
    "馬達在轉但門不動",
]
component = "motor"
severity  = 5
category  = "door_physical"

[symptoms.receiver_plate_misalign]
label     = "受口片偏移"
aliases   = [
    "鎖舌插不進去", "門框那邊對不上", "鎖舌撞到門框",
    "受口片歪了", "鎖舌卡到鐵片",
]
component = "receiver_plate"
severity  = 4
category  = "door_physical"

[symptoms.handle_stuck]
label     = "把手卡死/離合器故障"
aliases   = [
    "把手轉不動", "把手卡住", "把手沒有作用",
    "轉把手沒反應", "把手空轉",
]
component = "handle"
severity  = 4
category  = "door_physical"
brands    = { Philips = "紅燈閃3次=離合器異常(需派工)" }

[symptoms.locked_out_urgent]
label     = "被鎖在外面(緊急)"
aliases   = [
    "被鎖在外面", "進不了門", "出不了門", "鑰匙忘在裡面",
    "人在外面打不開", "回不了家",
]
component = "lock_body"
severity  = 5
category  = "door_physical"

[symptoms.door_scraping]
label     = "門扇磨擦"
aliases   = [
    "門很難推", "門會卡到地板", "門擦到門框", "開門很緊",
]
component = "door_structure"
severity  = 3
category  = "door_physical"


