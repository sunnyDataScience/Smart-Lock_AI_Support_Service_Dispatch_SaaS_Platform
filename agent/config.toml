# ============================================================
# Agent Skills — config.toml
# 所有設定集中管理，零硬編碼
# ============================================================

# ── 1. 系統設定 ──
[system]
domain          = "電子鎖、智慧門鎖相關的產品諮詢、故障排除、安裝派工"
agent_name      = "smart_lock_agent"
request_timeout = 120    # 秒，Phase 0 暫時拉長以止血；Phase 2 完成後再砍回 60-90s

# ── 2. LLM 設定（LiteLLM 格式）──
# Gemini 2.5 Flash GA：穩定 quota（~1000 RPM、4M TPM）、SLA 有保障
# Gemini 3 Flash 待 GA 後再切（preview quota 嚴格，會在生產環境踩 rate limit）
[llm]
model            = "vertex_ai/gemini-2.5-flash"
temperature      = 0.3
thinking_budget  = 512    # 客服場景以 SOP 引導為主，不需深度推理

# ── 3. LINE Bot 設定 ──
[line_bot]
channel_secret_env       = "LINE_CHANNEL_SECRET"
channel_access_token_env = "LINE_CHANNEL_ACCESS_TOKEN"
loading_seconds          = 60
max_reply_length         = 5000

# ── 4. 對話記憶 ──
[memory]
type                   = "postgres"  # "memory" (in-process) | "sqlite" | "postgres"
postgres_uri_env       = "POSTGRES_URI"
compression_enabled    = true        # H5 記憶壓縮開關
max_messages_threshold = 12          # 訊息數超過此值時觸發壓縮
context_retention_pair = 5           # 壓縮後保留最近 N 輪對話
llm_model              = "vertex_ai/gemini-2.5-flash"  # 壓縮摘要用模型

# ── 5. 技能系統 ──
[skills]
data_dir = "skills/data"

# ── 6. 提示詞檔案路徑 ──
[prompts]
system_prompt          = "prompts/system.md"
transfer_human_form    = "prompts/transfer_human.md"
summarize_prompt       = "prompts/summarize_messages.md"
update_profile_prompt  = "prompts/update_profile.md"

# ── 7. 安全設定 (H6) ──
[safety]
enabled            = true
dangerous_keywords = ["拆開電路板", "剪斷電線", "破壞鎖芯", "撬開"]
block_response     = "為了您的安全，我無法提供這類操作指導。如需協助，請聯繫專業技術人員。"

# ── 7.5. 輸出驗證 (H7.5) ──
[output_validator]
enabled            = false
max_retries        = 1
prompt_path        = "prompts/validate_output.md"
forbidden_phrases  = [
    "載入技能", "查詢資料", "幫您搜尋", "讓我查一下",
    "我需要查詢手冊", "請稍等我載入技能", "工具呼叫",
    "tool call", "load_skill", "系統正在處理",
]
skip_markers       = ["📋", "已為您轉接", "轉接表單"]

# ── 8. 審計日誌 ──
[storage]
type             = "postgres"
postgres_uri_env = "POSTGRES_URI"
# sqlite_path = "./data/db/audit_log.db"

# ── 9. Debounce 防抖設定 (H3) ──
[debounce]
enabled          = true   # 關閉時訊息直接進入 Agent（不合併）
buffer_wait      = 1.0    # 秒，最後一則訊息後等待時間
buffer_ttl       = 300    # 秒，緩衝區過期清理
cleanup_interval = 60     # 秒，清理迴圈間隔
media_extra_wait = 10     # 秒，等待媒體處理完成

# ── 9. 多模態處理（passthrough 模式：媒體直接送入 Agent） ──
[multimodal]
enabled          = true
download_timeout = 10             # 秒，LINE 媒體下載超時
max_file_size_mb = 10             # MB，超過此大小的媒體不處理
sticker_reply    = "收到您的貼圖了！請問有什麼關於電子鎖的問題我可以幫忙的嗎？"
fallback_text    = "抱歉，我無法處理您傳送的{media_type}。請用文字描述您的問題。"

[multimodal.storage]
type       = "gcs"         # "local" (本地檔案) | "gcs" (Google Cloud Storage)
local_path = "./data/media" # local 模式使用
gcs_bucket = "lock-ai"      # GCS 模式：bucket 名稱（或設環境變數 GCS_MEDIA_BUCKET）
# gcs_prefix = "media"      # GCS 模式：物件路徑前綴

# ── 10. 回覆模板 ──
[templates]
push_fallback_prefix = "【系統通知】讓您久等了，以下是您的回覆：\n"
error_timeout        = "不好意思，系統處理時間過長，請稍後再試一次。"
error_no_reply       = "抱歉，系統沒有產生回覆。"
error_system         = "不好意思，系統大腦剛剛稍微當機了一下，請稍後再試一次！"

# ── 11. 用戶畫像 ──
[user_profile]
enabled     = false
facts_enabled = true
facts_postgres_uri_env = "POSTGRES_URI"
fact_attributes = ["phone", "address", "device_model", "device_brand"]

# ── 12. Quick Reply 快速回覆 ──
[quick_reply]
enabled = true

