# LockCore 鎖匠客服 agent 設定
# 把 LiteLLM 供應商 / 記憶等設定從程式碼獨立出來。由 lockcore/app_config.py 載入。
# 機密(服務帳號金鑰)不放這裡,只放路徑;金鑰檔 credentials.json 已 gitignore。

[llm]
# LiteLLM model 字串,供應商靠前綴路由。常用選項:
#   gemini/gemini-2.5-flash         → Google AI Studio(只需 .env 設 GEMINI_API_KEY,不用 GCP)
#   vertex_ai/gemini-3.1-flash-lite → Vertex AI(需 project + credentials.json,location 自動 global)
#   ollama_chat/gemma4:latest       → 本機 Ollama(http://localhost:11434,無需金鑰)
model = "vertex_ai/gemini-3.1-flash-lite"
temperature = 0.7
max_tokens = 4096
# 多供應商 failover(ADR-009):主模型連續錯誤→熔斷→依序改用這些 fallback 模型。
# 空/省略 = 不啟用。範例(Vertex 主模型掛掉退到 Google AI Studio 免 GCP):
#   fallback_models = ["gemini/gemini-2.5-flash"]
fallback_models = []

[llm.vertex]
# 僅當 model 以 vertex_ai/ 開頭時生效
project = "cedar-scope-489604-g3"
# location 留空 = 自動:gemini-3.x → "global",其餘 → "us-central1";也可手動指定如 "us-east5"
location = ""
# 服務帳號金鑰路徑(相對 config.toml 或絕對)。會設成 GOOGLE_APPLICATION_CREDENTIALS。
# ⚠️ 機密檔,勿入 git(credentials.json 已 gitignore)。
credentials = "credentials.json"

[memory]
# per-user 記憶
tenant = "locksmart"
# 後端:"sqlite"(本地檔案,預設)或 "postgres"(lock-ai Cloud SQL、agent schema,見 CR-0023)
backend = "sqlite"
# backend="sqlite" 用:DB 路徑;":memory:" = 暫存(重啟清空),正式可改檔案路徑如 "memory.db"
db_path = "memory.db"
# backend="postgres" 用:讀此環境變數取連線字串(機密不入 toml)。需先跑 SQL/migrations/033。
postgres_uri_env = "POSTGRES_URI"
# 抽取器:"llm" = 用 LLM 抽乾淨事實(客人鎖=AS701);"raw" = 整句存(PoC fallback)
extractor = "llm"

[photo_guides]
# CR-0179 方案 B:樣本圖引導映射(key → 公開 HTTPS 圖 URL,非機密)。
# AI 依 SOP 在回覆文末輸出 [[photo-guide:<key>]],gateway 剝除標記並附發 ImageMessage。
# key 全小寫-連字號(避開 reply_guard 型號/價格 regex 形態);圖放 brand-portal
# public/photo-guides/(部署即有公開 URL);本機測試可改 http://localhost:3000/...。
# 注意 LINE ImageMessage 硬性要求 HTTPS、original ≤10MB。
pre-install = "https://smart-lock-web-sjmxp23sqq-de.a.run.app/photo-guides/pre-install.jpg"
booking-install = "https://smart-lock-web-sjmxp23sqq-de.a.run.app/photo-guides/booking-install.jpg"

[mcp_servers.locksmith-rag]
# RAG-via-MCP(ADR-010/WBS 2.2.2):語義檢索兩工具(search_product_manual/search_similar_cases)。
# 啟用條件:RAG_TENANT_ID 與 POSTGRES_URI 環境變數皆有值;缺任一 → 本 server 跳過,
# agent 完全維持既有行為(references 為主路徑;cutover 依 ADR-010 待引用率 gate ≥ 90%)。
# 本機 stdio 直起 agent/rag/(需 uv;CR-0157 起 rag 宿主於 agent/ 之下);
# 容器化部署改 streamableHttp url 指 rag sidecar(cutover 輪處理)。
command = "uv"
args = ["run", "python", "-m", "rag.server"]
cwd = "rag"
tool_timeout = 20

[mcp_servers.locksmith-rag.env]
RAG_TENANT_ID = "${RAG_TENANT_ID}"
POSTGRES_URI = "${POSTGRES_URI}"
