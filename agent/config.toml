# ── 13. 資料修正攔截 ──
[data_correction]
enabled          = true
keyword          = "#資料修正"
reply            = "已收到您的回報，我們會盡快處理，謝謝您！"
postgres_uri_env = "POSTGRES_URI"

# ── 14. OPIK LLM Observability ──
[opik]
enabled       = false  # Phase 0 診斷：暫關以 A/B 排除 callback hang 嫌疑
project_name  = "smart-lock-agent"
api_key_env   = "OPIK_API_KEY"
workspace_env = "OPIK_WORKSPACE"
tags          = ["production"]
