# 開放架構決策登記 —— 唯一可寫入來源
#
# 本檔只記「已接受 ADR 的實作細節仍需跨角色裁決」；不以 Open 狀態覆寫既有 ADR。
# 決策完成後：建立新的 append-only ADR 或在既有 ADR 的 Status 附註補連結，
# 再把本列 status 改為 decided / superseded，並更新受影響的 SAD、SDS、API、部署與 TC。
#
# 欄位定義：
#   id                  OD-*；開放決策的穩定識別碼，不是 ADR 編號。
#   status              open | decided | superseded；open 不可被表述為既定架構。
#   decision            必須由誰在什麼邊界作出哪一個選擇。
#   options             可比較的選項；不可只寫「待確認」。
#   recommended         技術建議，不是決定；除非 approvers 完成裁決，仍維持 open。
#   current_as_built    現在程式/部署已觀察到的事實，與 target 分開。
#   decision_gate       未定前不得跨越的 release 或實作門檻。
#   evidence_required   拍板前必看的證據；不是拍板後的執行結果。
#
# 以下四欄只在 status 從 open 轉為 decided / superseded 時填寫，缺一不可：
#   decided_on          裁決日期 YYYY-MM-DD。
#   decided_by          實際作出裁決的角色；approvers 由他人代行時要寫清楚。
#   resolution          裁決結果本身；寫「選了哪一個、邊界在哪」，不重述 options。
#   resulting_adr       承接本裁決的 append-only ADR 編號；不得原地改寫舊 ADR。
#
# last_updated: 2026-07-28

version: 1

decisions:
  - id: OD-001
    title: OHS 服務間憑證模式
    status: decided
    priority: P0
    owner: PM + 平台架構師
    approvers: 安全負責人 + technician-platform Owner
    decided_on: 2026-07-28
    decided_by: 業主（兼任 approvers 兩角色）
    resolution: >-
      定版受控 opaque service credential（`X-Service-Credential`，生命週期依 ADR-036）為 OHS
      服務間憑證的長期模式。OIDC client-credentials 不否決，改列為重審項：第一個非自建的
      外部接入方（他方 ERP、外部派工商）出現前必須重新評估。裁決理由是 ADR-036 已把
      hash-only、audience/scope、expiry、rotation overlap、revoke 與 audit 這些安全下限
      全部達成，transport 換成 OIDC 不會再提高該下限；而現行三條 caller（agent、refinery、
      technician OHS）全為自建服務，OIDC 主要優勢「不必為每個接入方分發密鑰」目前無人受益。
    resulting_adr: ADR-040
    decision: 品牌 API 呼叫技師共享池 OHS 時，定版 OIDC client-credentials 或 internal token，並定義 audience、scope、輪替、撤銷與跨品牌權限邊界。
    current_as_built: OHS 契約和 api 路徑存在；靜態 API 文件已明示長期模式由 OD-001 定版，現行內部鏈多使用 X-Internal-Token。
    options:
      - OIDC client-credentials：每個 workload identity 取短效 audience/scoped token；適合作為跨服務長期邊界。
      - internal token：單一或少量共享 secret；較快接入，但輪替、最小權限與稽核成本較高，只適合作為過渡。
    recommended: OIDC client-credentials 為目標；保留 internal token 僅限受時限、可輪替、單一過渡鏈路，且不得成為品牌/技師資料面的長期通用憑證。
    decision_gate: 在 OHS 成為 production 派工唯一依賴、或第 2 個品牌接入前，必須定版並完成負向契約測試。
    evidence_required: IdP 能力與 token claims 範例、service-to-service threat model、token 失效/輪替演練、OHS 403/401 契約與 audit 設計。
    affected_adrs: [ADR-004, ADR-016, ADR-022]
    affected_artifacts: [12_SAD §4.5, 15_SDS §7.1, 16_API_Spec.yaml, 13_Security_Architecture.md, 23_Deployment_Guide.md]
    affected_scenarios: [SC-05, SC-12, SC-14]

  - id: OD-002
    title: knowledge-refinery 的資料進入契約
    status: decided
    priority: P0
    owner: PM + 平台架構師
    approvers: Data Owner + Knowledge/Refinery Owner + Security Owner
    decided_on: 2026-07-28
    decided_by: 業主（兼任 approvers 三角色）
    resolution: >-
      定版**受控 API 為 refinery 的唯一主入口**。裁決前提是業主確認 refinery 是要賣給品牌的
      收費附加服務並已列入 roadmap——這推翻了本條原記載的技術建議（該建議寫在「refinery 為
      內部工具」的前提下）。收費產品的資料汲取必須是契約而不是資料庫連線：①每品牌物理分庫下
      直讀代表每開一個品牌就要多配一組唯讀憑證與網路路徑（撞 WBS 3.3.1／3.5.1 開站自動化）；
      ②計費需要逐租戶用量計量，DB 連線沒有計量點；③賣出後 schema 即成契約，品牌端 migration
      會靜默打壞付費產品；④DPA 需要逐筆 provenance 與刪除語義。refinery 的**寫回路徑已走
      受控 API + X-Service-Credential**（apply_behavior.py），本裁決是把讀取路徑收尾到同一條
      契約上，不是新工程。直讀 DB（REFINERY_POSTGRES_URI，現讀 messages／problem_cards／
      knowledge_drafts／tenant 四表）比照 X-Internal-Token 處理：標為 interim、加使用量計數、
      歸零才移除。Kafka/outbox 留作日後量能與延遲優化，是 API 的補充不是取代，且不得在
      KAFKA_BOOTSTRAP 取得 production 證據前承載這條線。
    resulting_adr: ADR-042
    decision: 定版 Refinery 取得診斷對話、問題卡與素材的權威入口：受控 API、批次匯出/唯讀 DB，或 Kafka/outbox event；並定義補數、重播、tenant scope、PII 最小化與 provenance。
    current_as_built: Refinery intake 可用 REFINERY_TENANT_ID + REFINERY_POSTGRES_URI/POSTGRES_URI 直讀品牌資料並 default-deny；Kafka/event backbone 與 API ingestion 均非完整 production contract。
    options:
      - 受控 API：明確 DTO/授權與稽核，讀取延遲較高，需提供 cursor/重試與 bulk 能力。
      - 批次匯出或唯讀 DB：最快可用，必須使用專屬唯讀帳號、資料最小化與嚴格 tenant filter；跨服務耦合較高。
      - Kafka/outbox event：低耦合、可重播，需 schema registry、DLQ、事件順序與 payload 隱私治理；適合規模化但基建未取證。
    recommended: M2 以最小權限唯讀／批次入口完成可稽核 intake；M3 Kafka/outbox 成熟後切換為事件主路徑，API 僅供補數與人工重跑，不讓三種入口同時無規則並存。
    decision_gate: 在把 Refinery 標為 License 可售附加服務、或允許自動排程 intake 前，必須選定一條主入口及其回補規則。
    evidence_required: 資料分類/PII 最小化評估、每個選項的重播與刪除語義、tenant 隔離測試、bronze provenance 範例、成本/延遲量測。
    affected_adrs: [ADR-018, ADR-019, ADR-029, ADR-030]
    affected_artifacts: [12_SAD §4.4, 15_SDS §9, 17_AsyncAPI.yaml, 23_Deployment_Guide.md, 25_Monitoring_Spec.md]
    affected_scenarios: [SC-01, SC-02, SC-15, SC-16]

  - id: OD-003
    title: 技師即時 WebSocket 的權威歸屬
    status: decided
    priority: P0
    owner: PM + 平台架構師
    decided_on: 2026-07-28
    decided_by: 業主（兼任 approvers 三角色）
    resolution: >-
      定版**technician-platform 持有師傅專屬 channel**，brand API 只保留品牌營運 channel。
      裁決依據是業主確認的產品形態：師傅在單一 app 內看到多個品牌／經銷商的需求（Uber 式
      聚合視圖）。由各品牌 API 各自持有 WS 會使師傅 app 必須同時連 N 條線，且沒有任何一方
      能組出統一清單；這也與 ADR-041「技師身分只有一份」不一致——身分是一份，通知線就該是
      一條。**本裁決只涵蓋 channel 歸屬**，不涵蓋派工模式本身。業主同日另確認派工採「指派
      為主、搶單為輔」（指定師傅逾時未接則釋出到公開池），該混合模式在現行 code 完全不存在
      （dispatch_service 只有 candidate 評分排序，師傅端無 accept／reject／搶單），屬產品層
      變更，須另開 CR 走 CIA，不得以本 ADR 代替。實際遷移仍受 Redis（跨實例 fan-out）與
      Kafka（品牌事件投影）的 production 證據約束，兩者現皆為休眠 opt-in。
    resulting_adr: ADR-043
    approvers: Technician Platform Owner + API Owner + SRE
    decision: 定版技師工作台的即時事件由 brand API、technician-platform，或雙層 gateway 哪一方擁有；同時定義 channel 授權、事件 owner、replay、Redis/Kafka 依賴與切換策略。
    current_as_built: tech portal 目前可連品牌 API 的 WS；程式有 Redis bridge 與 technician event consumer，但 REDIS_URL/KAFKA_BOOTSTRAP 的 production 證據不存在，SDS 已連至 OD-003，不把 interim 當 target。
    options:
      - brand API owner：貼近工單 command 真相，技師 portal 必須跨面連線，跨品牌與身份邊界較複雜。
      - technician-platform owner：貼近技師 identity/projection，需保證投影延遲、replay 與品牌事件契約。
      - gateway/聚合層：可統一通道授權，但新增部署與故障域，不得成為未受監控的第四份投影。
    recommended: technician-platform 持有技師專屬 channel 與最小工單投影；brand API 持有品牌營運 channel。先以明確 event schema/replay 驗證，再遷移 portal，禁止同一事件長期雙播而無 owner。
    decision_gate: 在把 API max instances 調高、或宣稱跨 instance 的技師即時派工 SLA 前，必須定版並完成兩實例與斷線復原 SIT。
    evidence_required: 使用者/租戶/channel 授權矩陣、事件延遲預算、disconnect/replay 演練、Redis/Kafka failure trace、前端切換/rollback 計畫。
    affected_adrs: [ADR-006, ADR-016, ADR-017, ADR-022]
    affected_artifacts: [12_SAD §4.5, 15_SDS §7.1, 16_API_Spec.yaml, 17_AsyncAPI.yaml, 23_Deployment_Guide.md]
    affected_scenarios: [SC-05, SC-06, SC-12, SC-14]

  - id: OD-004
    title: Casdoor 跨租戶 organization 與 claim 模型
    status: decided
    priority: P0
    owner: PM + 平台架構師
    approvers: Identity Owner + Security Owner + Technician Platform Owner
    decided_on: 2026-07-28
    decided_by: 業主（兼任 approvers 三角色）
    resolution: >-
      定版「單一平台 principal + brand membership claim」。技師在平台只有一份身分，token 帶
      principal、portal、可操作 brand scope 與版本/撤銷語義，並一次帶齊該技師目前已授權的
      全部品牌；不採「每品牌各複製一份技師帳號」。品牌間的競爭隔離**不由收窄 token scope
      達成**，而是既有的每品牌物理分庫加上 `tech_mirror` 最小化投影（品牌庫不鏡射
      `authorized_brands`、憑證與 PII）——品牌後台在資料層就取不到他牌工單。平台跨品牌治理
      走 platform admin principal（`platform_technicians` 的跨品牌清單與 brand authorization
      授予/撤回），依 ADR-035 不接受以 `X-Tenant-ID` 取得跨品牌權限。
    resulting_adr: ADR-041
    decision: 在「brand org = 租戶」既有方向下，定版跨品牌技師、platform operator、品牌管理員的 organization membership、role/portal/tenant claims、委派管理與撤銷傳播模型。
    current_as_built: ADR-004 已接受 Casdoor 作 IdP、brand org 為租戶；portal claim guard 與 API surface 已有程式，但完整 Casdoor org/claim 映射及 production HA 證據未定。
    options:
      - 單一平台 org + brand membership：技師與平台人員有平台主體，再以品牌 membership/scopes 授權。
      - 每品牌 org 複製技師帳號：模型直觀但違反跨品牌唯一身分，撤銷與 KYC 一致性風險高。
      - external identity + 平台 entitlement graph：彈性最高，但需自建更多 membership/授權服務與稽核能力。
    recommended: 單一平台 principal + brand membership/entitlement claim；token 必須明確帶 principal、portal、可操作 brand scope 與版本/撤銷語義，不以 UI tenant fallback 決定授權。
    decision_gate: 在 Casdoor 成為所有 portal 的唯一登入、或首個跨品牌技師/平台治理 production rollout 前，必須定版。
    evidence_required: claim 範例與最大 token 大小、登入/撤銷/換品牌序列、跨 portal 負向測試、HA/IdP outage 行為、資料保留與刪除責任。
    affected_adrs: [ADR-004, ADR-005, ADR-016, ADR-024]
    affected_artifacts: [12_SAD §4.5 and §8, 13_Security_Architecture.md, 15_SDS §7.1, 16_API_Spec.yaml, 23_Deployment_Guide.md]
    affected_scenarios: [SC-11, SC-12, SC-14, SC-17]
