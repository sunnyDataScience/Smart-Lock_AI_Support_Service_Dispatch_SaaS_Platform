# ── scope: global —— 所有旅程共用的地板，不逐條掛 SC ────────────────
#
# 判準：拿掉任何一條旅程，這條需求依然必須成立。
# 這些需求在驗收控制表不佔列，在測試計畫獨立成段（對應 TS-09/10/11 與 UF-01）。

global:
  - {requirement: FR-WEB-02, note: 登入與路由授權是所有 portal 旅程的前置條件，不屬於任何一條}
  - {requirement: FR-WEB-07, note: 錯誤與離線頁在每條旅程都可能出現}
  - {requirement: FR-PLT-06, note: 可觀測性橫跨全平台，沒有專屬旅程}
  - {requirement: FR-DAT-02, note: migration 可重現是資料層地板，客戶感知不到}
  - {requirement: FR-DAT-05, note: 跨系統同步鏈支撐所有旅程的事件流}
  - {requirement: FR-AGT-08, note: 工具白名單是治理約束，不隨旅程改變}
  - {requirement: NFR-Avail-*, note: 可用性是所有旅程的地板}
  - {requirement: NFR-Aud-*,   note: 稽核鏈完整性橫跨全平台}
  - {requirement: NFR-Sec-*,   note: 安全矩陣逐端點驗證，不對應客戶旅程}
  - {requirement: NFR-Priv-*,  note: 隱私與跨租戶隔離為全域不變式（SC-19 的執行面除外）}
  - {requirement: NFR-Obs-*,   note: 可觀測性同 FR-PLT-06}
  - {requirement: NFR-DQ-*,    note: 資料品質是 pipeline 地板}
  - {requirement: NFR-Maint-*, note: 可維護性針對開發流程，非客戶旅程}
  - {requirement: NFR-DORA-*,  note: 交付效能指標，屬工程治理}
  - {requirement: NFR-A11y-*,  note: 無障礙為全 portal 地板，逐旅程掛會複述 19 次}
  - {requirement: NFR-Scal-*,  note: 容量與擴展為 3-5 年架構地板（SC-05 的併發接單面除外）}
  - {requirement: NFR-Sch-*,   note: schema 演進與 migration 可重套，客戶感知不到}
  - {requirement: NFR-Rep-*,   note: pipeline 可重現屬資料工程地板}
  - {requirement: NFR-Perf-004, note: 後台頁面載入橫跨所有營運旅程，不專屬任一條}
  - {requirement: NFR-Perf-005, note: 讀取類 API 延遲為全平台共用門檻}
  - {requirement: NFR-Perf-009, note: outbox lag 是事件骨幹的地板，非旅程可觀測}
  - {requirement: NFR-Perf-011, note: 前端 FCP 橫跨四個 portal}
  - {requirement: NFR-Perf-012, note: LLM 逾時上限為供應商邊界設定，不隨旅程改變}
  - {requirement: NFR-Rel-001, note: 全平台 error rate}
  - {requirement: NFR-Rel-002, note: DLQ 處理為事件骨幹地板}
