# SC × RQ 關聯表 —— 「哪條旅程需要哪條需求」
#
# 這是一條 M:N 的邊，真相源就是本檔。一列一條邊，不得合併、不得用命名慣例推導。
#
# 欄位：
#   scenario     SC-* （節點正典：../../28_Scenarios.md）
#   requirement  FR-* / NFR-* （節點正典：../../04_SRS.md / ../../05_NFR.md）
#   role         essential  這條旅程少了它就走不完
#                supporting 影響體驗或治理，但旅程仍可完成
#   note         **這條邊憑什麼成立**。說不出來的邊不要建。
#                這一欄禁止由 AI 代寫成套話——它是人工判斷留在專案裡的唯一痕跡。
#
# scope: global 的需求（所有旅程共用的地板）另列於檔尾 §global，
# 不逐條偽造 SC 邊。判準：拿掉任何一條旅程，它依然必須成立。
#
# 驗證（由 _validate_relations.py 執行）：
#   V2 兩端節點都必須存在      V3 (scenario, requirement) 不得重複
#   V4 role 值域封閉           V8 沒有任何邊的 SC / FR 列為 finding
#
# last_updated: 2026-07-27

version: 1

