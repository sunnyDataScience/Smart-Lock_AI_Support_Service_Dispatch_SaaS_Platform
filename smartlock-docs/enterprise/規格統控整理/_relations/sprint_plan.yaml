# 迭代計畫 —— 每週衝刺，8 月底前收斂
#
# **這是宣告，不是推導。** 哪個工作包排哪一週，是排程決策，算不出來——
# 前置依賴只給出「不能早於」，給不出「應該在哪一週」。所以它跟 _relations/ 的
# 四條邊同性質：一列一個決定，每個決定都要說得出憑什麼。
#
# 與四條邊的差別：本檔**不進 _validate_relations.py 的邊檢查**，也不影響四書生成。
# 它只被《規格統控規劃書》④ 迭代計畫與 _plane/import_spine.py 的 cycles 階段讀。
#
# 排程準則（依序套用）：
#   1. 已 In Progress 的先收尾——半成品放著比沒開始更貴
#   2. 前置未完成的不得早於前置所在的衝刺
#   3. 里程碑順序 M1 → M2 → M3
#   4. 待裁決（🛑）的不排進衝刺，改列 blocked，裁決下來再插隊
#
# last_updated: 2026-07-29
# source: 27_Product_Roadmap_WBS.md（工作包與前置）＋ 業主指示「敏捷每週推進、8 月底前完成」

version: 1

cadence:
  length_days: 7
  starts_on: monday
  note: >
    週一為界。第一個衝刺自 2026-07-27 起算，指示下達日（07-29，週三）落在其中，
    因此 Sprint 1 實際只剩四個工作天——這不是估錯，是起跑點就在週中，
    把它記下來免得第一週未達標時被當成速度問題。

sprints:
  - id: S1
    name: "Sprint 1 · M1 收尾"
    start: "2026-07-27"
    end: "2026-08-02"
    goal: 可觀測性與 CD 兩條 M1 尾巴收乾淨，讓 M2 的前置條件成立
    items: ["1.4.1", "1.6.1"]

  - id: S2
    name: "Sprint 2 · 身分與技師平台"
    start: "2026-08-03"
    end: "2026-08-09"
    goal: Casdoor 統一 IdP、技師平台獨立、v1 API 收斂三線並行
    items: ["2.1.1", "2.4.1", "2.5.1"]

  - id: S3
    name: "Sprint 3 · M2 驗收與憑證治理"
    start: "2026-08-10"
    end: "2026-08-16"
    goal: M2 SIT+UAT 通過；憑證生命週期與背景 runtime 拆分落地
    items: ["2.6.1", "3.6.5", "3.6.6"]

  - id: S4
    name: "Sprint 4 · 事件骨幹與開站自動化"
    start: "2026-08-17"
    end: "2026-08-23"
    goal: Kafka 事件骨幹上線；License → provisioning 自動化；promotion 流程定版
    items: ["3.1.1", "3.3.1", "3.6.7"]

  - id: S5
    name: "Sprint 5 · 多品牌規模化收尾"
    start: "2026-08-24"
    end: "2026-08-31"
    goal: 投影、對帳、intake 契約與第 2 品牌開站演練，M3 收斂
    items: ["3.1.2", "3.2.1", "3.2.2", "3.4.1", "3.5.1"]

# ---------------------------------------------------------------- 不排進衝刺
# 排不進去的東西要指名，不能讓它靜靜躺在 backlog 裡假裝在計畫內。

blocked:
  - id: "3.1.3"
    reason: >
      混合派工（指派為主、搶單為輔）卡在 CR-0191 §8 的六項業主裁決。
      沒裁決不能開工——搶單那一半是從零開始（現行只有候選 GIS 與評分排序，
      師傅端無 accept/reject、offer 概念不存在），估不出工期也定不了驗收條件。
    unblock: 業主完成 CR-0191 §8 六項裁決後插入最近一個衝刺
    milestone: M3

out_of_scope:
  - ids: ["4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7"]
    reason: >
      M4 平台化地基屬**階段二**（flow DSL 引擎、兩層渲染、Vertical Pack、積木庫、
      FlowEditor、AI Onboarding Compiler、第 2 產業落地）。七項全在 Backlog、
      無前置、無排程，五週內不可能完成。
    why_declared: >
      刻意寫成一條宣告而不是「先不管它」——不指名的話，8 月底沒做完會被讀成滑期，
      而它從一開始就不在範圍內。範圍砍掉是決定，不是失敗。
    milestone: M4
