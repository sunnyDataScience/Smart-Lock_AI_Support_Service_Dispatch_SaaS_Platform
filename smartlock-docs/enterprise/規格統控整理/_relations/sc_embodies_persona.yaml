  - {scenario: SC-17, persona: PER-PLT-02, role: primary,   note: "潛在加盟品牌從 landing 提出申請，上線是申請者的旅程目標"}
  - {scenario: SC-17, persona: PER-PLT-01, role: secondary, note: "Super Admin 審申請、開 License、觸發 provisioning"}
  - {scenario: SC-18, persona: PER-OPS-02, role: primary,   note: "租戶 Admin 自助配置品牌設定並在出錯時治理回滾"}
  - {scenario: SC-19, persona: PER-CUS-01, role: primary,   note: "客戶（data subject）行使被遺忘權，請求由客戶端發起"}
  - {scenario: SC-19, persona: PER-PLT-03, role: secondary, note: "DPO 檢查 legal-hold、執行合規銷毀並留 append-only 稽核"}
