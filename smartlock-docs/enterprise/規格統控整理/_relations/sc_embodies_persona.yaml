  - {scenario: SC-15, persona: PER-KNW-01, role: primary,   note: "客服主管發起知識精煉、判定是否進 HITL——精煉由營運端啟動"}
  - {scenario: SC-15, persona: PER-KNW-02, role: secondary, note: "Domain Expert 審核事實正確性與 provenance，是發布前必要關卡"}
