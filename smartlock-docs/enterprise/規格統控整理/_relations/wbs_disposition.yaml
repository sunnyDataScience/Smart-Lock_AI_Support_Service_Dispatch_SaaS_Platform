# ---------------------------------------------------------------- 處置類別
dispositions_legend:
  archive: >
    已交付完成的歷史紀錄。封存（archived_at）而非刪除——`IssueManager` 排除已封存卡，
    `report.py:75` 用的正是它，所以封存後即離開覆蓋率分母與出貨閘門，稽核軌跡仍可查。
    ⚠️ v1 API 無 archive 路由，只能走 UI（內部 app API 有 bulk-archive-issues/，支援批次）。
  merge: >
    進行中或待辦，且明確對應某條需求。排程屬性（負責→assignee、里程碑、前置→blocked_by）
    移交給對應的 Story 卡，工作包本身封存。
  enabler: >
    無對應需求的純技術工作（部署、技術債、演練）。保留為 work item，
    但守則規則下它一樣需要驗收契約——必須補一條技術性 test case，否則會持續擋閘門。
  rebuild: >
    卡片資料損壞或缺漏，需重新匯入後才能判定。

