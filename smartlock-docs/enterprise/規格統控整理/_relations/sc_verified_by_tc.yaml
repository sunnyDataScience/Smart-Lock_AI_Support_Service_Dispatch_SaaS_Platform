    cases: [TC-ONSITE-02, TC-ONSITE-03, TC-ONSITE-04, TC-ONSITE-07, TC-DISPATCH-07]
    note: S2 步驟 4——現場加價三檔位各走一遍；requote 由技師端發起且不含金額

