    note: S2 步驟 1-2——補齊卡→確認→報價內外雙視圖→客戶 LIFF 確認；缺地址與未確認報價須被擋

  - scenario: SC-05
    uat: S2
    cases: [TC-DISPATCH-01, TC-DISPATCH-02, TC-DISPATCH-03, TC-DISPATCH-04, TC-DISPATCH-05, TC-DISPATCH-06]
    note: S2 步驟 3——自動媒合 + 手動 override + 接單/逾時；投影對帳一併驗

  - scenario: SC-06
