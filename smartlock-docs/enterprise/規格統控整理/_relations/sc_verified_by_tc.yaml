# SC × TC 關聯表 —— 「這條旅程的驗收腳本跑哪些案例」
#
# 三角形的第三條邊，**獨立宣告**：
#
#     SC ──宣告──► RQ        這個旅程需要這條需求        （BA / SA 寫）
#     RQ ──宣告──► TC        這條需求由這些案例驗證      （QA 寫）
#     SC ──宣告──► TC        這個旅程的驗收腳本跑這些    （本檔，驗收設計寫）
#
# 前兩條合成可以推出「這條需求實際會被哪些旅程驗到」。
# **推導結果與本檔宣告的差，就是驗收覆蓋缺口**（V9）。
#
# 所以本檔絕對不可以從前兩條算出來——那樣 V9 恆等於零，等於沒有檢查。
# 內容來源是 22_UAT_Report.md §4 的 S1–S5 腳本，那是 QA/UAT 獨立寫下的判斷。
#
# ⚠️ 現況：22_UAT_Report 只寫了 5 段腳本，涵蓋不到 19 條旅程。
#    涵蓋不到的旅程列在 no_script，這不是本檔的缺漏，是 UAT 的缺漏。
#
# last_updated: 2026-07-27
# source: 22_UAT_Report.md §4（S1–S5）

version: 1

scripts:

  # ── UAT S1 消費者 LINE 自助 →（必要時）轉真人 ──────────────────────
  - scenario: SC-01
    uat: S1
    cases: [TC-CS-AI-03, TC-CS-AI-05, TC-CS-AI-06, TC-CS-AI-07, TC-CS-AI-11, TC-COMPLIANCE-06]
    note: S1 步驟 1、3——純知識問題正確回答且不建卡，詢價誘導只給範圍價，影像不辨識

  - scenario: SC-02
    uat: S1
    cases: [TC-CS-AI-01, TC-CS-AI-02, TC-CS-AI-09, TC-CS-AI-10, TC-CS-AI-12, TC-WO-13, TC-EXC-01]
    note: S1 步驟 2——追問後轉真人並產生草擬卡；escalation 表與重送去重一併驗

  - scenario: SC-03
    uat: S1
    cases: [TC-CS-AI-04, TC-COMPLIANCE-07, TC-QUOTE-06, TC-DISPATCH-08]
    note: S1 驗收點「負面情緒被識別並升級」＋急件跳過報價後的 4h 補審

