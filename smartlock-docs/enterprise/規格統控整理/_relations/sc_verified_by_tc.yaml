# ── 完全沒有驗收腳本的旅程 ──────────────────────────────────────────
#
# 這不是留白，是結論：22_UAT_Report 的 5 段腳本沒有涵蓋這幾條旅程，
# 既有 97 筆案例裡也找不到可直接構成驗收的組合。
#
# 這四條裡有三條是 P0。在舊的四書結構下，這件事看不出來——因為表格是以
# 需求為列，每條需求都「有對應 TC」，缺口被打散成看不見的形狀。

