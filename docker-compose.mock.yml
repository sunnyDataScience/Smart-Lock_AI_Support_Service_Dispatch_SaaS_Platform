# Prism Mock Server — 讓前端不必等後端實作即可以契約驅動開發
#
# Usage:
#   docker compose -f docker-compose.mock.yml up -d
#   curl http://localhost:4010/api/v1/conversations
#   docker compose -f docker-compose.mock.yml down
#
# 或用 npx（無需 Docker）：
#   npx --yes @stoplight/prism-cli mock api/openapi.yaml --port 4010

services:
  prism-openapi:
    image: stoplight/prism:5
    command: >
      mock
      -h 0.0.0.0
      -p 4010
      -m false
      /specs/openapi.yaml
    volumes:
      - ./api:/specs:ro
    ports:
      - "4010:4010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4010/api/v1/work-orders || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # NOTE: prism-asyncapi service removed — asyncapi.yaml 已於 dev_new_arch
  # 文件重構退場（見 f00ac91）。Domain events 不再走 AsyncAPI 契約驗證。

networks:
  default:
    name: sunny-mock-net
