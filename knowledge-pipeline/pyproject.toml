[project]
name = "smart-lock-knowledge-pipeline"
version = "0.1.0"
description = "Smart Lock data ETL pipeline (Medallion: source → raw → bronze → silver → SKILL.md)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # === LLM ===
    "litellm>=1.84.0",           # 唯一 LLM 介面(2026-07-09 統一;原 langchain 適配器群已刪)
    # === 內容下載與處理 ===
    "yt-dlp>=2026.6.9",          # 資安全修(2026-07-07,CVE-2026-50019/50023/50574、GHSA-69qj-pvh9-c5wg)
    "playwright",
    "beautifulsoup4",
    "markdownify",
    # === Google Drive 串接 ===
    "google-api-python-client",
    # === 資料處理 ===
    "pandas",
    "pyyaml",
    "python-dotenv>=1.0.0",
]

# LLM 多家路由由 litellm model 字串處理（vertex_ai/、ollama_chat/、claude-*、gpt-*），
# 不再需要 per-provider optional extras（2026-07-09 移除 langchain-* 三組）。

[tool.uv]
package = false
