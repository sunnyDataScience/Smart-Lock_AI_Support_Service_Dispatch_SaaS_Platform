name: API Spec Lint

on:
  push:
    paths:
      # CR-0009 dual-write: trigger on either path
      - 'docs/02-design/specs/openapi.yaml'
      - 'docs/02-design/specs/asyncapi.yaml'
      - 'docs_v2/2-contracts/api/openapi.yaml'
      - 'docs_v2/2-contracts/api/asyncapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/spec-lint.yml'
  pull_request:
    paths:
      - 'docs/02-design/specs/openapi.yaml'
      - 'docs/02-design/specs/asyncapi.yaml'
      - 'docs_v2/2-contracts/api/openapi.yaml'
      - 'docs_v2/2-contracts/api/asyncapi.yaml'
      - '.spectral.yaml'

jobs:
  lint:
    name: Spectral Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CR-0009: enforce drift check between dual-write paths
      - name: Verify spec drift (docs/ vs docs_v2/)
        run: |
          for f in openapi.yaml asyncapi.yaml; do
            if [[ -f "docs/02-design/specs/$f" && -f "docs_v2/2-contracts/api/$f" ]]; then
              if ! diff -q "docs/02-design/specs/$f" "docs_v2/2-contracts/api/$f"; then
                echo "::error::CR-0009 drift: docs/02-design/specs/$f != docs_v2/2-contracts/api/$f"
                exit 1
              fi
            fi
          done

      - name: Lint OpenAPI (docs_v2/ — new SSOT)
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'docs_v2/2-contracts/api/openapi.yaml'
          spectral_ruleset: '.spectral.yaml'

      - name: Lint AsyncAPI (docs_v2/ — new SSOT)
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'docs_v2/2-contracts/api/asyncapi.yaml'
          spectral_ruleset: '.spectral.yaml'
