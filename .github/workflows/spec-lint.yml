name: API Spec Lint

on:
  push:
    paths:
      - 'docs/architecture/api/openapi.yaml'
      - '.spectral.yaml'
      - '.github/workflows/spec-lint.yml'
  pull_request:
    paths:
      - 'docs/architecture/api/openapi.yaml'
      - '.spectral.yaml'

jobs:
  lint:
    name: Spectral Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint OpenAPI
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: 'docs/architecture/api/openapi.yaml'
          spectral_ruleset: '.spectral.yaml'
