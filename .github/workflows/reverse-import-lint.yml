name: Reverse import lint

# 規則：lockcore 模組分層必須單向（下層不可 import 上層）：
#   - lockcore/providers/  不可 import lockcore.agent / lockcore.channels
#     （provider 是 loop 的下游依賴，反向會成 cycle）
#   - lockcore/agent/      不可 import lockcore.channels
#     （channels 疊在 agent core 之上，由 gateway / apps 接線）
#
# 歷史：本 lint 原守護 2026-06-04 重寫前的 agent/{skills,core,harness} 分層
# （RP2.2/RP2.3，PR #23/#24）。舊目錄已隨 LockCore 重寫全刪，原檢查對不存在
# 的路徑空轉（假綠），2026-07-08 依 0707 會議清理輪改指 lockcore 分層。
#
# 注意：lockcore 是 fork 自 nanobot 的 vendor 套件（見 agent/lockcore/VENDOR.md），
# config/schema.py 對 agent.tools 的 TYPE_CHECKING／validator import 與
# utils/progress_events.py 對 agent.hook 的 import 屬上游既有結構，不在本 lint
# 範圍（僅檢查上述兩條會造成 cycle 的方向）。
#
# 例外：任何位置只要該行加上 # allow-rev-import 註解視為刻意例外。

on:
  pull_request:
    paths:
      - 'agent/**/*.py'
  push:
    branches: [main, dev, dev-ding]
    paths:
      - 'agent/**/*.py'

jobs:
  lint:
    name: Detect reverse imports between lockcore layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check providers/ → agent/ or channels/
        shell: bash
        run: |
          set -euo pipefail
          test -d agent/lockcore/providers || { echo "::error::agent/lockcore/providers missing — layering assumption broken, update this workflow"; exit 1; }
          violations=$(
            find agent/lockcore/providers -type f -name '*.py' \
              -not -path '*/__pycache__/*' \
              -print0 \
            | xargs -0 grep -nH -E '^\s*(from|import)\s+lockcore\.(agent|channels)\b' 2>/dev/null \
            | grep -v 'allow-rev-import' \
            || true
          )
          if [ -n "$violations" ]; then
            echo "::error::lockcore/providers/ must not import lockcore.agent or lockcore.channels"
            echo "Violations:"
            echo "$violations"
            exit 1
          fi
          echo "OK: lockcore/providers/ is clean"

      - name: Check agent/ → channels/
        shell: bash
        run: |
          set -euo pipefail
          test -d agent/lockcore/agent || { echo "::error::agent/lockcore/agent missing — layering assumption broken, update this workflow"; exit 1; }
          violations=$(
            find agent/lockcore/agent -type f -name '*.py' \
              -not -path '*/__pycache__/*' \
              -print0 \
            | xargs -0 grep -nH -E '^\s*(from|import)\s+lockcore\.channels\b' 2>/dev/null \
            | grep -v 'allow-rev-import' \
            || true
          )
          if [ -n "$violations" ]; then
            echo "::error::lockcore/agent/ must not import lockcore.channels (channels sit above the core; wire via gateway/apps)"
            echo "Violations:"
            echo "$violations"
            exit 1
          fi
          echo "OK: lockcore/agent/ does not import channels"
