name: API Types Sync Check

# 型別 SoT = FastAPI runtime export（2026-07-09 業主裁決，CR-0126）：
# api.generated.ts 由 api.main:app 的實際契約生成（export_openapi.py →
# openapi-typescript），故觸發條件盯 api 程式碼而非設計稿 api/openapi.yaml
# （設計稿的守門在 spec-lint / mock-smoke / contract-check）。
on:
  push:
    paths:
      - 'api/**/*.py'
      - 'api/pyproject.toml'
      - 'web/shared-contract/src/api-generated.ts'
      - 'web/shared-contract/smartlock-shared-contract-*.tgz'
      - 'scripts/ci/generate-api-types.sh'
      - 'scripts/ops/export_openapi.py'
      - '.github/workflows/api-types-sync.yml'
  pull_request:
    paths:
      - 'api/**/*.py'
      - 'api/pyproject.toml'
      - 'web/shared-contract/src/api-generated.ts'
      - 'web/shared-contract/smartlock-shared-contract-*.tgz'
      - 'scripts/ci/generate-api-types.sh'
      - 'scripts/ops/export_openapi.py'

jobs:
  types-sync:
    name: 檢查 TypeScript 型別是否與 runtime 契約同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync deps（api.main:app import 所需）
        run: uv sync

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate-api-types --check
        run: ./scripts/ci/generate-api-types.sh --check

      # 若 --check fail，提示如何修復
      - name: Failure hint
        if: failure()
        run: |
          echo "::error::TypeScript 型別檔與 runtime 契約（api.main:app）不同步。"
          echo "::error::請在本地執行：./scripts/ci/generate-api-types.sh 並 commit 結果"
