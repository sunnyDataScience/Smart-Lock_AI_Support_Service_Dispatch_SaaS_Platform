name: API Types Sync Check

# ⚠️ 已知 SoT 衝突（2026-07-09 發現，待業主裁決）：入庫的四份 api.generated.ts
# 實際源自 runtime export（scripts/ops/export_openapi.py，/api/v1/* 464 端點），
# 而本 check 從設計稿 api/openapi.yaml（145 條無前綴路徑）生成——兩者根本是
# 不同契約，--check 必紅。裁決型別 SoT 歸屬前，此 job 紅燈＝已知狀態非新回歸。
on:
  push:
    paths:
      - 'api/openapi.yaml'
      # S8 複製分家後 types 為四站各持一份（web/packages/shared/ 已解散）
      - 'web/*/src/types/api.generated.ts'
      - 'scripts/ci/generate-api-types.sh'
  pull_request:
    paths:
      - 'api/openapi.yaml'
      - 'web/*/src/types/api.generated.ts'

jobs:
  types-sync:
    name: 檢查 TypeScript 型別是否與 OpenAPI 同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate-api-types --check
        run: ./scripts/ci/generate-api-types.sh --check

      # 若 --check fail，提示如何修復
      - name: Failure hint
        if: failure()
        run: |
          echo "::error::TypeScript 型別檔與 openapi.yaml 不同步。"
          echo "::error::請在本地執行：./scripts/ci/generate-api-types.sh 並 commit 結果"
