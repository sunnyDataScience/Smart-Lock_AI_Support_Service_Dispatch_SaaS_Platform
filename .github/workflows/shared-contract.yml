name: Shared Contract

on:
  push:
    paths:
      - "web/shared-contract/**"
      - "web/*/package.json"
      - "web/*/package-lock.json"
      - "web/*/src/lib/api.ts"
      - "web/*/src/types/api.generated.ts"
      - "scripts/ci/check-shared-contract-consumers.mjs"
      - ".github/workflows/shared-contract.yml"
  pull_request:
    paths:
      - "web/shared-contract/**"
      - "web/*/package.json"
      - "web/*/package-lock.json"
      - "web/*/src/lib/api.ts"
      - "web/*/src/types/api.generated.ts"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/shared-contract/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web/shared-contract
      - run: npm run check:boundary
        working-directory: web/shared-contract
      - run: npm test
        working-directory: web/shared-contract
      - run: npm run build
        working-directory: web/shared-contract
      - run: npm pack --dry-run --ignore-scripts
        working-directory: web/shared-contract
      - run: node scripts/ci/check-shared-contract-consumers.mjs

  consumers:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [brand-portal, tech-portal, platform-console, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/${{ matrix.portal }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web/${{ matrix.portal }}
      - run: npx tsc --noEmit
        working-directory: web/${{ matrix.portal }}
      - run: npm run build
        working-directory: web/${{ matrix.portal }}
