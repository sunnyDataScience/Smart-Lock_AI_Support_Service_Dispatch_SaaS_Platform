name: Bare except Exception lint

# 規則：production hot-path 程式碼禁止 bare except Exception。
# 過寬的 except Exception 會吞掉 NameError / AttributeError / TypeError 等
# programming bug，讓 typo 不會在開發期被抓到。
# RP2.6（PR #25）已 narrow 46 處；此 lint 守護後續 PR 不再回歸。
#
# 適用範圍：agent/{harness,quality}, api/services, data/pipeline
#   - agent/scripts/       一次性 CLI 工具，過寬 catch 可接受
#   - agent/core/, agent/skills/, agent/profiles/, agent/memory/, agent/storage/, agent/llms/  常見 best-effort cleanup，本 lint 不掃
#   - api/core/            底層工具
#
# 例外：任何位置只要加 # noqa: BLE001 註解視為刻意例外。
# 建議：narrow 到具體型別 tuple，例如：
#   except (psycopg.Error, OSError, RuntimeError) as e:    # DB I/O
#   except (RuntimeError, ValueError, TimeoutError, ConnectionError) as e:  # LLM/HTTP
#   except (json.JSONDecodeError, ValueError, TypeError):  # JSON parse

on:
  pull_request:
    paths:
      - 'agent/**/*.py'
      - 'api/**/*.py'
      - 'data/**/*.py'
  push:
    branches: [main, dev]
    paths:
      - 'agent/**/*.py'
      - 'api/**/*.py'
      - 'data/**/*.py'

jobs:
  lint:
    name: Detect bare 'except Exception' in hot-path code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan production hot-path
        shell: bash
        run: |
          set -euo pipefail
          # 掃描範圍：harness / quality / api/services / data/pipeline
          # 排除：scripts / core / __pycache__ / 已標 noqa: BLE001
          violations=$(
            find \
              agent/harness agent/quality \
              api/services \
              data/pipeline \
              -type f -name '*.py' \
              -not -path '*/__pycache__/*' \
              -not -path '*/scripts/*' \
              -print0 2>/dev/null \
            | xargs -0 grep -nH -E '^\s*except\s+Exception(\s+as\s+\w+)?\s*:' 2>/dev/null \
            | grep -v 'noqa: BLE001' \
            || true
          )
          if [ -n "$violations" ]; then
            echo "::error::Found bare 'except Exception' in production hot-path code."
            echo ""
            echo "Production code must narrow to specific exception types so programming bugs"
            echo "(NameError / AttributeError / TypeError) are not silently swallowed."
            echo ""
            echo "Common patterns:"
            echo "  except (psycopg.Error, OSError, RuntimeError) as e:                        # DB I/O"
            echo "  except (RuntimeError, ValueError, TimeoutError, ConnectionError) as e:    # LLM/HTTP"
            echo "  except (json.JSONDecodeError, ValueError, TypeError):                     # JSON parse"
            echo ""
            echo "If a wide catch is genuinely intentional (e.g. WS publish non-fatal),"
            echo "annotate the line with '# noqa: BLE001'."
            echo ""
            echo "Violations:"
            echo "$violations"
            exit 1
          fi
          echo "OK: no bare 'except Exception' in agent/harness, agent/quality, api/services, data/pipeline"
