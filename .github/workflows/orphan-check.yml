name: OperationId Orphan Check

on:
  push:
    paths:
      # CR-0009 dual-write: trigger on either path
      - 'docs/02-design/specs/openapi.yaml'
      - 'docs/02-design/specs/asyncapi.yaml'
      - 'docs/02-design/**/*.md'
      - 'docs_v2/2-contracts/api/openapi.yaml'
      - 'docs_v2/2-contracts/api/asyncapi.yaml'
      - 'docs_v2/2-contracts/flows/**/*.md'
      - 'docs_v2/2-contracts/pages/**/*.md'
      - 'web_design_spec_prompt_pipeline/pages/**/*.md'
      - 'scripts/ci/check-operationid-orphans.sh'
      - 'scripts/ci/generate-mapping-api-index.sh'
  pull_request:
    paths:
      - 'docs/02-design/specs/openapi.yaml'
      - 'docs/02-design/specs/asyncapi.yaml'
      - 'docs/02-design/**/*.md'
      - 'docs_v2/2-contracts/api/openapi.yaml'
      - 'docs_v2/2-contracts/api/asyncapi.yaml'
      - 'docs_v2/2-contracts/flows/**/*.md'
      - 'docs_v2/2-contracts/pages/**/*.md'
      - 'web_design_spec_prompt_pipeline/pages/**/*.md'

jobs:
  orphan-check:
    name: OperationId 雙向對應檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OperationId 雙向 + [PAGE META] 宣告驗證
        run: ./scripts/ci/check-operationid-orphans.sh

      - name: MAPPING.md §8.1 同步檢查
        run: ./scripts/ci/generate-mapping-api-index.sh --check

      # Week 5+ 啟用（body path 也視為 error）
      # - name: Strict 模式（CI gate）
      #   run: ./scripts/ci/check-operationid-orphans.sh --strict --quiet
