# .github/workflows/test-suite.yml — Python 測試金字塔 PR-gate
#
# 對應 docs/_flows-bdd-test/v-model-right/E7x--test-plan-and-readiness.md §11 PR-gate
# 與 §13 Verification 第 1 步。
#
# 設計：分 2 個 job，獨立失敗（fail-fast: false）：
#   1. unit       — pytest -m unit（無 DB、無網路；< 30s）
#   2. contract-check — schemathesis --check-only（spec YAML 結構，不打 api）
#
# NOTE: asyncapi job 已移除 — asyncapi.yaml 於 dev_new_arch 文件重構退場（f00ac91）。
#
# 不在 PR-gate：
#   - component test（需 docker postgres + seeds）→ 已建 component-nightly.yml（CR-0038 桶3b）
#   - contract test 真打（需 api 起著，留給 nightly / staging smoke）
#   - playwright e2e（CI 跑要先 install chromium ~150MB，留給 nightly）

name: test-suite

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync test dep group
        run: uv sync --group test

      - name: Run unit tests
        # CR-0038 階段0 修復：原 `pytest tests/unit` 指向不存在的目錄（harness 已於 dev_new_arch 退場），
        # 5 collection ERROR 讓此 job 形同虛設。改為 `cd api`（用 api/pytest.ini testpaths=tests）
        # + `-m unit` 過濾，收集 226 個純函式 unit（component 945 留 nightly，需 docker postgres + seeds）。
        run: cd api && uv run pytest -m unit -v --tb=short

  contract-check:
    name: OpenAPI structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync test dep group
        run: uv sync --group test

      - name: Validate OpenAPI structure (no api required)
        run: bash scripts/ci/contract-schemathesis.sh --check-only
