name: Docker Build Smoke Test

# 確保 agent / api / web Dockerfile 能 build 成功，預防 Dockerfile 退化：
#   - 改 pyproject.toml / 新增 Python 套件不會破壞 image build
#   - 改 web/package.json / next.config 不會破壞 next standalone build
#   - .dockerignore / *.dockerignore 規則改動不會誤刪 build 必要檔案
#   - 不 push image，只驗證 build + 一個 healthcheck

on:
  push:
    branches: [main, dev]
    paths:
      - 'agent/**'
      - 'api/**'
      - 'web/**'
      - 'knowledge-pipeline/pyproject.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - 'web/*/Dockerfile.dockerignore'
      - '.python-version'
      - '.github/workflows/docker-build-smoke.yml'
  pull_request:
    paths:
      - 'agent/Dockerfile'
      - 'api/Dockerfile'
      - 'web/*/Dockerfile'
      - 'agent/pyproject.toml'
      - 'api/pyproject.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'web/*/package.json'
      - 'web/*/package-lock.json'
      - 'web/*/next.config.ts'
      - '.dockerignore'
      - 'web/*/Dockerfile.dockerignore'

jobs:
  build:
    name: ${{ matrix.module }} image build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 2026-07-09 web 檔案層拆分：四站各自獨立專案（web/{dispatch,tech,landing,platform}）
        # module = Dockerfile 所在路徑；tag = image 名（路徑含 / 不能直接當 tag）
        include:
          - module: agent
            kind: python
            healthcheck: |
              import psycopg, langchain_core, langgraph, fastapi, litellm, linebot
              import importlib.metadata as md
              print(f'litellm={md.version("litellm")} langgraph={md.version("langgraph")}')
          - module: api
            kind: python
            healthcheck: |
              import fastapi, psycopg, jose, passlib, reportlab
              import importlib.metadata as md
              # 確認 agent 的 deps 沒被誤裝（--package 隔離應該排除）
              try:
                  import langchain_core
                  raise SystemExit('FAIL: langchain_core leaked into api image')
              except ImportError:
                  pass
              print(f'fastapi={fastapi.__version__} reportlab={md.version("reportlab")}')
          - module: web/brand-portal
            kind: web
            tag: web-brand-portal
          - module: web/tech-portal
            kind: web
            tag: web-tech-portal
          - module: web/landing
            kind: web
            tag: web-landing
          - module: web/platform-console
            kind: web
            tag: web-platform-console
            # web image 沒有 python，用 docker run + curl 測 server 起來

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.module }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true     # 載入到本地 daemon 讓下一步 docker run 用
          tags: smart-lock-${{ matrix.tag || matrix.module }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Python image（agent / api）：用 import healthcheck ──
      # 走 stdin pipe + quoted heredoc：避免 healthcheck 內的 f'...' 單引號
      # 與外層 shell -c '...' 衝突造成 "syntax error near unexpected token '('"
      - name: Smoke-test ${{ matrix.module }} image (python)
        if: matrix.kind == 'python'
        run: |
          cat <<'PYEOF' | docker run --rm -i --entrypoint python smart-lock-${{ matrix.tag || matrix.module }}:ci -
          ${{ matrix.healthcheck }}
          PYEOF

      # ── Web image：起 container + curl /，驗證 next standalone 能跑 ──
      - name: Smoke-test web image (next standalone runtime)
        if: matrix.kind == 'web'
        run: |
          docker run -d --name web-ci -p 3001:8080 smart-lock-${{ matrix.tag }}:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "✓ web container HTTP 200 at $i sec"
              docker logs web-ci | tail -10
              docker stop web-ci
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: web container 30s 內未 HTTP 200"
          docker logs web-ci
          docker stop web-ci || true
          exit 1

      - name: Print image size
        run: docker images smart-lock-${{ matrix.tag || matrix.module }}:ci --format '{{.Size}}'
