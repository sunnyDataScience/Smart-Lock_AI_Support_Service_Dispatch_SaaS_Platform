      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInquireRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyInquireResult' } } } }
  /acl/rma-partner/submit:
    post:
      tags: [ACL External Integration]
      summary: Submit RMA to partner system (FR-0048 quality feedback loop)
      operationId: aclRmaPartnerSubmit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RMASubmitRequest' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/RMASubmitReceipt' } } } }

  # M01 Dashboard — tenant-scoped KPI 統計（CR-0003 P2-W1, FR-0021）
  /tenants/{tenantId}/dashboard/stats:
    x-phase: I-readonly
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: [Dashboard]
      summary: Dashboard KPI 統計（tenant-scoped，period filter）
      operationId: getDashboardStats
      description: |
        取得指定租戶在選定時段內的 dashboard KPI 統計，包含對話數、
        AI 解決率、平均解決時間、熱門議題、Token 用量、工單今日 KPI
        與技師概況。period 參數映射：today / 7d / 30d / 90d。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, 7d, 30d, 90d]
            default: 7d
          description: 統計時段
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK — tenant-scoped dashboard KPI 統計'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: CROSS_TENANT_READ — path tenantId 與 JWT claim 不符
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: DB_UNAVAILABLE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # Phase II placeholders
  /tenants/{tenantId}/settlements/monthly:
    x-phase: II
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    post:
      tags: [M11 AR / Payment]
      summary: '[Phase II] Trigger monthly settlement (M12)'
      operationId: triggerMonthlySettlement
      description: 'NOT exposed in V1. OAuth scope `phase2.settlement` required.'
      responses:
        '200': { description: 'Accepted (Phase II only; V1 returns 501 below)' }
        '501': { description: NOT_IMPLEMENTED_V1 }

  # P2-W1: Reports tenant-scoped v2 (CR-0003 P2-W1, FR-0021)
  /tenants/{tenantId}/reports/kpi:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: 'KPI 儀表板（tenant-scoped v2；漏斗 / 異常率 / 技師效率）'
      operationId: getReportKpi
      description: >
        Returns KPI funnel, dispute rates and technician efficiency for the
        authenticated tenant. Supports `period` enum or explicit `start_date`
        / `end_date` date range. Replaces legacy GET /api/v1/reports/kpi with
        tenant path enforcement (ADR-0030 cross-tenant guard).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: 'KPI report', content: { application/json: { schema: { type: object } } } }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (CROSS_TENANT_READ)' }

  /tenants/{tenantId}/reports/revenue:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: '營收彙整（tenant-scoped v2；KPI + 月度趨勢 + 品牌占比）'
      operationId: getReportRevenue
      description: >
        Returns revenue summary including KPI metrics, monthly trend and
        per-brand breakdown for the authenticated tenant. Replaces legacy
        GET /api/v1/reports/revenue with tenant path enforcement (ADR-0030).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: granularity
          in: query
          schema: { type: string, default: month }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: 'Revenue summary', content: { application/json: { schema: { type: object } } } }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (CROSS_TENANT_READ)' }

  /tenants/{tenantId}/reports/export:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: '匯出 KPI / 營收 / 技師排行 / 結算報表（tenant-scoped v2；CSV stream）'
      operationId: exportReport
      description: >
        Streams a CSV export for the given report_type scoped to the
        authenticated tenant. Role gate: admin / operations_manager / accountant.
        Replaces legacy GET /api/v1/reports/export (CSV only; PDF excluded from
        v2 to align with FR-0021 scope). Tenant path enforcement per ADR-0030.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: report_type
          in: query
          required: true
          schema: { type: string, enum: [kpi, revenue, technician_ranking, accounting] }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 'CSV stream'
          content:
            text/csv:
              schema: { type: string }
          headers:
            Content-Disposition:
              schema: { type: string }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Insufficient role or cross-tenant read forbidden' }
        '422': { description: 'Invalid report_type or period parameter' }

  /tenants/{tenantId}/sentiment/alerts:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Sentiment Alerts]
      summary: '負面情緒告警列表（tenant-scoped v2；cursor 分頁；FR-0018 / CR-0003 P2-W2）'
      operationId: listSentimentAlerts
      description: >
        Returns a cursor-paginated list of sentiment alerts scoped to the
        authenticated tenant. Supports filtering by status and start_time.
        Tenant path enforcement per ADR-0030. Replaces legacy
        GET /api/v1/sentiment/alerts (flat, non-tenant-scoped).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, acknowledged, resolved] }
        - name: start_time
          in: query
          schema: { type: string, format: date-time }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 'Sentiment alert page (cursor-paginated)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentimentAlertPage' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (CROSS_TENANT_READ)' }
        '422': { description: 'Invalid status value' }

  /tenants/{tenantId}/sentiment/alerts/{id}:
    parameters:
      - { $ref: '#/components/parameters/TenantPath' }
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Sentiment Alerts]
      summary: '處理情緒告警（tenant-scoped v2；pending→acknowledged→resolved；FR-0018）'
      operationId: updateSentimentAlert
      description: >
        Transitions a sentiment alert's status (pending → acknowledged → resolved,
        single-direction only). admin_note is preserved when omitted; empty string
        clears it. Idempotent via Idempotency-Key header. Cross-tenant write
        forbidden (ADR-0030). Replaces legacy PATCH /api/v1/sentiment/alerts/{alert_id}.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SentimentAlertUpdateRequest' }
      responses:
        '200':
          description: 'Updated sentiment alert'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentimentAlert' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (CROSS_TENANT_WRITE)' }
        '404': { description: 'Sentiment alert not found' }
        '409': { description: 'Invalid status transition (INVALID_TRANSITION)' }
        '422': { description: 'Validation error' }

  ## --- Notifications v2 (P2-W2 / CR-0003 / ADR-0012 / FR-0018) ---
  /tenants/{tenantId}/notifications:
    get:
      tags: [Notifications]
      summary: 通知列表（tenant-scoped，游標分頁）
      operationId: listNotifications
      description: |
        回傳指定租戶目前登入使用者的通知列表，支援 status / type 過濾。
        取代 legacy GET /api/v1/notifications（tenant path 對齊 ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { type: string, enum: [all, unread, read, archived] }
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/NotificationType' }
          style: form
          explode: true
      responses:
        '200':
          description: 通知列表（游標分頁）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (ADR-0030)' }

  /tenants/{tenantId}/notifications/{notificationId}:
    patch:
      tags: [Notifications]
      summary: 標記通知狀態（tenant-scoped，已讀或封存）
      operationId: updateNotification
      description: |
        更新單則通知的 read_at / archived_at 欄位。
        取代 legacy PATCH /api/v1/notifications/{id}。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationUpdate' }
      responses:
        '200':
          description: 更新後的通知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (ADR-0030)' }
        '404': { description: 'Notification not found' }

  /tenants/{tenantId}/notifications:bulk:
    post:
      tags: [Notifications]
      summary: 批次處理通知（tenant-scoped，mark_read/mark_unread/archive/delete）
      operationId: bulkUpdateNotifications
      description: |
        對指定 ID 列表執行批次操作（最多 1000 筆）。
        取代 legacy POST /api/v1/notifications/bulk。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationBulkRequest' }
      responses:
        '200':
          description: 操作結果（affected 筆數）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationBulkResult' }
        '400': { description: 'Missing Idempotency-Key' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (ADR-0030)' }
