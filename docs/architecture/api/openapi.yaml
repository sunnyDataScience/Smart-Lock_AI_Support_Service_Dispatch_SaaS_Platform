  ## --- W6 Media v2 (CR-0003 P2-W6 / Media tenant-scoped upload/serve/list) ---

  /tenants/{tenantId}/media:
    x-phase: P2-W6
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    post:
      tags: [Media]
      summary: 上傳媒體檔案 v2（tenant-scoped，multipart/form-data）
      operationId: uploadMediaV2
      description: |
        上傳媒體檔案（圖片/影片）並回傳 media_id 與存取 url。
        multipart/form-data 上傳；不使用冪等性 key（sha256 + media_id UUID 天然去重）。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
        依 ADR-0030 tenant 隔離。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: '上傳檔案（圖片或影片）'
                purpose:
                  $ref: '#/components/schemas/MediaPurpose'
                work_order_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: '關聯工單 UUID（optional）'
                dispute_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: '關聯爭議 UUID（optional）'
      responses:
        '200':
          description: 'OK — 上傳成功，回傳 media_id 與存取 url'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaUploadResponse' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { description: 'Validation error (unsupported content-type or missing required fields)' }

  /tenants/{tenantId}/media/{mediaId}:
    x-phase: P2-W6
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: '媒體 UUID'
    get:
      tags: [Media]
      summary: 下載媒體檔案 v2（tenant-scoped，含 tenant 隔離）
      operationId: getMediaV2
      description: |
        取得指定媒體檔案內容，回傳 binary（inline Content-Disposition，Cache-Control: private, max-age=3600）。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK — 媒體檔案內容（binary）'
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { description: 'Media not found' }

