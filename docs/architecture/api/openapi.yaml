      summary: Run deterministic guardrail rules (FR-NEW-7 + ADR-0028)
      operationId: chatbotGuardrailsCheck
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardrailCheckRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/GuardrailCheckResponse' } } } }

