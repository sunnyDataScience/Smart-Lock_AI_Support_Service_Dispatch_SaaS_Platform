  ## --- Inventory v2 per-tenant 庫存狀態機 (FR-0007 / CR-0004 §8 / ADR-0052 / ADR-0053 / M10 Inventory) ---

  /tenants/{tenantId}/inventory/items:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: ['M10 Inventory']
      summary: 庫存品項列表 v2（tenant-scoped，cursor 分頁）
      operationId: listInventoryItemsV2
      description: |
        取得指定租戶的庫存品項列表，支援 stock_status / category / owner 過濾與 cursor 分頁。
        stock_status 為衍生欄位：out_of_stock (qty=0) / low_stock (0<qty<=reorder_point) / in_stock (qty>reorder_point)。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: stock_status
          in: query
          required: false
          schema:
            type: string
            enum: [out_of_stock, low_stock, in_stock]
          description: 庫存狀態篩選（out_of_stock|low_stock|in_stock）
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: 分類過濾（選填）
        - name: owner
          in: query
          required: false
          schema:
            type: string
            enum: [platform, brand, locksmith]
          description: 所有者篩選（platform|brand|locksmith，ADR-0052）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemPage' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: ['M10 Inventory']
      summary: 建立庫存品項（tenant-scoped v2）
      operationId: createInventoryItemV2
      description: |
        新建庫存品項，owner 依 ADR-0052，serial_required 依 ADR-0053。
        Idempotency-Key 防重（24h dedup）。
        201 回新建品項；409 DUPLICATE_PART_NUMBER 表示同 tenant part_number 已存在。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [part_number, name]
              properties:
                part_number:
                  type: string
                  minLength: 1
                  description: 零件編號（tenant 內唯一）
                name:
                  type: string
                  minLength: 1
                  description: 品項名稱
                category:
                  type: string
                  nullable: true
                  description: 分類（選填）
                unit_cost:
                  type: number
                  nullable: true
                  minimum: 0
                  description: 單價（選填）
                quantity_on_hand:
                  type: integer
                  default: 0
                  minimum: 0
                  description: 初始庫存量（預設 0）
                reorder_point:
                  type: integer
                  default: 0
                  minimum: 0
                  description: 安全庫存量（低於此值觸發補貨通知）
                supplier:
                  type: string
                  nullable: true
                  description: 供應商（選填）
                owner:
                  type: string
                  enum: [platform, brand, locksmith]
                  default: platform
                  description: 所有者（ADR-0052）
                serial_required:
                  type: boolean
                  default: false
                  description: 是否強制序號（ADR-0053；主鎖 + 高價零件 True）
      responses:
        '201':
          description: Created — 品項已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: DUPLICATE_PART_NUMBER — 同 tenant part_number 已存在
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/inventory/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 庫存品項 UUID
    get:
      tags: ['M10 Inventory']
      summary: 取單筆庫存品項 v2（tenant-scoped）
      operationId: getInventoryItemV2
      description: |
        取得單筆庫存品項詳情，包含衍生 stock_status。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
        404 NOT_FOUND 若品項不存在或不屬於此 tenant。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItemEnvelope' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 品項不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/inventory/items/{itemId}:consume:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 庫存品項 UUID
    post:
      tags: ['M10 Inventory']
      summary: 領料扣庫存（FR-0007，transaction + FOR UPDATE）
      operationId: consumeMaterialV2
      description: |
        FR-0007 main flow：領料扣庫存（transaction + SELECT FOR UPDATE 並發序列化）。
        流程：BEGIN → SELECT FOR UPDATE（row-lock）→ 庫存充足檢查（否則 409 INSUFFICIENT_INVENTORY）
        → serial_required 檢查（否則 422 SERIAL_REQUIRED）→ UPDATE qty -= N
        → INSERT transaction(consume) → COMMIT。
        扣後 quantity_on_hand < reorder_point → logger InventoryBelowReorderPoint（Phase II 通知）。
        Idempotency-Key 防重（24h dedup）。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: 領料數量（必須 > 0）
                work_order_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 關聯工單 UUID（選填）
                technician_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 技師 UUID（選填）
                serial:
                  type: string
                  nullable: true
                  description: 序號（ADR-0053：serial_required=true 時必填）
      responses:
        '200':
          description: OK — 領料成功，回傳更新後品項 + 交易記錄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryTxnResult' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 品項不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: INSUFFICIENT_INVENTORY (qty < requested) or ITEM_INACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: SERIAL_REQUIRED — serial_required=true 但 serial 未帶（ADR-0053）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/inventory/items/{itemId}:return:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 庫存品項 UUID
    post:
      tags: ['M10 Inventory']
      summary: 還料歸庫（transaction + FOR UPDATE）
      operationId: returnMaterialV2
      description: |
        還料：transaction + SELECT FOR UPDATE → quantity_on_hand += quantity → INSERT transaction(return)。
        Idempotency-Key 防重（24h dedup）。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: 還料數量（必須 > 0）
                work_order_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 關聯工單 UUID（選填）
                technician_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 技師 UUID（選填）
                notes:
                  type: string
                  nullable: true
                  description: 備註（選填）
      responses:
        '200':
          description: OK — 還料成功，回傳更新後品項 + 交易記錄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryTxnResult' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 品項不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: ITEM_INACTIVE — 品項已停用
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/inventory/items/{itemId}:restock:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 庫存品項 UUID
    post:
      tags: ['M10 Inventory']
      summary: 補貨入庫（transaction + FOR UPDATE）
      operationId: restockInventoryV2
      description: |
        補貨：transaction + SELECT FOR UPDATE → quantity_on_hand += quantity
        → COALESCE supplier → INSERT transaction(purchase)。
        Idempotency-Key 防重（24h dedup）。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: 補貨數量（必須 > 0）
                supplier:
                  type: string
                  nullable: true
                  description: 供應商（選填，補貨時更新 COALESCE）
                notes:
                  type: string
                  nullable: true
                  description: 備註（選填）
      responses:
        '200':
          description: OK — 補貨成功，回傳更新後品項 + 交易記錄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryTxnResult' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 品項不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: ITEM_INACTIVE — 品項已停用
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  ## --- M11 Pricing Rules v2 (Track B S4 / CR-0004 §8 C3 / ADR-0046) ---
  /tenants/{tenantId}/pricing/rules:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: ['M11 Pricing Rules']
      summary: 計價規則列表 v2（tenant-scoped，cursor 分頁）
      operationId: listPricingRulesV2
      description: |
        取得指定租戶的計價規則列表，支援 brand / lock_type / is_active 過濾與 cursor 分頁。
        預設只回傳 is_active=true；明確帶 is_active=false 才列出停用規則。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: brand
          in: query
          required: false
          schema: { type: string }
          description: 品牌過濾（大小寫不敏感）
        - name: lock_type
          in: query
          required: false
          schema: { type: string }
          description: 鎖具類型過濾
        - name: is_active
          in: query
          required: false
          schema: { type: boolean }
          description: 是否啟用（預設只回傳 true；帶 false 列出停用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRulePage' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: ['M11 Pricing Rules']
      summary: 建立計價規則（tenant-scoped v2，並寫 change_request 審計）
      operationId: createPricingRuleV2
      description: |
        新建計價規則（INSERT saas.price_rule），同時並寫 saas.change_request（type_code='pricing_rule', state='effective'）治理審計軌跡（ADR-0046）。
        X-Initiator 為必填 header，記入 change_request.created_by。
        Idempotency-Key 防重（24h dedup）。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, lock_type, base_price]
              properties:
                brand:
                  type: string
                  minLength: 1
                  description: 品牌（必填）
                lock_type:
                  type: string
                  minLength: 1
                  description: 鎖具類型（必填）
                difficulty:
                  type: string
                  nullable: true
                  enum: [easy, medium, hard]
                  description: 難度（選填）
                base_price:
                  type: string
                  description: 基本費用（decimal string 或 number，非負；例："1200.00"）
                labor_cost:
                  type: string
                  nullable: true
                  description: 工資（decimal string 或 number，選填；例："300.00"）
                parts_cost:
                  type: string
                  nullable: true
                  description: 零件費用（decimal string 或 number，選填；例："200.00"）
                modifiers:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/PricingSurcharge'
                  description: 附加費用列表（選填）
                reason:
                  type: string
                  nullable: true
                  description: 變更原因（選填；記入 change_request）
      responses:
        '201':
          description: Created — 計價規則已建立
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRuleEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — 必填欄位缺失或格式錯誤
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

