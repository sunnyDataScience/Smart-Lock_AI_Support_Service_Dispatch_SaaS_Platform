  ## --- Reconciliation v2 dual-sign (FR-0013 / CR-0004 §8 / M12 Settlement) ---

  /tenants/{tenantId}/accounting/reconciliations:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: ['M12 Settlement']
      summary: 對帳單列表 v2（tenant-scoped，cursor 分頁）
      operationId: listReconciliationsV2
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_review, approved, disputed]
          description: 對帳單狀態篩選（pending|in_review|approved|disputed）
        - name: technician_id
          in: query
          required: false
          schema: { type: string }
          description: 技師 UUID filter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationPage' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/accounting/reconciliations/{reconId}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: reconId, in: path, required: true, schema: { type: string }, description: 對帳單 UUID }
    get:
      tags: ['M12 Settlement']
      summary: 取單筆對帳單 v2（tenant-scoped）
      operationId: getReconciliationV2
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationEnvelope' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 對帳單不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/accounting/reconciliations/{reconId}:review:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: reconId, in: path, required: true, schema: { type: string }, description: 對帳單 UUID }
    post:
      tags: ['M12 Settlement']
      summary: CSM review（step-1，pending → in_review）
      operationId: reviewReconciliationV2
      description: |
        dual-sign 第一步：CSM 審核對帳單，status 由 pending 轉為 in_review。
        X-Initiator 記為 reviewed_by；Idempotency-Key 防重。
        409 STATE_CONFLICT：對帳單 status 非 pending。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: 審核備註（選填，最多 500 字）
      responses:
        '200':
          description: OK — 對帳單已進入 in_review，回傳更新後對帳單
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: STATE_CONFLICT — 對帳單非 pending 狀態，不可 review
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/accounting/reconciliations/{reconId}:co-sign:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: reconId, in: path, required: true, schema: { type: string }, description: 對帳單 UUID }
    post:
      tags: ['M12 Settlement']
      summary: ops_manager co-sign（step-2，in_review → approved + settlement 建立）
      operationId: coSignReconciliationV2
      description: |
        dual-sign 第二步：ops_manager co-sign，status 由 in_review 轉為 approved，
        同時 INSERT saas.settlement（技師付款記錄）。
        X-Initiator 記為 approved_by；SoD 規則：approved_by ≠ reviewed_by，否則 403 SOD_VIOLATION。
        409 DUAL_SIGN_REQUIRED：對帳單 status 非 in_review（尚未完成第一步 review）。
        403 SOD_VIOLATION：co-signer 與 reviewer 為同一人（Separation of Duties）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: 共簽備註（選填，最多 500 字）
      responses:
        '200':
          description: OK — 雙簽完成，回傳 reconciliation + settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationCoSignResult' }
        '403':
          description: SOD_VIOLATION — co-signer 與 reviewer 相同（SoD 違反）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: DUAL_SIGN_REQUIRED — 對帳單非 in_review 狀態，需先完成 review
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  ## --- Dispute v2 dual-sign 狀態機 (FR-0013 / CR-0004 §8 / M14 Dispute) ---

  /tenants/{tenantId}/disputes:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: ['M14 Dispute']
      summary: 爭議列表 v2（tenant-scoped，cursor 分頁）
      operationId: listDisputesV2
      description: |
        取得指定租戶的爭議列表，支援多欄位篩選與 cursor 分頁。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [filed, in_review, mediation, resolved, escalated, closed_withdrawn]
          description: 爭議狀態篩選（filed|in_review|mediation|resolved|escalated|closed_withdrawn）
        - name: dispute_type
          in: query
          required: false
          schema:
            type: string
            enum: [pricing, quality, warranty, cancellation_fee, settlement]
          description: 爭議類型篩選（pricing|quality|warranty|cancellation_fee|settlement）
        - name: work_order_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 工單 UUID filter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputePage' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: ['M14 Dispute']
      summary: 開立爭議（status=filed, sla_deadline=now+60d）
      operationId: openDisputeV2
      description: |
        新建爭議，status=filed，sla_deadline=now+60d。
        Idempotency-Key 防重（24h dedup）。
        201 回新建爭議；409 表示幂等重複。
        跨租戶寫入（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_WRITE。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filed_by, dispute_type]
              properties:
                filed_by:
                  type: string
                  format: uuid
                  description: 提交爭議的使用者 UUID
                dispute_type:
                  type: string
                  enum: [pricing, quality, warranty, cancellation_fee, settlement]
                  description: 爭議類型
                description:
                  type: string
                  nullable: true
                  description: 爭議描述（選填）
                work_order_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 關聯工單 UUID（選填）
                invoice_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: 關聯發票 UUID（選填）
                evidence:
                  nullable: true
                  description: 佐證資料（jsonb，選填）
      responses:
        '201':
          description: Created — 爭議已開立，status=filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 爭議 UUID }
    get:
      tags: ['M14 Dispute']
      summary: 取單筆爭議 v2（tenant-scoped）
      operationId: getDisputeV2
      description: |
        取得單筆爭議詳情。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
        404 NOT_FOUND 若爭議不存在或不屬於此 tenant。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 爭議不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:review:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 爭議 UUID }
    post:
      tags: ['M14 Dispute']
      summary: CSM review（step-1，filed → in_review 或 mediation）
      operationId: reviewDisputeV2
      description: |
        dual-sign 第一步：CSM 審核爭議，status 由 filed 轉為 in_review（to_mediation=true 則轉 mediation）。
        X-Initiator 記為 reviewed_by；Idempotency-Key 防重。
        409 STATE_CONFLICT：爭議 status 非 filed。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_resolution]
              properties:
                proposed_resolution:
                  type: string
                  minLength: 1
                  description: CSM 提案解決方案
                resolution_amount:
                  type: number
                  nullable: true
                  description: 提案金額（選填）
                to_mediation:
                  type: boolean
                  default: false
                  description: true 則 status 轉為 mediation 而非 in_review
      responses:
        '200':
          description: OK — 爭議已進入 in_review（或 mediation），回傳更新後爭議
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: STATE_CONFLICT — 爭議非 filed 狀態，不可 review
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:co-sign:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 爭議 UUID }
    post:
      tags: ['M14 Dispute']
      summary: ops_manager co-sign（step-2，in_review|mediation → resolved）
      operationId: coSignDisputeV2
      description: |
        dual-sign 第二步：ops_manager co-sign，status 由 in_review 或 mediation 轉為 resolved。
        X-Initiator 記為 cosigned_by；SoD 規則：cosigned_by ≠ reviewed_by，否則 403 SOD_VIOLATION。
        409 DUAL_SIGN_REQUIRED：爭議 status 非 in_review/mediation（尚未完成第一步 review）。
        403 SOD_VIOLATION：co-signer 與 reviewer 為同一人（Separation of Duties）。
        HD-4：resolution_amount < 0 僅記錄 [DEFERRED]，不觸發 DGS/refund cascade（Phase II / ADR-0061/FR-0014）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  minLength: 5
                  description: 最終解決方案（最少 5 字）
                resolution_amount:
                  type: number
                  nullable: true
                  description: 最終金額（選填；負值→DGS/refund cascade DEFERRED Phase II）
      responses:
        '200':
          description: OK — 雙簽完成，status=resolved，回傳更新後爭議
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: SOD_VIOLATION — co-signer 與 reviewer 相同（SoD 違反）
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: DUAL_SIGN_REQUIRED — 爭議非 in_review/mediation 狀態，需先完成 review
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:withdraw:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 爭議 UUID }
    post:
      tags: ['M14 Dispute']
      summary: 撤銷爭議（filed|in_review|mediation → closed_withdrawn）
      operationId: withdrawDisputeV2
      description: |
        客戶撤銷爭議，status 轉為 closed_withdrawn。
        Idempotency-Key 防重。
        409 STATE_CONFLICT：爭議已 resolved/escalated/closed_withdrawn，不可撤銷。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  description: 撤銷原因（選填）
      responses:
        '200':
          description: OK — 爭議已撤銷，status=closed_withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: STATE_CONFLICT — 爭議不在可撤銷狀態
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:escalate:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 爭議 UUID }
    post:
      tags: ['M14 Dispute']
      summary: 手動升級爭議（filed|in_review|mediation → escalated）
      operationId: escalateDisputeV2
      description: |
        手動升級爭議至 escalated（escalated_to=ops_director）。
        60d 自動升級為 Phase II Cloud Scheduler（AC-03）。
        X-Initiator 記為升級發起人；Idempotency-Key 防重。
        409 STATE_CONFLICT：爭議已 resolved/escalated/closed_withdrawn，不可升級。
        emit DisputeEscalated 事件（audit log）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XInitiator'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  description: 升級原因（選填）
      responses:
        '200':
          description: OK — 爭議已升級，status=escalated，escalated_to=ops_director
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: STATE_CONFLICT — 爭議不在可升級狀態
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/disputes/{disputeId}:reopen:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - { name: disputeId, in: path, required: true, schema: { type: string, format: uuid }, description: 原爭議 UUID }
    post:
      tags: ['M14 Dispute']
      summary: 重開爭議（resolved|closed_withdrawn → 新 dispute w/ parent_dispute_id）
      operationId: reopenDisputeV2
      description: |
        AC-05 reopen：不可直接重開已關閉爭議，必須新建 dispute 並引用 parent_dispute_id=原 disputeId。
        原爭議須為 resolved 或 closed_withdrawn，否則 409 STATE_CONFLICT。
        繼承原 dispute 的 work_order_id / invoice_id / filed_by / dispute_type（caller 可覆寫 description 與 dispute_type）。
        201 回新建爭議（status=filed, sla_deadline=now+60d）。
        Idempotency-Key 防重。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  nullable: true
                  description: 新爭議描述（選填，未提供則繼承原 dispute）
                dispute_type:
                  type: string
                  enum: [pricing, quality, warranty, cancellation_fee, settlement]
                  nullable: true
                  description: 新爭議類型（選填，未提供則繼承原 dispute）
      responses:
        '201':
          description: Created — 新爭議已建立，status=filed，parent_dispute_id=原 disputeId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputeEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 原爭議不存在
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: STATE_CONFLICT — 原爭議非 resolved/closed_withdrawn，不可 reopen
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  ## --- Conversations v2 (P2-W2 / CR-0003 / FR-0018) ---
  /tenants/{tenantId}/conversations:
    x-phase: P2-W2
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: [Conversations]
      summary: 對話列表 v2（tenant-scoped，cursor 分頁）
      operationId: listConversations
      description: |
        取得指定租戶的對話列表，支援 status 篩選與 cursor 分頁。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
        對應 FR-0018 M01 Conversation。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, waiting_human, closed]
          description: '對話狀態篩選'
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: '分頁游標（上一頁回傳的 next_cursor）'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 'OK — tenant-scoped 對話列表（cursor 分頁）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Insufficient role or cross-tenant read forbidden' }
    post:
      tags: [Conversations]
      summary: 建立對話 v2（tenant-scoped，F-001 LINE 報修首訊建 ServiceTicket）
      operationId: createConversation
      description: |
        建立新的對話（ServiceTicket）。session_id 為業務冪等鍵；
        相同 session_id 重複呼叫回傳 200（已存在）。
        首次建立回傳 201。跨租戶寫入回傳 403 CROSS_TENANT_WRITE。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreateRequest' }
      responses:
        '201':
          description: 'Created — 對話建立成功'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationEnvelope' }
        '200':
          description: 'OK — 對話已存在（session_id 冪等）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationEnvelope' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Insufficient role or cross-tenant write forbidden' }
        '422': { description: 'Validation error' }

  /tenants/{tenantId}/conversations/{conversationId}:
    x-phase: P2-W2
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: conversationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Conversations]
      summary: 對話詳情 v2（tenant-scoped）
      operationId: getConversation
      description: |
        取得指定對話的詳情。對話不屬於 path tenantId 時回傳 404。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK — 對話詳情'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationEnvelope' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Insufficient role or cross-tenant read forbidden' }
        '404': { description: 'Conversation not found' }

  /tenants/{tenantId}/conversations/{conversationId}/messages:
    x-phase: P2-W2
