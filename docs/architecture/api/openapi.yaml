              properties:
                brand:
                  type: string
                  minLength: 1
                  description: 品牌（必填）
                lock_type:
                  type: string
                  minLength: 1
                  description: 鎖具類型（必填）
                difficulty:
                  type: string
                  nullable: true
                  enum: [easy, medium, hard]
                  description: 難度（選填）
                base_price:
                  type: string
