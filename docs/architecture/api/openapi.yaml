            - KB_SCOPE_VIOLATION
            - SERIAL_NOT_FOUND
            - IMAGE_QUALITY_REJECT
            - VISION_API_FORBIDDEN
            - EXTERNAL_DEP_DOWN
            - NOT_IMPLEMENTED_V1
