  ## --- Voucher (ADR-VCH-001/002 V1) — v2.2 added per MoM #2 ---
  ## Design notes (sd):
  ## - CQRS: write-side via journal_entry trigger (no public POST)
  ## - read-side: GET single + GET list (cursor) + V2.1 export endpoint preview
  ## - Append-only contract (no PATCH/DELETE); void via dedicated :void sub-resource action
  ## - Hash chain enforced at DB; API surface is透明 (no hash exposure unless explicitly requested)
  ## - Platform = keeper (per ADR-VCH-001); voucher.issuer_party != 'platform' for sub-contractor flows
  /vouchers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: ['Voucher (ADR-VCH-001/002 V1)']
      summary: Read single voucher
      operationId: getVoucher
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '403': { description: CROSS_TENANT_READ }
        '404': { description: not found }
        '410': { description: VOUCHER_VOIDED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /vouchers:
    get:
      tags: ['Voucher (ADR-VCH-001/002 V1)']
      summary: List vouchers (cursor pagination, max 100)
      operationId: listVouchers
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'YYYY-MM' }
        - { name: tenant_id, in: query, required: true, schema: { type: string } }
        - { name: issuer_party, in: query, schema: { type: string, enum: [platform, locksmith, brand] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/VoucherList' } } } }
        '422': { description: invalid period format }
  /vouchers/{id}/void:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: ['Voucher (ADR-VCH-001/002 V1)']
      summary: Void voucher (writes red entry; original row never modified)
      operationId: voidVoucher
      security: [{ bearerAuth: [], keeperRole: [] }]
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [error_correction, customer_dispute, tax_adjust] }
                comment: { type: string }
      responses:
        '201':
          description: Red entry voucher created (new voucher_no with reverses_voucher_id FK)
          content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } }
        '409': { description: already voided }
        '410': { description: original already voided }

  ## V2.1 preview (NOT IMPLEMENTED IN V1; schema reserved per ADR-VCH-002)
  /vouchers/export:
    get:
      tags: ['Voucher (ADR-VCH-001/002 V1)']
      summary: '[V2.1 preview] Async export job for ERP / 電子發票 ED4'
      operationId: exportVouchers
      security: [{ bearerAuth: [], keeperRole: [] }]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, json, ed4] } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '202':
          description: Job queued (async); poll /exports/{job_id} for signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  estimated_ready_at: { type: string, format: date-time }
        '501': { description: 'V2.1 only; V1 returns Not Implemented' }
  /exports/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: ['Voucher (ADR-VCH-001/002 V1)']
      summary: '[V2.1 preview] Poll export job; returns signed URL (15min TTL) when ready'
      operationId: getExportJob
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [pending, ready, expired, failed] }
                  signed_url: { type: string, nullable: true }
                  ttl_seconds: { type: integer }
                  audit_log_hash_head: { type: string, description: 'Latest hash chain head at export time, for downstream verify' }


  ## ============================================================
  ## Auth — platform-level (Q6: collected from api/routers/auth.py)
  ## ============================================================
  /auth/login:
    post:
      tags: [Auth]
      summary: Admin login — issues access + refresh token pair
      operationId: loginAdmin
      description: |
        Authenticates users with roles `admin` or `reviewer`.
        Returns JWT access token (TTL=1h) and opaque refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Authenticated; tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Invalid credentials
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Role not allowed (not admin / reviewer)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange refresh token for new access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Refresh token expired or revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke access + refresh tokens (logout)
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, nullable: true }
      responses:
        '204': { description: Logged out; tokens invalidated }
        '401':
          description: Bearer token missing or expired
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (requires current password verification)
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 8, maxLength: 72 }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '204': { description: Password updated }
        '401':
          description: Current password incorrect or token expired
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Password policy violation
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /technicians/login:
    post:
      tags: [Auth]
      summary: Technician login — issues access + refresh token pair
      operationId: loginTechnician
      description: |
        Authenticates users with role `technician`.
        Returns JWT access token (TTL=1h) and opaque refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Authenticated; tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Invalid credentials
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: Role not allowed (not technician)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

