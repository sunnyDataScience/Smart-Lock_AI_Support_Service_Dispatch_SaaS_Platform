        conversation_id: { type: string }
        message_ts: { type: string, format: date-time }
    DebounceCheckResponse:
      type: object
      properties:
        should_process: { type: boolean }
        window_ms: { type: integer, description: '800 ± 100 per K-AI-9' }

    AgentRequest:
      type: object
      required: [conversation_id, message_text]
      properties:
        conversation_id: { type: string }
        message_text: { type: string }
        media_refs: { type: array, items: { type: string } }
    AgentResponse:
      type: object
      properties:
        response_text: { type: string }
        skill_invoked: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              chunk_id: { type: string }
        guardrail_passed: { type: boolean }

    RagSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        top_k: { type: integer, default: 5, maximum: 20 }
    RagSearchResponse:
      type: object
      properties:
        chunks:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              chunk_id: { type: string }
              text: { type: string }
              score: { type: number }

    GuardrailCheckRequest:
      type: object
      required: [candidate_text]
      properties:
        candidate_text: { type: string }
        context: { type: object }
    GuardrailCheckResponse:
      type: object
      properties:
        passed: { type: boolean }
        rule_triggered_by:
          type: string
          enum: [none, hard_rule_quote_ntd, hard_rule_discount, hard_rule_warranty_waiver, hard_rule_off_topic, hard_rule_prompt_injection]

    PCDraftRequest:
      type: object
      required: [conversation_id]
      properties:
        conversation_id: { type: string }
        device_id_guess: { type: string, nullable: true }
        symptom: { type: array, items: { type: string } }
        urgency:
          type: string
          enum: [normal, urgent_locked_out, urgent_trapped_inside, urgent_safety_risk, urgent_angry_customer_high_risk]
    PCDraftReceipt:
      type: object
      properties:
        problem_card_id: { type: string }
        cs_queue_position: { type: integer }

    HandoffRequest:
      type: object
      required: [conversation_id, trigger]
      properties:
        conversation_id: { type: string }
        trigger:
          type: string
          enum: [hard_rule_urgent, hard_rule_warranty, hard_rule_pricing_dispute, hard_rule_repeat_failure, ai_proactive_offer, customer_explicit_request, agent_pickup]
    HandoffResponse:
      type: object
      properties:
        callback_link: { type: string, format: uri }
        eta_minutes: { type: integer }

    ImageUpload:
      type: object
      required: [image]
      properties:
        image: { type: string, format: binary }
        conversation_id: { type: string }
    ImageUploadResult:
      type: object
      properties:
        evidence_id: { type: string }
        quality_passed: { type: boolean }
        rejected_reason: { type: string, nullable: true }

    EvalRunRequest:
      type: object
      required: [corpus]
      properties:
        corpus: { type: string, enum: [forbidden_200, accuracy_weekly, multimodal_weekly] }
        baseline_run_id: { type: string, nullable: true }
    EvalRunHandle: { type: object, properties: { run_id: { type: string } } }
    EvalRunResult:
      type: object
      properties:
        run_id: { type: string }
        corpus: { type: string }
        pass_rate: { type: number }
        block_deploy: { type: boolean }

    HealthReport:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, down] }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string }
              last_check_at: { type: string, format: date-time }

    KBDocumentList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KBDocument' } }
        next_cursor: { type: string, nullable: true }
    KBDocument:
      type: object
      properties:
        id: { type: string }
        doc_type: { type: string, enum: [mega_doc, manual, sop, faq] }
        tenant_scope: { type: array, items: { type: string } }
        brand_scope: { type: array, items: { type: string } }
        project_scope: { type: array, items: { type: string } }
        title: { type: string }
        version: { type: string }
        effective_date: { type: string, format: date }
    KBDocumentIngest:
      type: object
      required: [doc_type, title, source_uri]
      properties:
        doc_type: { type: string, enum: [mega_doc, manual, sop, faq] }
        title: { type: string }
        source_uri: { type: string, format: uri }
        tenant_scope: { type: array, items: { type: string } }
        brand_scope: { type: array, items: { type: string } }
        project_scope: { type: array, items: { type: string } }
    DynamicLookupResult:
      type: object
      properties:
        lookup_key: { type: string }
        resolved_payload: { type: object }
        source_doc_id: { type: string, nullable: true }
        cached: { type: boolean }

    SyncEventEnvelope:
      type: object
      required: [event_type, event_payload, source_module, target_module]
      properties:
        event_type: { type: string }
        event_payload: { type: object }
        source_module: { type: string }
        target_module: { type: string }
        correlation_id: { type: string }
    SyncReceipt:
      type: object
      properties:
        receipt_id: { type: string }
        accepted_at: { type: string, format: date-time }
    ConvertToWORequest:
      type: object
      required: [problem_card_id, human_confirmed, cs_actor_id]
      properties:
        problem_card_id: { type: string }
        human_confirmed: { type: boolean }
        cs_actor_id: { type: string }
        quote_id: { type: string, nullable: true }

    SerialLookupRequest:
      type: object
      required: [brand_id, serial]
      properties:
        brand_id: { type: string }
        serial: { type: string }
    SerialLookupResult:
      type: object
      properties:
        device_id: { type: string, nullable: true }
        warranty_class: { type: string, enum: [full, parts_only, labor_only, expired, unknown] }
        upstream_partner_id: { type: string, nullable: true }

    WarrantyInquireRequest:
      type: object
      required: [brand_id, serial]
      properties:
        brand_id: { type: string }
        serial: { type: string }
    WarrantyInquireResult:
      type: object
      properties:
        warranty_class: { type: string, enum: [full, parts_only, labor_only, expired] }
        expiry_date: { type: string, format: date, nullable: true }
        partner_id: { type: string }

    RMASubmitRequest:
      type: object
      required: [partner_id, brand_id, work_order_id]
      properties:
        partner_id: { type: string }
        brand_id: { type: string }
        work_order_id: { type: string }
        evidence_ids: { type: array, items: { type: string } }
    RMASubmitReceipt:
      type: object
      properties:
        rma_id: { type: string }
        partner_acknowledged_at: { type: string, format: date-time, nullable: true }

    ChangeRequestRef:
      type: object
      properties:
        change_request_id: { type: string }
        effective_date: { type: string, format: date, nullable: true }

    # M01 Dashboard schemas（CR-0003 P2-W1, FR-0021）
    DashboardPeriod:
      type: string
      enum: [today, 7d, 30d, 90d]
      description: Dashboard 統計時段

    DashboardConversations:
      type: object
      required: [total, active, resolved, escalated]
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        escalated: { type: integer, minimum: 0 }

    DashboardResolution:
      type: object
      properties:
        ai_resolution_rate:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: AI 解決率（L1+L2 / 有解層記錄總數）
        avg_resolution_time_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: 平均解決時間（秒）
        by_layer:
          type: object
          additionalProperties: { type: integer }
          nullable: true
          description: '各解決層數量：case_library / rag / human'

    DashboardHotTopic:
      type: object
      properties:
        topic: { type: string, nullable: true }
        count: { type: integer, minimum: 0, nullable: true }

    DashboardTokenUsage:
      type: object
      properties:
        total_tokens: { type: integer, nullable: true }
        prompt_tokens: { type: integer, nullable: true }
        completion_tokens: { type: integer, nullable: true }
        estimated_cost_usd:
          type: number
          format: float
          nullable: true
          description: 估算成本（USD，Gemini 2.5 Pro blended price）

    DashboardTopBrand:
      type: object
      properties:
        brand: { type: string, nullable: true }
        count: { type: integer, minimum: 0, nullable: true }

    DashboardWorkOrders:
      type: object
      description: 派工今日 KPI
      properties:
        today_count:
          type: integer
          minimum: 0
          nullable: true
          description: 今日新建工單數
        completion_rate:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: 今日完工率（today_count == 0 時為 null）
        overdue_count:
          type: integer
          minimum: 0
          nullable: true
          description: 排程時間已過且未結案工單數

    DashboardTechnicians:
      type: object
      description: 技師概況 KPI
      properties:
        total_count:
          type: integer
          minimum: 0
          nullable: true
          description: 此租戶啟用中（status=active）的技師總數
        online_count:
          type: integer
          minimum: 0
          nullable: true
          description: 目前可派遣的技師數
        dispatchable_count:
          type: integer
          minimum: 0
          nullable: true
          description: 已上線且可立即指派（保留欄位，目前等同 online_count）

    DashboardStats:
      type: object
      required: [period, conversations, resolution]
      description: Dashboard KPI 統計（tenant-scoped，FR-0021）
      properties:
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        conversations:
          $ref: '#/components/schemas/DashboardConversations'
        resolution:
          $ref: '#/components/schemas/DashboardResolution'
        hot_topics:
          type: array
          items:
            $ref: '#/components/schemas/DashboardHotTopic'
          nullable: true
        token_usage:
          $ref: '#/components/schemas/DashboardTokenUsage'
        top_brands:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTopBrand'
          nullable: true
        work_orders:
          $ref: '#/components/schemas/DashboardWorkOrders'
        technicians:
          $ref: '#/components/schemas/DashboardTechnicians'

    # --- Notification v2 schemas (P2-W2 / CR-0003 / ADR-0012) ---
    NotificationSeverity:
      type: string
      enum: [info, warning, critical]

    NotificationType:
      type: string
      enum: [work_order, refund, dispute, rbac, inventory, sla, system, mention]

    NotificationRelatedEntity:
      type: object
      nullable: true
      properties:
        type: { type: string, nullable: true }
        id: { type: string, nullable: true }
        url: { type: string, nullable: true }

    NotificationAction:
      type: object
      properties:
        label: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }

    Notification:
      type: object
      required: [id, type, severity, title, body, source, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title: { type: string }
        body: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        related_entity:
          $ref: '#/components/schemas/NotificationRelatedEntity'
        actions:
          type: array
          items: { $ref: '#/components/schemas/NotificationAction' }
          nullable: true
        raw_event_id: { type: string, nullable: true }

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        unread_count: { type: integer, nullable: true }

    NotificationUpdate:
      type: object
      properties:
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }

    NotificationBulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
        action:
          type: string
          enum: [mark_read, mark_unread, archive, delete]

    NotificationBulkResult:
      type: object
      properties:
        affected: { type: integer, minimum: 0 }

    MarkAllReadFilter:
      type: object
      properties:
        type:
          type: array
          items: { $ref: '#/components/schemas/NotificationType' }
          nullable: true

    MarkAllReadRequest:
      type: object
      nullable: true
      properties:
        filter:
          $ref: '#/components/schemas/MarkAllReadFilter'
