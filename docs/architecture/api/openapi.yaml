      operationId: createEvalRun
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvalRunRequest' }
      responses:
        '202':
          description: 'Eval run started'
          content: { application/json: { schema: { $ref: '#/components/schemas/EvalRunHandle' } } }
  /chatbot/eval/runs/{runId}:
    parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [A09 Eval & Observability]
      summary: Get eval run result; pass < 95% → block_deploy=true (FR-NEW-3)
      operationId: getEvalRun
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/EvalRunResult' } } } }
  /chatbot/health:
    get:
      tags: [A11 Deployment Health]
      summary: Chatbot system health (FR-0033 + A11)
      operationId: getChatbotHealth
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/HealthReport' } } } }

  # KB — Agent Knowledge Base (ADR-0101)
  /kb/documents:
    get:
      tags: [KB (Agent Knowledge Base)]
      summary: List KB documents (tenant + brand + project scope filter per ADR-0101 §2.3)
      operationId: listKBDocuments
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - { name: X-Brand-Scope, in: header, schema: { type: array, items: { type: string } } }
        - { name: X-Project-Scope, in: header, schema: { type: array, items: { type: string } } }
        - { name: doc_type, in: query, schema: { type: string, enum: [mega_doc, manual, sop, faq] } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/KBDocumentList' } } } }
    post:
      tags: [KB (Agent Knowledge Base)]
      summary: Ingest KB document (mega-doc per ADR-0008 / ADR-0101)
      operationId: ingestKBDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KBDocumentIngest' }
      responses:
        '201': { description: 'Document ingested', content: { application/json: { schema: { $ref: '#/components/schemas/KBDocument' } } } }
  /kb/documents/{docId}:
    parameters: [{ name: docId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [KB (Agent Knowledge Base)]
      summary: Read KB document (with scope check)
      operationId: getKBDocument
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/KBDocument' } } } }
        '403':
          description: KB_SCOPE_VIOLATION
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /kb/dynamic-lookup/serial-warranty:
    get:
      tags: [KB (Agent Knowledge Base)]
      summary: Serial → warranty dynamic lookup (ADR-0101 §2.2 — UC-new-2)
      operationId: kbSerialWarrantyLookup
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - { name: serial, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DynamicLookupResult' } } } }
        '404':
          description: SERIAL_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /kb/dynamic-lookup/project-unit-model:
    get:
      tags: [KB (Agent Knowledge Base)]
      summary: Project → unit → model dynamic lookup (UC-new-3 / BR-M14-02)
      operationId: kbProjectUnitModelLookup
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - { name: project_id, in: query, required: true, schema: { type: string } }
        - { name: unit_id, in: query, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DynamicLookupResult' } } } }

  # Sync — ERP ↔ Chatbot
  /sync/intake-capture:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M01 Intake capture sync — chatbot → ERP raw intake event
      operationId: syncIntakeCapture
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEventEnvelope' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/SyncReceipt' } } } }
  /sync/facts-master:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M02 User facts master sync (SCD2 — eternal retention)
      operationId: syncFactsMaster
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEventEnvelope' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/SyncReceipt' } } } }
  /sync/pc-convert:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M03 PC convert sync — AI draft → ERP PC + CS 1-click queue
      operationId: syncPcConvert
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEventEnvelope' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/SyncReceipt' } } } }
  /sync/convert-to-wo:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M04 Convert-to-WO (G-Sync-3 — Phase I forced human gate)
      operationId: syncConvertToWO
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertToWORequest' }
      responses:
        '201': { description: 'WorkOrder created', content: { application/json: { schema: { $ref: '#/components/schemas/WorkOrderRef' } } } }
        '403':
          description: AI_FORBIDDEN_CONVERT_TO_WO
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /sync/dispatch:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M05 Dispatch sync — ERP → chatbot status push
      operationId: syncDispatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEventEnvelope' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/SyncReceipt' } } } }
  /sync/evidence-writeback:
    post:
      tags: [Sync (ERP ↔ Chatbot)]
      summary: S-M06 Evidence write-back (ERP photo / sign → chatbot context)
      operationId: syncEvidenceWriteback
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncEventEnvelope' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/SyncReceipt' } } } }

  # ACL External Integration
  /acl/serial-control/lookup:
    post:
      tags: [ACL External Integration]
      summary: Brand serial-control system lookup (ADR-0053 + ADR-0068 ACL)
      operationId: aclSerialControlLookup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SerialLookupRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SerialLookupResult' } } } }
        '503':
          description: EXTERNAL_DEP_DOWN
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /acl/brand-warranty/inquire:
    post:
      tags: [ACL External Integration]
      summary: Brand warranty system inquiry (ADR-0044 + ADR-0068 ACL)
      operationId: aclBrandWarrantyInquire
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarrantyInquireRequest' }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyInquireResult' } } } }
  /acl/rma-partner/submit:
    post:
      tags: [ACL External Integration]
      summary: Submit RMA to partner system (FR-0048 quality feedback loop)
      operationId: aclRmaPartnerSubmit
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RMASubmitRequest' }
      responses:
        '202': { description: 'Accepted', content: { application/json: { schema: { $ref: '#/components/schemas/RMASubmitReceipt' } } } }

  # M01 Dashboard — tenant-scoped KPI 統計（CR-0003 P2-W1, FR-0021）
  /tenants/{tenantId}/dashboard/stats:
    x-phase: I-readonly
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: [Dashboard]
      summary: Dashboard KPI 統計（tenant-scoped，period filter）
      operationId: getDashboardStats
      description: |
        取得指定租戶在選定時段內的 dashboard KPI 統計，包含對話數、
        AI 解決率、平均解決時間、熱門議題、Token 用量、工單今日 KPI
        與技師概況。period 參數映射：today / 7d / 30d / 90d。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ。
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, 7d, 30d, 90d]
            default: 7d
          description: 統計時段
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK — tenant-scoped dashboard KPI 統計'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthenticated
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: CROSS_TENANT_READ — path tenantId 與 JWT claim 不符
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: DB_UNAVAILABLE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # Phase II placeholders
  /tenants/{tenantId}/settlements/monthly:
    x-phase: II
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    post:
      tags: [M11 AR / Payment]
      summary: '[Phase II] Trigger monthly settlement (M12)'
      operationId: triggerMonthlySettlement
      description: 'NOT exposed in V1. OAuth scope `phase2.settlement` required.'
      responses:
        '200': { description: 'Accepted (Phase II only; V1 returns 501 below)' }
        '501': { description: NOT_IMPLEMENTED_V1 }

  # P2-W1: Reports tenant-scoped v2 (CR-0003 P2-W1, FR-0021)
  /tenants/{tenantId}/reports/kpi:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: 'KPI 儀表板（tenant-scoped v2；漏斗 / 異常率 / 技師效率）'
      operationId: getReportKpi
      description: >
        Returns KPI funnel, dispute rates and technician efficiency for the
        authenticated tenant. Supports `period` enum or explicit `start_date`
        / `end_date` date range. Replaces legacy GET /api/v1/reports/kpi with
        tenant path enforcement (ADR-0030 cross-tenant guard).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: 'KPI report', content: { application/json: { schema: { type: object } } } }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (CROSS_TENANT_READ)' }

  /tenants/{tenantId}/reports/revenue:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: '營收彙整（tenant-scoped v2；KPI + 月度趨勢 + 品牌占比）'
      operationId: getReportRevenue
      description: >
        Returns revenue summary including KPI metrics, monthly trend and
        per-brand breakdown for the authenticated tenant. Replaces legacy
        GET /api/v1/reports/revenue with tenant path enforcement (ADR-0030).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: granularity
          in: query
          schema: { type: string, default: month }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: 'Revenue summary', content: { application/json: { schema: { type: object } } } }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (CROSS_TENANT_READ)' }

  /tenants/{tenantId}/reports/export:
    parameters: [{ $ref: '#/components/parameters/TenantPath' }]
    get:
      tags: [Reports]
      summary: '匯出 KPI / 營收 / 技師排行 / 結算報表（tenant-scoped v2；CSV stream）'
      operationId: exportReport
      description: >
        Streams a CSV export for the given report_type scoped to the
        authenticated tenant. Role gate: admin / operations_manager / accountant.
        Replaces legacy GET /api/v1/reports/export (CSV only; PDF excluded from
        v2 to align with FR-0021 scope). Tenant path enforcement per ADR-0030.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/XTenantId' }
        - name: report_type
          in: query
          required: true
          schema: { type: string, enum: [kpi, revenue, technician_ranking, accounting] }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 'CSV stream'
          content:
            text/csv:
              schema: { type: string }
          headers:
            Content-Disposition:
              schema: { type: string }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Insufficient role or cross-tenant read forbidden' }
        '422': { description: 'Invalid report_type or period parameter' }

  ## --- Notifications v2 (P2-W2 / CR-0003 / ADR-0012 / FR-0018) ---
  /tenants/{tenantId}/notifications:
    get:
      tags: [Notifications]
      summary: 通知列表（tenant-scoped，游標分頁）
      operationId: listNotifications
      description: |
        回傳指定租戶目前登入使用者的通知列表，支援 status / type 過濾。
        取代 legacy GET /api/v1/notifications（tenant path 對齊 ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { type: string, enum: [all, unread, read, archived] }
        - name: type
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/NotificationType' }
          style: form
          explode: true
      responses:
        '200':
          description: 通知列表（游標分頁）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant read forbidden (ADR-0030)' }

  /tenants/{tenantId}/notifications/{notificationId}:
    patch:
      tags: [Notifications]
      summary: 標記通知狀態（tenant-scoped，已讀或封存）
      operationId: updateNotification
      description: |
        更新單則通知的 read_at / archived_at 欄位。
        取代 legacy PATCH /api/v1/notifications/{id}。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationUpdate' }
      responses:
        '200':
          description: 更新後的通知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (ADR-0030)' }
        '404': { description: 'Notification not found' }

  /tenants/{tenantId}/notifications:bulk:
    post:
      tags: [Notifications]
      summary: 批次處理通知（tenant-scoped，mark_read/mark_unread/archive/delete）
      operationId: bulkUpdateNotifications
      description: |
        對指定 ID 列表執行批次操作（最多 1000 筆）。
        取代 legacy POST /api/v1/notifications/bulk。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationBulkRequest' }
      responses:
        '200':
          description: 操作結果（affected 筆數）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationBulkResult' }
        '400': { description: 'Missing Idempotency-Key' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (ADR-0030)' }
        '422': { description: 'Unknown action or ids exceed limit' }

  /tenants/{tenantId}/notifications:mark-all-read:
    post:
      tags: [Notifications]
      summary: 全部標為已讀（tenant-scoped，Critical 類除外）
      operationId: markAllNotificationsRead
      description: |
        將目前登入使用者在此租戶下所有未讀通知標為已讀，severity=critical 排除。
        取代 legacy POST /api/v1/notifications/mark-all-read。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantPath' }
        - { $ref: '#/components/parameters/XTenantId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkAllReadRequest' }
      responses:
        '200':
          description: 標記結果（affected 筆數）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationBulkResult' }
        '400': { description: 'Missing Idempotency-Key' }
        '401': { description: 'Unauthenticated' }
        '403': { description: 'Cross-tenant write forbidden (ADR-0030)' }


components:
  parameters:
    TenantPath:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string }
      description: 'Tenant routing header (ADR-0030 hard-enforced at handler entry)'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: 'POST/PUT/DELETE only. Hash chain semantics per ADR-0064 / ADR-0066.'
    XConfigVersion:
      name: X-Config-Version
      in: header
      required: false
      schema: { type: string }
      description: 'Config snapshot version at request entry (ADR-0067 §5 + ADR-0068).'
    XInitiator:
      name: X-Initiator
      in: header
      required: true
      schema: { type: string }
      description: 'SoD initiator (BR-M17-01). Must differ from X-Approver / X-Executor.'
    XApprover:
      name: X-Approver
      in: header
      required: true
      schema: { type: string }
      description: 'SoD approver. 403 SOD_VIOLATION if equal to initiator.'
    XExecutor:
      name: X-Executor
      in: header
      required: false
      schema: { type: string }
      description: 'SoD executor (e.g. payment provider system).'
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    StateConflict:
      description: '409 — entity state does not allow this transition'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SchemaInvalid:
      description: '422 — schema validation failed'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: '403 — insufficient authority / SoD violation / scope violation'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth2 client_credentials grant. Mint via `/oauth/token`. TTL=1h.
        JWT carries: `sub` (client_id), `tenant_id`, `roles[]`, `brand_scope[]`,
        `project_scope[]`, `phase_scope[]` (e.g. `["v1","phase1"]`).
    keeperRole:
      type: apiKey
      in: header
      name: X-Keeper-Role
      description: 'Platform keeper role (ADR-VCH-001); required for voucher void / export operations'
    dgsExecutor:
      type: apiKey
      in: header
      name: X-DGS-Executor
      description: 'DGS executor role (ADR-0061); required for evidence purge'
    legalRole:
      type: apiKey
      in: header
      name: X-Legal-Role
      description: 'Legal / DPO role (ADR-0061); required for legal-hold flip'
    dpoOrDataSubject:
      type: apiKey
      in: header
      name: X-DPO-Or-Data-Subject
      description: 'DPO or data-subject role (ADR-0061 GDPR); required for forget request'
  schemas:
    # RFC 7807 problem+json Error — canonical shape (merged from openapi-smart-lock-saas.yaml)
    # All $ref: '#/components/schemas/Error' across both specs point here.
    Error:
      type: object
      required: [type, title, status, code, trace_id]
      description: RFC 7807 problem+json + trace_id extension
      properties:
        type: { type: string, format: uri, description: 'URI to error doc' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        code:
          type: string
          enum:
            # auth / multi-tenant (openapi.yaml legacy codes)
            - CROSS_TENANT_WRITE
            - CROSS_TENANT_READ
            - CONTRACT_VERSION_CONFLICT
            - SCOPE_OVERLAP
            - ADDRESS_REQUIRED_FOR_CLOSE
            - PC_UNIQUE_VIOLATION
            - AI_FORBIDDEN_ACTION
            - DGS_LEGAL_HOLD_ACTIVE
            - VOUCHER_VOIDED
            - VOUCHER_ALREADY_VOIDED
            - LEGAL_HOLD_BLOCKS_FORGET
            - SOP_DUAL_REVIEW_NOT_DONE
            # v2.3.0 Quote / Pricing cascade (ADR-0062 ~ 0066)
