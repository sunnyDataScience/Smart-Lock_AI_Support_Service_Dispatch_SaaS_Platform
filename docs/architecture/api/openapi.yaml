                modifiers:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/PricingSurcharge'
                  description: 附加費用列表（選填）
                reason:
                  type: string
                  nullable: true
                  description: 變更原因（選填；記入 change_request）
      responses:
        '200':
          description: OK — 計價規則已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRuleEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 計價規則不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — 必填欄位缺失或格式錯誤
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # --- M09 Data Corrections v2 (Track B S5 / CR-0004 §8 / ADR-0029 / ADR-0030) ---
  /tenants/{tenantId}/data-corrections:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: ['M09 Data Corrections']
      summary: 資料修正 review queue 列表 v2（tenant-scoped，cursor 分頁）
      operationId: listDataCorrectionsV2
      description: |
        列出租戶的資料修正 review queue（saas.data_corrections），cursor 分頁（newest first）。
        status 可篩選 pending / approved / resolved / rejected；空值回傳全部。
        跨租戶讀取（path tenantId ≠ JWT tenant_id）回傳 403 CROSS_TENANT_READ（ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, resolved, rejected]
          description: 過濾狀態：pending / approved / resolved / rejected（空 = 全部）
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCorrectionPage' }
        '400':
          description: INVALID — cursor 格式錯誤或 status 不合法
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/data-corrections/{correctionId}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: correctionId
        in: path
        required: true
        schema: { type: integer }
        description: 資料修正 BIGINT PK（非 uuid）
    get:
      tags: ['M09 Data Corrections']
      summary: 資料修正詳情 v2（tenant-scoped）
      operationId: getDataCorrectionV2
      description: |
        取單筆資料修正（saas.data_corrections），含 tenant_id guard。
        404 NOT_FOUND 若不存在或不屬於此 tenant；403 CROSS_TENANT_READ 若 path tenantId ≠ JWT tenant_id（ADR-0030）。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCorrectionEnvelope' }
        '403':
          description: CROSS_TENANT_READ
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 資料修正不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/data-corrections/{correctionId}:approve:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: correctionId
        in: path
        required: true
        schema: { type: integer }
        description: 資料修正 BIGINT PK（非 uuid）
    post:
      tags: ['M09 Data Corrections']
      summary: 核准資料修正 v2（pending→approved，admin-only）
      operationId: approveDataCorrectionV2
      description: |
        狀態轉換 pending → approved（HD-2 / HD-3）。
        SOP draft 自動建立延 phase 2（follow-up HD-3）。
        Idempotency-Key 防重（24h dedup）。
        409 CONFLICT：correction status 非 pending（不可核准）。
        403 CROSS_TENANT_WRITE：path tenantId ≠ JWT tenant_id（ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                review_note:
                  type: string
                  nullable: true
                  description: 審核備註（選填）
      responses:
        '200':
          description: OK — 資料修正已核准，回傳更新後 correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCorrectionEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 資料修正不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: CONFLICT — correction status 非 pending，不可核准
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/data-corrections/{correctionId}:reject:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: correctionId
        in: path
        required: true
        schema: { type: integer }
        description: 資料修正 BIGINT PK（非 uuid）
    post:
      tags: ['M09 Data Corrections']
      summary: 駁回資料修正 v2（pending→rejected，admin-only）
      operationId: rejectDataCorrectionV2
      description: |
        狀態轉換 pending → rejected（HD-2）。
        Idempotency-Key 防重（24h dedup）。
        409 CONFLICT：correction status 非 pending（不可駁回）。
        403 CROSS_TENANT_WRITE：path tenantId ≠ JWT tenant_id（ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                review_note:
                  type: string
                  nullable: true
                  description: 駁回原因備註（選填）
      responses:
        '200':
          description: OK — 資料修正已駁回，回傳更新後 correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCorrectionEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 資料修正不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: CONFLICT — correction status 非 pending，不可駁回
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /tenants/{tenantId}/data-corrections/{correctionId}:resolve:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: correctionId
        in: path
        required: true
        schema: { type: integer }
        description: 資料修正 BIGINT PK（非 uuid）
    post:
      tags: ['M09 Data Corrections']
      summary: 標記資料修正已處理 v2（approved→resolved，admin-only）
      operationId: resolveDataCorrectionV2
      description: |
        狀態轉換 approved → resolved（HD-2 第四態）。Knowledge Owner 完成知識螺旋後標記。
        SOP draft 自動建立留 phase 2（follow-up HD-3）。
        Idempotency-Key 防重（24h dedup）。
        409 CONFLICT：correction status 非 approved（不可標記已處理）。
        403 CROSS_TENANT_WRITE：path tenantId ≠ JWT tenant_id（ADR-0030）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                review_note:
                  type: string
                  nullable: true
                  description: 處理備註（選填）
      responses:
        '200':
          description: OK — 資料修正已標記 resolved，回傳更新後 correction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataCorrectionEnvelope' }
        '403':
          description: CROSS_TENANT_WRITE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 資料修正不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: CONFLICT — correction status 非 approved，不可標記 resolved
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # --- M03 ProblemCard resolution engine (tenant-scoped) ---
  /tenants/{tenantId}/problem-cards/{problemCardId}:resolve-suggest:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: problemCardId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 問題卡 UUID
    post:
      tags: ['M03 ProblemCard (Bridge — see openapi.yaml)']
      summary: 解決方案引擎建議 v2（tenant-scoped；FAQ/RAG/escalation 階層）
      operationId: resolveProblemSuggestV2
      description: |
        呼叫 resolution_service 階層引擎（L1 faq_match / L2 knowledge_base_rag / L3 llm_generation / L4 escalation）。
        problemCardId 由 path 帶入（取代 legacy flat /resolve 的 body.problem_card_id）。
        Idempotency-Key 防重（24h dedup）。
        403 CROSS_TENANT_READ：path tenantId ≠ JWT tenant_id（ADR-0030）。
        404 NOT_FOUND：problem card 不存在或不屬於此 tenant。
        422 VALIDATION_ERROR：問題卡缺少 brand/model/symptom，無法建構查詢。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: OK — 回傳解決方案引擎建議（layer/answer/sources/confidence）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveResponse' }
        '403':
          description: CROSS_TENANT_READ — path tenantId 與 JWT tenant_id 不符
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: NOT_FOUND — 問題卡不存在或不屬於此 tenant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: VALIDATION_ERROR — 問題卡缺少 brand/model/symptom，無法建構查詢
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }


components:
  parameters:
    TenantPath:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string }
      description: 'Tenant routing header (ADR-0030 hard-enforced at handler entry)'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: 'POST/PUT/DELETE only. Hash chain semantics per ADR-0064 / ADR-0066.'
    XConfigVersion:
      name: X-Config-Version
      in: header
      required: false
      schema: { type: string }
      description: 'Config snapshot version at request entry (ADR-0067 §5 + ADR-0068).'
    XInitiator:
      name: X-Initiator
      in: header
      required: true
      schema: { type: string }
      description: 'SoD initiator (BR-M17-01). Must differ from X-Approver / X-Executor.'
    XApprover:
      name: X-Approver
      in: header
      required: true
      schema: { type: string }
      description: 'SoD approver. 403 SOD_VIOLATION if equal to initiator.'
    XExecutor:
      name: X-Executor
      in: header
      required: false
      schema: { type: string }
      description: 'SoD executor (e.g. payment provider system).'
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    StateConflict:
      description: '409 — entity state does not allow this transition'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SchemaInvalid:
      description: '422 — schema validation failed'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: '403 — insufficient authority / SoD violation / scope violation'
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth2 client_credentials grant. Mint via `/oauth/token`. TTL=1h.
        JWT carries: `sub` (client_id), `tenant_id`, `roles[]`, `brand_scope[]`,
        `project_scope[]`, `phase_scope[]` (e.g. `["v1","phase1"]`).
    keeperRole:
      type: apiKey
      in: header
      name: X-Keeper-Role
      description: 'Platform keeper role (ADR-VCH-001); required for voucher void / export operations'
    dgsExecutor:
      type: apiKey
      in: header
      name: X-DGS-Executor
      description: 'DGS executor role (ADR-0061); required for evidence purge'
    legalRole:
      type: apiKey
      in: header
      name: X-Legal-Role
      description: 'Legal / DPO role (ADR-0061); required for legal-hold flip'
    dpoOrDataSubject:
      type: apiKey
      in: header
      name: X-DPO-Or-Data-Subject
      description: 'DPO or data-subject role (ADR-0061 GDPR); required for forget request'
  schemas:
    # --- Sentiment Alerts (CR-0003 P2-W2 / FR-0018 / ADR-0048) ---
    SentimentAlertStatus:
      type: string
      enum: [pending, acknowledged, resolved]
    SentimentAlert:
      type: object
      required: [id, conversation_id, consumer_message, sentiment_label, confidence, detected_keywords, status, notified_admin_ids, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        consumer_message: { type: string }
        sentiment_label:
          type: string
          enum: [very_negative, negative, neutral, positive]
        confidence: { type: number, format: float }
        detected_keywords:
          type: array
          items: { type: string }
        problem_card_id: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/SentimentAlertStatus' }
        notified_admin_ids:
          type: array
          items: { type: string }
        admin_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    SentimentAlertPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SentimentAlert' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    SentimentAlertUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/SentimentAlertStatus' }
        admin_note:
          type: string
          maxLength: 1000
          nullable: true

    # RFC 7807 problem+json Error — canonical shape (merged from openapi-smart-lock-saas.yaml)
    # All $ref: '#/components/schemas/Error' across both specs point here.
    Error:
      type: object
      required: [type, title, status, code, trace_id]
      description: RFC 7807 problem+json + trace_id extension
      properties:
        type: { type: string, format: uri, description: 'URI to error doc' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        code:
          type: string
          enum:
            # auth / multi-tenant (openapi.yaml legacy codes)
            - CROSS_TENANT_WRITE
            - CROSS_TENANT_READ
            - CONTRACT_VERSION_CONFLICT
            - SCOPE_OVERLAP
            - ADDRESS_REQUIRED_FOR_CLOSE
            - PC_UNIQUE_VIOLATION
            - AI_FORBIDDEN_ACTION
            - DGS_LEGAL_HOLD_ACTIVE
            - VOUCHER_VOIDED
            - VOUCHER_ALREADY_VOIDED
            - LEGAL_HOLD_BLOCKS_FORGET
            - SOP_DUAL_REVIEW_NOT_DONE
            # v2.3.0 Quote / Pricing cascade (ADR-0062 ~ 0066)
            - AI_FORBIDDEN_FINAL_QUOTE          # 403 (ADR-0063)
            - AI_FORBIDDEN_WARRANTY_PROJECT     # 403 (ADR-0063)
            - AI_FORBIDDEN_QUOTE_CREATE         # 403 (ADR-0063)
            - QUOTE_NOT_CUSTOMER_SENT           # 425 (ADR-0062)
            - QUOTE_REQUIRED_NON_EMERGENCY      # 425 (ADR-0066)
            - QUOTE_STATE_INVALID               # 409 (ADR-0062)
            - QUOTE_VERSION_STALE               # 409 (ADR-0065)
            - QUOTE_EXPIRED                     # 410 (ADR-0064)
            - LIFF_TOKEN_EXPIRED                # 401 (ADR-0064)
            - AUDIT_WINDOW_EXPIRED              # 410 (ADR-0066)
            - INSUFFICIENT_AUTHORITY            # 403 (ADR-0063)
            - PRICING_ENGINE_DOWN_NO_OVERRIDE   # 422 (ADR-0062)
            - URGENT_WINDOW_EXPIRED             # 409 (ADR-0066)
            # openapi-smart-lock-saas.yaml codes (Phase I MVP)
            - SCOPE_VIOLATION
            - SOD_VIOLATION
            - AI_FORBIDDEN_CONVERT_TO_WO
            - CONFIG_NOT_FOUND
            - CONFIG_SCHEMA_INVALID
            - CONFIG_VERSION_MISMATCH
            - REASON_CODE_UNKNOWN
            - EVIDENCE_MISSING
            - REFUND_CLASS_REQUIRED
            - TIER_AMOUNT_INVALID
            - WO_STATE_INVALID
            - QUOTE_NOT_CUSTOMER_CONFIRMED
            - SLA_WINDOW_EXPIRED
            - SERIAL_REQUIRED
            - WARRANTY_EXPIRED
            - DEVICE_NOT_FOUND
            - KB_SCOPE_VIOLATION
            - SERIAL_NOT_FOUND
            - IMAGE_QUALITY_REJECT
            - VISION_API_FORBIDDEN
            - EXTERNAL_DEP_DOWN
            - NOT_IMPLEMENTED_V1
            # M12 Reconciliation v2 dual-sign (FR-0013 / CR-0004 §8)
            - NOT_FOUND
            - STATE_CONFLICT            # 409 review: status ≠ pending
            - DUAL_SIGN_REQUIRED        # 409 co-sign: status ≠ in_review
            # M10 Inventory v2 (FR-0007 / CR-0004 §8 / ADR-0052 / ADR-0053)
            - INSUFFICIENT_INVENTORY    # 409 consume: quantity_on_hand < requested
            # SERIAL_REQUIRED already listed above (openapi-smart-lock-saas.yaml codes)
            - ITEM_INACTIVE             # 409 consume/return/restock: item is_active=false
            - DUPLICATE_PART_NUMBER     # 409 create: same tenant part_number already exists
            # M09 Data Corrections v2 (Track B S5 / CR-0004 §8 / ADR-0029)
            - CONFLICT                  # 409 approve/reject/resolve: status not in allowed_from
            - INVALID                   # 400 invalid query param (cursor/status)
        trace_id:
          type: string
          description: 'W3C trace_id; required on /quote/* and /pricing/* error responses (v2.3 telemetry)'
        request_id: { type: string }

    # ErrorV1 — preserved for historical reference (openapi.yaml v2.3.0 enum-style shape)
    # No $ref points here post-merge; kept for audit trail only.
    ErrorV1:
      type: object
      required: [code, message]
      description: 'Legacy enum-style error (openapi.yaml v2.3.0). Superseded by Error (RFC7807). Do not use in new endpoints.'
      properties:
        code:
          type: string
          enum:
            - CROSS_TENANT_WRITE
            - CROSS_TENANT_READ
            - CONTRACT_VERSION_CONFLICT
            - SCOPE_OVERLAP
            - ADDRESS_REQUIRED_FOR_CLOSE
            - PC_UNIQUE_VIOLATION
            - AI_FORBIDDEN_ACTION
            - DGS_LEGAL_HOLD_ACTIVE
            - VOUCHER_VOIDED
            - VOUCHER_ALREADY_VOIDED
            - LEGAL_HOLD_BLOCKS_FORGET
            - SOP_DUAL_REVIEW_NOT_DONE
            - AI_FORBIDDEN_FINAL_QUOTE
            - AI_FORBIDDEN_WARRANTY_PROJECT
            - AI_FORBIDDEN_QUOTE_CREATE
            - QUOTE_NOT_CUSTOMER_SENT
            - QUOTE_REQUIRED_NON_EMERGENCY
            - QUOTE_STATE_INVALID
            - QUOTE_VERSION_STALE
            - QUOTE_EXPIRED
            - LIFF_TOKEN_EXPIRED
            - AUDIT_WINDOW_EXPIRED
            - INSUFFICIENT_AUTHORITY
            - PRICING_ENGINE_DOWN_NO_OVERRIDE
            - URGENT_WINDOW_EXPIRED
        message: { type: string }
        request_id: { type: string }
        trace_id:
          type: string
          description: 'W3C trace_id; required on /quote/* and /pricing/* error responses (v2.3 telemetry)'

    LineWebhookEvents:
      type: object
      properties:
        events:
          type: array
          items: { type: object }

    ProblemCard:
      type: object
      required: [id, tenant_id, conversation_id, brand, model, symptom, urgency, completeness_score, state]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        conversation_id: { type: string }
        device_id: { type: string }
        brand: { type: string }
        model: { type: string }
        symptom: { type: array, items: { type: string } }
        urgency:
          type: string
          enum: [normal, locked_out, trapped_inside, safety_risk, angry_customer_high_risk]
          description: ADR-0034 4 類 urgent + normal
        completeness_score: { type: number, minimum: 0, maximum: 1 }
        media_refs: { type: array, items: { type: string } }
        state: { type: string, enum: [incomplete, draft, confirmed, resolved] }

    ProblemCardCreate:
      allOf:
        - $ref: '#/components/schemas/ProblemCard'
        - required: [tenant_id, conversation_id]

    ProblemCardList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProblemCard' } }
        next_cursor: { type: string, nullable: true }

    WorkOrderCreate:
      type: object
      required: [pc_id, tenant_id, created_by_role]
      description: |
        v2.3.0 (ADR-0066): `quote_id` is conditionally required at the server layer:
          - required when pc.emergency_class IS NULL (non-emergency must quote-then-WO)
          - NULL allowed when pc.emergency_class IS NOT NULL (急件 carve-out;
            retrospective quote/audit must follow within 4h via
            POST /quotes/{id}/retrospective-audit)
        Server enforces this conditional rule (not declarable in pure JSON Schema
        without `if/then`); see /work-orders POST description.
      properties:
        pc_id: { type: string }
        tenant_id: { type: string }
        quote_id:
          type: string
          nullable: true
          description: |
            Required unless pc.emergency_class IS NOT NULL (ADR-0066 carve-out).
            When present, server enforces quote.state == customer_confirmed.
        address: { type: string, nullable: true, description: 'address optional at creation (ADR-0032); required at close' }
        created_by_role: { type: string, enum: [customer_service], description: 'AI cannot create directly (ADR-0031)' }

    ScopeChange:
      type: object
      required: [customer_signature_ref, evidence_photo_ref, amount_delta, tier]
      properties:
        customer_signature_ref: { type: string }
        evidence_photo_ref: { type: string }
        audit_note: { type: string }
        amount_delta: { type: number }
        tier:
          type: string
          enum: [self_confirm_le_500, cs_line_501_2000, supervisor_plus_3way_gt_2000]
          description: ADR-0049 amount tiers

    ContractTemplate:
      type: object
      required: [id, tenant_id, partner_id, version, scope, liability_matrix, visibility_rule, state]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        partner_id: { type: string }
        version: { type: integer }
        effective_date: { type: string, format: date }
        scope:
          type: object
          properties:
            brand_scope: { type: array, items: { type: string } }
            site_group_scope: { type: array, items: { type: string } }
        liability_matrix:
          type: object
          required: [brand_pct, platform_pct, locksmith_pct, customer_pct]
          properties:
            brand_pct: { type: number }
            platform_pct: { type: number }
            locksmith_pct: { type: number }
            customer_pct: { type: number }
            dispute_resolution_party: { type: string, enum: [brand, platform, locksmith, arbitration] }
            secondary_responsible: { type: string, nullable: true }
        visibility_rule:
          type: object
          required: [allowed_roles, effective_scope_snapshot]
          description: 'Snapshot of effective scope at the time, NOT just a reference (per ADR-0060)'
          properties:
            allowed_roles: { type: array, items: { type: string } }
            effective_scope_snapshot: { type: object }
        sla_definition: { type: object }
        monthly_settlement_rule: { type: object }
        cancellation_fee_tiers: { type: array, items: { type: object } }
        travel_fee_split: { type: object }
        state:
          type: string
          enum: [draft]
          description: 'V1 supports draft only; V2 will introduce submitted/approved/published/retired'

    ContractTemplateList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ContractTemplate' } }
        next_cursor: { type: string, nullable: true }

    CustomerNotice:
      type: object
      properties:
        deadline_days: { type: integer, default: 7 }
        reason: { type: string, example: legal_hold_active }
        expected_unlock_date: { type: string, format: date, nullable: true }

    ChangeRequest:
      type: object
      required: [id, type, apply_by, state, audit_trail]
      properties:
        id: { type: string }
        type: { type: string, enum: [policy, price, rbac, sla, template, contract] }
        apply_by: { type: string }
        approve_chain: { type: array, items: { type: object } }
        state: { type: string, enum: [pending, approved, effective, rejected] }
        effective_date: { type: string, format: date }
        audit_trail: { type: array, items: { type: object } }

    # v2.2 added per ADR-VCH-001/002 + MoM #2
    Voucher:
      type: object
      required: [voucher_no, period, ledger_id, amount, reason_code, reference_type, payment_method, issuer_party, legal_basis, hash_self]
      properties:
        voucher_no: { type: string, pattern: '^\d{6}-\d+$', example: '202606-12345', description: 'yyyymm-seq; unique within partition' }
        period: { type: string, pattern: '^\d{4}-\d{2}$' }
        ledger_id: { type: string }
        tenant_id: { type: string }
        debit_account: { type: string }
        credit_account: { type: string }
        amount: { type: number, format: decimal, minimum: 0 }
        reason_code:
          type: string
          enum: [dispatch_complete, refund_full, refund_partial, brand_settle, tax_adjust, reversal]
        reference_type:
          type: string
          enum: [wo, rma, refund, settlement, invoice]
        reference_id: { type: string }
        payment_method:
          type: string
          enum: [onsite_cash, payment_link, bank_transfer]
          description: 'OQ-008 三路收款'
        issuer_party:
          type: string
          enum: [platform, locksmith, brand]
          description: 'ADR-VCH-001 keeper schema: 平台只 keep，發票由 issuer 自開'
        tax_doc_ref:
          type: object
          properties:
            type: { type: string, enum: [GUI, EINV, RECEIPT], description: '統一發票 / 電子發票 / 收據' }
            doc_id: { type: string }
            issuer_tax_id: { type: string }
        legal_basis:
          type: string
          enum: [TAX_ACT_§38, BIZ_ACCT_§11_1, BOTH]
          description: 'ADR-VCH-002 保存期法源'
        hash_prev: { type: string, description: 'Hash chain: 前一筆 row 的 hash_self' }
        hash_self: { type: string, description: 'sha256(hash_prev + serialize(row)); 不可竄改保證' }
        reverses_voucher_id:
          type: string
          nullable: true
          description: 'Void 用：紅字憑證指向原 voucher_no'
        created_at: { type: string, format: date-time }

    VoucherList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Voucher' } }
        next_cursor: { type: string, nullable: true }

    # v2.3.0 added per ADR-0062 ~ 0066 (Forum-Lite Q01 cascade)
    Quote:
      type: object
      required: [id, tenant_id, pc_id, version, state, amount_breakdown, snapshot_hash, engine_self_check_passed, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        pc_id: { type: string }
        version:
          type: integer
          minimum: 1
          description: 'monotonic per quote chain; re-version via :supersede creates a NEW row with version+1 (ADR-0065)'
        supersedes_quote_id:
          type: string
          nullable: true
          description: 'self-FK to the previous version (ADR-0065)'
        state:
          type: string
          enum:
            - draft
            - internal_approved
            - customer_sent
            - customer_confirmed
            - rejected
            - expired
            - superseded
            - retrospective_audit_only
          description: |
            State machine (ADR-0062):
              draft → (:approve) → internal_approved → (:send-to-customer) → customer_sent
                → (/customer-confirm) → customer_confirmed
              draft|internal_approved|customer_sent → (/reject) → rejected
              customer_sent → (TTL 48h) → expired
              any non-terminal → (:supersede) → superseded (+ new draft row)
              emergency carve-out → (/retrospective-audit) → retrospective_audit_only
        amount_breakdown:
          type: object
          description: |
            Frozen pricing snapshot at quote creation time. Mirrors the
            /pricing/calculate response payload; LIFF reads this rather than
            re-calling pricing.
          properties:
            base_amount: { type: number }
            travel_fee: { type: number }
            material_cost: { type: number }
            emergency_factor: { type: number, nullable: true }
            total: { type: number }
            currency: { type: string, default: 'TWD' }
            breakdown: { type: array, items: { type: object } }
        snapshot_hash:
          type: string
          description: |
            sha256 reference into pricing_rule_snapshot (ADR-0062 + dba-B-3 hybrid).
            Replaces the earlier `pricing_rule_version_snapshot jsonb` field.
        engine_self_check_passed:
          type: boolean
          description: 'pricing engine invariant gate (ARCH-C3); must be true before :send-to-customer'
        manual_amount_override:
          type: number
          nullable: true
        override_reason:
          type: string
          nullable: true
        created_by_role:
          type: string
          enum: [customer_service]
        ttl_expires_at:
          type: string
          format: date-time
          description: '48h TTL from customer_sent (ADR-0064)'
        confirm_token:
          type: string
          nullable: true
          description: 'LIFF confirm token; opaque, server-issued; TTL = quote TTL (ADR-0064)'
        flex_message_template_id:
          type: string
          nullable: true
          description: 'server-generated; bound on :send-to-customer (ADR-0063)'
        audit_trail:
          type: array
          items: { type: object }
          description: 'each entry carries trace_id for telemetry anchor'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PricingRuleSnapshot:
      type: object
      required: [snapshot_hash, rule_version, rule_rows, effective_at, engine_type]
      description: |
        Content-addressable, immutable snapshot of the pricing rules used for a
        single calc. The snapshot is referenced from `quote.snapshot_hash` (FK).
        Multiple quotes may share the same snapshot_hash → dedup storage.
      properties:
        snapshot_hash:
          type: string
          description: 'sha256(canonical_json(rule_rows + rule_version + contract_template_id))'
        rule_version: { type: string }
        contract_template_id:
          type: string
          nullable: true
        rule_rows:
          type: array
          description: 'frozen rule rows (lookup table; replaces enum per ADR-0066 Q4)'
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: object }
        effective_at: { type: string, format: date-time }
        engine_type:
          type: string
          description: 'reserved for V2 multi-engine (arch-C1)'
          enum: [v1_default]
        currency:
          type: string
          default: 'TWD'
          description: 'reserved per arch-C1'

    QuoteCustomerConfirm:
      type: object
      required: [confirm_token, accepted_version, accepted_at, channel, consent_method]
      description: |
        Input schema for POST /quotes/{id}/customer-confirm (ADR-0064).
        Idempotency-Key header is REQUIRED (declared on the operation).
      properties:
        confirm_token:
          type: string
          description: 'opaque server-issued token; TTL = quote 48h'
        accepted_version:
          type: integer
          minimum: 1
          description: 'must match current quote.version; mismatch → 409 QUOTE_VERSION_STALE'
        accepted_at:
          type: string
          format: date-time
        channel:
          type: string
          enum: [liff, flex_one_tap]
        consent_method:
          type: string
          enum: [liff_full, flex_simple_fallback]
          description: 'liff_full = full LIFF page consent; flex_simple_fallback = one-tap flex button fallback'
    # Auth schema (Q6 — platform-level auth endpoints)
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'JWT; TTL=1h' }
        token_type: { type: string, enum: [bearer] }
        expires_in: { type: integer, description: 'seconds until access_token expiry' }
        refresh_token: { type: string, description: 'opaque; revocable via /auth/logout' }

