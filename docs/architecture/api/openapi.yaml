      required: [partner_id, brand_id, work_order_id]
      properties:
        partner_id: { type: string }
        brand_id: { type: string }
        work_order_id: { type: string }
        evidence_ids: { type: array, items: { type: string } }
    RMASubmitReceipt:
      type: object
      properties:
        rma_id: { type: string }
        partner_acknowledged_at: { type: string, format: date-time, nullable: true }

    ChangeRequestRef:
      type: object
      properties:
        change_request_id: { type: string }
        effective_date: { type: string, format: date, nullable: true }

    # M01 Dashboard schemas（CR-0003 P2-W1, FR-0021）
    DashboardPeriod:
      type: string
      enum: [today, 7d, 30d, 90d]
      description: Dashboard 統計時段

    DashboardConversations:
      type: object
      required: [total, active, resolved, escalated]
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }
        escalated: { type: integer, minimum: 0 }

    DashboardResolution:
      type: object
      properties:
        ai_resolution_rate:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: AI 解決率（L1+L2 / 有解層記錄總數）
        avg_resolution_time_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: 平均解決時間（秒）
        by_layer:
          type: object
          additionalProperties: { type: integer }
          nullable: true
          description: '各解決層數量：case_library / rag / human'

    DashboardHotTopic:
      type: object
      properties:
        topic: { type: string, nullable: true }
        count: { type: integer, minimum: 0, nullable: true }

    DashboardTokenUsage:
      type: object
      properties:
        total_tokens: { type: integer, nullable: true }
        prompt_tokens: { type: integer, nullable: true }
        completion_tokens: { type: integer, nullable: true }
        estimated_cost_usd:
          type: number
          format: float
          nullable: true
          description: 估算成本（USD，Gemini 2.5 Pro blended price）

    DashboardTopBrand:
      type: object
      properties:
        brand: { type: string, nullable: true }
        count: { type: integer, minimum: 0, nullable: true }

    DashboardWorkOrders:
      type: object
      description: 派工今日 KPI
      properties:
        today_count:
          type: integer
          minimum: 0
          nullable: true
          description: 今日新建工單數
        completion_rate:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: 今日完工率（today_count == 0 時為 null）
        overdue_count:
          type: integer
          minimum: 0
          nullable: true
          description: 排程時間已過且未結案工單數

    DashboardTechnicians:
      type: object
      description: 技師概況 KPI
      properties:
        total_count:
          type: integer
          minimum: 0
          nullable: true
          description: 此租戶啟用中（status=active）的技師總數
        online_count:
          type: integer
          minimum: 0
          nullable: true
          description: 目前可派遣的技師數
        dispatchable_count:
          type: integer
          minimum: 0
          nullable: true
          description: 已上線且可立即指派（保留欄位，目前等同 online_count）

    DashboardStats:
      type: object
      required: [period, conversations, resolution]
      description: Dashboard KPI 統計（tenant-scoped，FR-0021）
      properties:
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        conversations:
          $ref: '#/components/schemas/DashboardConversations'
        resolution:
          $ref: '#/components/schemas/DashboardResolution'
        hot_topics:
          type: array
          items:
            $ref: '#/components/schemas/DashboardHotTopic'
          nullable: true
        token_usage:
          $ref: '#/components/schemas/DashboardTokenUsage'
        top_brands:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTopBrand'
          nullable: true
        work_orders:
          $ref: '#/components/schemas/DashboardWorkOrders'
        technicians:
          $ref: '#/components/schemas/DashboardTechnicians'

    # --- Notification v2 schemas (P2-W2 / CR-0003 / ADR-0012) ---
    NotificationSeverity:
      type: string
      enum: [info, warning, critical]

    NotificationType:
      type: string
      enum: [work_order, refund, dispute, rbac, inventory, sla, system, mention]

    NotificationRelatedEntity:
      type: object
      nullable: true
      properties:
        type: { type: string, nullable: true }
        id: { type: string, nullable: true }
        url: { type: string, nullable: true }

    NotificationAction:
      type: object
      properties:
        label: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }

    Notification:
      type: object
      required: [id, type, severity, title, body, source, created_at]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title: { type: string }
        body: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        related_entity:
          $ref: '#/components/schemas/NotificationRelatedEntity'
        actions:
          type: array
          items: { $ref: '#/components/schemas/NotificationAction' }
          nullable: true
        raw_event_id: { type: string, nullable: true }

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        unread_count: { type: integer, nullable: true }

    NotificationUpdate:
      type: object
      properties:
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }

    NotificationBulkRequest:
      type: object
      required: [ids, action]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string }
        action:
          type: string
          enum: [mark_read, mark_unread, archive, delete]

    NotificationBulkResult:
      type: object
      properties:
        affected: { type: integer, minimum: 0 }

    MarkAllReadFilter:
      type: object
      properties:
        type:
          type: array
          items: { $ref: '#/components/schemas/NotificationType' }
          nullable: true

    MarkAllReadRequest:
      type: object
      nullable: true
      properties:
        filter:
          $ref: '#/components/schemas/MarkAllReadFilter'

    # --- Conversation v2 schemas (P2-W2 / CR-0003 / FR-0018) ---
    ConversationStatus:
      type: string
      enum: [active, waiting_human, closed]
      description: '對話狀態：active=進行中 / waiting_human=等待人工 / closed=已結束'

    Conversation:
      type: object
      required: [id, line_user_id, display_name, status, message_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        document_number:
          type: string
          maxLength: 30
          nullable: true
          description: 'ServiceTicket 編號 ST-YYYYMMDD-NNNN（ERP 引用號）'
        line_user_id:
          type: string
          description: 'LINE Platform User ID'
        display_name:
          type: string
          description: 'LINE 顯示名稱'
        status:
          $ref: '#/components/schemas/ConversationStatus'
        resolution_layer:
          type: string
          enum: [case_library, rag, human]
          nullable: true
          description: '解決層級：case_library=L1 / rag=L2 / human=L3'
        message_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Conversation'
          nullable: true
        message:
          type: string
          nullable: true

    ConversationPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
          nullable: true
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        total_count:
          type: integer
          nullable: true

    ConversationChannel:
      type: string
      enum: [line, web, voice]

    ConversationCreateRequest:
      type: object
      required: [line_user_id, session_id]
      properties:
        line_user_id:
          type: string
          maxLength: 255
          description: 'LINE Platform User ID (U + 32 hex chars)'
        session_id:
          type: string
          maxLength: 255
          description: '業務 unique key（對 line_user_id + 30 min idle window）'
        display_name:
          type: string
          maxLength: 255
          nullable: true
          description: 'LINE 顯示名稱（從 LINE Get Profile API 取得）'
        channel:
          $ref: '#/components/schemas/ConversationChannel'

    MessageRole:
      type: string
      enum: [user, assistant, system]

    MessageType:
      type: string
      enum: [text, image, audio, video, sticker]

    Message:
      type: object
      required: [id, conversation_id, role, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        type:
          $ref: '#/components/schemas/MessageType'
        content:
          type: string
        media_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          nullable: true
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        total_count:
          type: integer
          nullable: true

    SendChatMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: '訊息內容'
        media_uri:
          type: string
          format: uri
          nullable: true
          description: '媒體資源 URI（選填）'

    # --- P2-W4 WorkOrder Ops v2 schemas (CR-0003 / M07 WorkOrder Ops) ---

    WorkOrderStatus:
      type: string
      description: 工單狀態機
      enum:
        - inquiring
        - qualified
        - quoted
        - negotiating
        - accepted
        - scheduled
        - dispatching
        - assigned
        - en_route
        - arrived
        - in_progress
        - completed
        - billed
        - paid
        - closed
        - cancelled

    WorkOrder:
      type: object
      required: [id, problem_card_id, status, district, address, brand, model, urgency, created_at, updated_at]
      description: 工單（tenant-scoped）
      properties:
        id: { type: string, format: uuid }
        document_number:
          type: string
          maxLength: 30
          nullable: true
          description: >-
            公單號 {2碼地區}-{6碼流水}（如 TP-000001），工單建立時依 customer_address
            的縣市發 per-region 流水（CR-0020 / ADR-0110）。地址解析不到地區 → ZZ。
          description: 'WorkOrder 編號 WO-YYYYMMDD-NNNN'
        problem_card_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        district: { type: string }
        address: { type: string }
        brand: { type: string }
        model: { type: string }
        urgency:
          type: string
          enum: [normal, locked_out, trapped_inside, safety_risk, angry_customer_high_risk]
        estimated_reward:
          type: string
          nullable: true
          description: 'Decimal(10,2) 序列化為字串以避免 JS 浮點誤差'
        scheduled_time: { type: string, format: date-time, nullable: true }
        actual_arrival: { type: string, format: date-time, nullable: true }
        completion_time: { type: string, format: date-time, nullable: true }
        version:
          type: integer
          nullable: true
          description: '樂觀鎖版本號'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkOrderEnvelope:
      type: object
      description: 單工單信封（data + nullable message）
      properties:
        data:
          $ref: '#/components/schemas/WorkOrder'
          nullable: true
        message: { type: string, nullable: true }

    WorkOrderPage:
      type: object
      required: [has_more]
      description: 工單分頁（cursor 分頁）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkOrder' }
          nullable: true
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    DispatchQueueSnapshot:
      type: object
      description: 派工佇列快照（即時聚合）
      properties:
        pending: { type: integer, minimum: 0 }
        assigning: { type: integer, minimum: 0 }
        assigned: { type: integer, minimum: 0 }
        sla_at_risk:
          type: integer
          minimum: 0
          nullable: true
          description: '2 小時內可能逾期的工單數'

    RescheduleRequest:
      type: object
      required: [new_scheduled_at, reason]
      description: 改約請求（requestRescheduleV2 body）
      properties:
        new_scheduled_at:
          type: string
          format: date-time
          description: ISO 8601 future datetime
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ApproveRescheduleRequest:
      type: object
      required: [decision]
      description: 核准 / 退回改約申請（approveRescheduleV2 body）
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment:
          type: string
          maxLength: 500
          nullable: true

    NotifyDelayRequest:
      type: object
      required: [delay_minutes, reason]
      description: 現場延遲通知（notifyDelayV2 body）
      properties:
        delay_minutes:
          type: integer
          minimum: 5
          maximum: 300
        reason:
          type: string
          minLength: 1
          maxLength: 500

    MaterialItem:
      type: object
      required: [brand, model, quantity]
      description: 缺料品項
      properties:
        brand:
          type: string
          minLength: 1
          maxLength: 40
        model:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: integer
          minimum: 1
          maximum: 999

    MaterialRequestBody:
      type: object
      required: [items]
      description: 缺料回報（recordMaterialRequestV2 body，T6）
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/MaterialItem' }
        urgency:
          type: string
          enum: [now, today, tomorrow]
          default: today
        note:
          type: string
          maxLength: 500
          nullable: true

    WorkOrderEventType:
      type: string
      description: 工單結構化事件類型
      enum:
        - scope_change
        - material_request
        - delay
        - door_check
        - signature_submitted
        - reschedule_proposed
        - other

    WorkOrderEventItem:
      type: object
      required: [id, event_type, payload, created_at]
      description: 單一工單結構化事件
      properties:
        id: { type: string, format: uuid }
        event_type: { $ref: '#/components/schemas/WorkOrderEventType' }
        payload:
          type: object
          description: '事件型別專屬 payload'
          additionalProperties: true
        actor_user_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    WorkOrderEventList:
      type: object
      description: 工單事件列表
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkOrderEventItem' }
          nullable: true

    # --- P2-W5 Invoice v2 schemas (CR-0003 / M11 Invoice) ---

    InvoiceStatus:
      type: string
      description: 發票狀態
      enum:
        - pending
        - issued
        - allowance_pending
        - voided
        - reopened

    Invoice:
      type: object
      required: [id, work_order_id, invoice_number, amount, status, issued_at, created_at]
      description: 發票（tenant-scoped，台灣電子發票）
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        invoice_number:
          type: string
          pattern: '^[A-Z]{2}\d{8}$'
          description: '台灣電子發票號碼（如 AB12345678）'
        tax_id:
          type: string
          pattern: '^\d{8}$'
          nullable: true
          description: '買方統編（選填）'
        amount:
          type: string
          description: 'Decimal(10,2) 序列化為字串以避免 JS 浮點誤差'
        tax_type:
          type: string
          enum: [taxable, zero_rated, exempt]
          default: taxable
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issued_at: { type: string, format: date-time }
        voided_at: { type: string, format: date-time, nullable: true }
        void_reason: { type: string, nullable: true }
        allowance_amount:
          type: string
          nullable: true
          description: '折讓金額（退款時部分折讓）'
        category:
          type: string
          enum: [service_fee, travel_fee, parts, other]
          nullable: true
          description: '稅務分類 — 車馬費獨立開立，不與工單合併'
        reopened_from:
          type: string
          format: uuid
          nullable: true
          description: '重開發票的原發票 ID'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, nullable: true }

    InvoiceEnvelope:
      type: object
      description: 單發票信封（data + nullable message）
      properties:
        data:
          $ref: '#/components/schemas/Invoice'
          nullable: true
        message: { type: string, nullable: true }

    InvoicePage:
      type: object
      required: [has_more]
      description: 發票分頁（cursor 分頁）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
          nullable: true
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    # --- P2-W6 Media v2 schemas (CR-0003 / Media tenant-scoped) ---

    MediaPurpose:
      type: string
      description: 媒體用途分類
      enum:
        - door_check_before
        - door_check_after
        - completion_before
        - completion_after
        - dispute_evidence_customer
        - dispute_evidence_technician
        - other

    MediaFile:
      type: object
      required: [id, url, filename, content_type, size_bytes, purpose, created_at]
      description: 媒體檔案記錄（tenant-scoped）
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: '媒體存取路徑' }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        work_order_id: { type: string, format: uuid, nullable: true }
        dispute_id: { type: string, format: uuid, nullable: true }
        sha256: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MediaUploadResponse:
      type: object
      required: [media_id, url]
      description: 上傳媒體檔案成功回傳（media_id + url）
      properties:
        media_id: { type: string, format: uuid }
        url: { type: string, description: '可存取的媒體 url（相對或絕對路徑）' }
        filename: { type: string, nullable: true }
        content_type: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }

    MediaFilePage:
      type: object
      required: [items]
      description: 媒體檔案清單（無分頁，全量回傳）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MediaFile' }

    # --- P2-W6 Dispatch Logs v2 schemas (CR-0003 / M06 Dispatch) ---

    DispatchAction:
      type: string
      description: 派工動作類型
      enum:
        - assign
        - accept
        - reject
        - timeout
        - reassign
        - cancel

    DispatchLog:
      type: object
      required: [id, work_order_id, action, created_at]
      description: 派工歷程記錄（tenant-scoped，admin-only）
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/DispatchAction' }
        technician_id: { type: string, format: uuid, nullable: true }
        technician_name:
          type: string
          nullable: true
          description: '技師顯示名稱（technicians 表 JOIN）'
        match_score:
          type: number
          format: float
          nullable: true
          description: 'AI 媒合分數（0-100）'
        match_factors:
          type: object
          nullable: true
          description: '媒合因子（distance/skill/availability 加權結構；jsonb）'
          additionalProperties: true
        rejection_reason: { type: string, nullable: true }
        timeout_seconds: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    DispatchLogEnvelope:
      type: object
      description: 派工歷程詳情信封（data 包裝）
      properties:
        data:
          $ref: '#/components/schemas/DispatchLog'
          nullable: true

    DispatchLogPage:
      type: object
      required: [has_more]
      description: 派工歷程分頁（cursor 分頁）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DispatchLog' }
          nullable: true
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    # --- M12 Settlement — Reconciliation v2 dual-sign (FR-0013 / CR-0004 §8) ---

    Reconciliation:
      type: object
      description: |
        saas.reconciliation 對帳單（v2 tenant-scoped dual-sign）。
        欄位對應 reconciliation_v2_service._row_to_dict 輸出形狀。
      required:
        - id
        - tenant_id
        - technician_id
        - status
        - total_orders
        - total_revenue
        - platform_fee
        - technician_payout
        - created_at
      properties:
        id: { type: string, description: 對帳單 UUID }
        tenant_id: { type: string, description: 租戶 UUID }
        technician_id: { type: string, description: 技師 UUID }
        period_start: { type: string, format: date, nullable: true, description: 對帳期間起始日（ISO 8601 date） }
        period_end: { type: string, format: date, nullable: true, description: 對帳期間截止日（ISO 8601 date） }
        total_orders: { type: integer, description: 期間總工單數 }
        total_revenue: { type: string, description: '總收入（numeric string，2 位小數，如 "1234.50"）' }
        platform_fee: { type: string, description: '平台服務費（numeric string，2 位小數）' }
        technician_payout: { type: string, description: '技師應付款（numeric string，2 位小數）' }
        status:
          type: string
          enum: [pending, in_review, approved, disputed]
          description: 對帳單狀態
        reviewed_by: { type: string, nullable: true, description: step-1 CSM reviewer UUID }
        reviewed_at: { type: string, format: date-time, nullable: true, description: step-1 完成時間 }
        approved_by: { type: string, nullable: true, description: step-2 ops_manager co-signer UUID }
        approved_at: { type: string, format: date-time, nullable: true, description: step-2 完成時間 }
        note: { type: string, nullable: true, description: 審核備註（最多 500 字） }
        created_at: { type: string, format: date-time, description: 建立時間 }

    ReconciliationEnvelope:
      type: object
      description: 單筆對帳單信封（data 包裝，對應 getReconciliationV2 / reviewReconciliationV2 200 response）
      properties:
        data:
          $ref: '#/components/schemas/Reconciliation'
          nullable: true

    ReconciliationPage:
      type: object
      required: [has_more]
      description: 對帳單分頁（cursor 分頁，對應 listReconciliationsV2 200 response）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reconciliation' }
          nullable: true
        next_cursor: { type: string, nullable: true, description: 下一頁游標（opaque base64） }
        has_more: { type: boolean }

    SettlementV2:
      type: object
      description: |
        saas.settlement 付款記錄（v2 dual-sign 完成時建立）。
        欄位對應 reconciliation_v2_service._settlement_row_to_dict 輸出形狀。
        命名加 V2 後綴以區隔 legacy public.settlements。
      required:
        - id
        - tenant_id
        - reconciliation_id
        - technician_id
        - amount
        - currency
        - status
        - created_at
      properties:
        id: { type: string, description: settlement UUID }
        tenant_id: { type: string, description: 租戶 UUID }
        reconciliation_id: { type: string, description: 對帳單 UUID（FK → Reconciliation.id） }
        technician_id: { type: string, description: 技師 UUID }
        amount: { type: string, description: '付款金額（numeric string，2 位小數）' }
        currency: { type: string, default: TWD, description: 幣別（預設 TWD） }
        status: { type: string, enum: [pending, paid, failed], description: 付款狀態 }
        payment_method: { type: string, nullable: true, description: 付款方式 }
        paid_at: { type: string, format: date-time, nullable: true, description: 實際付款時間 }
        created_at: { type: string, format: date-time, description: 建立時間 }

    ReconciliationCoSignResult:
      type: object
      description: |
        coSignReconciliationV2 200 回應（dual-sign 完成）。
        包含更新後的對帳單 + 新建的 settlement。
      required:
        - data
      properties:
        data:
          type: object
          required: [reconciliation, settlement]
          properties:
            reconciliation:
              $ref: '#/components/schemas/Reconciliation'
            settlement:
              $ref: '#/components/schemas/SettlementV2'

    # --- M14 Dispute — Dispute v2 dual-sign 狀態機 (FR-0013 / CR-0004 §8) ---

    Dispute:
      type: object
      description: |
        saas.dispute 爭議單（v2 tenant-scoped dual-sign）。
        欄位對應 dispute_v2_service._row_to_dict 輸出形狀。
      required:
        - id
        - tenant_id
        - filed_by
        - dispute_type
        - status
        - description
        - filed_at
        - sla_deadline
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid, description: 爭議 UUID }
        tenant_id: { type: string, format: uuid, description: 租戶 UUID }
        work_order_id: { type: string, format: uuid, nullable: true, description: 關聯工單 UUID }
        invoice_id: { type: string, format: uuid, nullable: true, description: 關聯發票 UUID }
        filed_by: { type: string, format: uuid, description: 提交人 UUID }
        dispute_type:
          type: string
          enum: [pricing, quality, warranty, cancellation_fee, settlement]
          description: 爭議類型
        status:
          type: string
          enum: [filed, in_review, mediation, resolved, escalated, closed_withdrawn]
          description: 爭議狀態
        description: { type: string, description: 爭議描述 }
        evidence:
          nullable: true
          description: 佐證資料（jsonb）
        proposed_resolution: { type: string, nullable: true, description: CSM step-1 提案解決方案 }
        resolution: { type: string, nullable: true, description: 最終解決方案（co-sign 後填入） }
        resolution_amount: { type: string, nullable: true, description: '最終金額（numeric string，2 位小數；負值表示退款 DEFERRED Phase II）' }
        reviewed_by: { type: string, format: uuid, nullable: true, description: step-1 CSM reviewer UUID }
        reviewed_at: { type: string, format: date-time, nullable: true, description: step-1 完成時間 }
        cosigned_by: { type: string, format: uuid, nullable: true, description: step-2 ops_manager co-signer UUID }
        cosigned_at: { type: string, format: date-time, nullable: true, description: step-2 完成時間 }
        escalated_to: { type: string, nullable: true, description: 升級對象（ops_director） }
        escalated_at: { type: string, format: date-time, nullable: true, description: 升級時間 }
        parent_dispute_id: { type: string, format: uuid, nullable: true, description: 重開時引用的原爭議 UUID }
        filed_at: { type: string, format: date-time, description: 爭議開立時間 }
        sla_deadline: { type: string, format: date-time, description: SLA 截止時間（filed_at + 60d） }
        resolved_at: { type: string, format: date-time, nullable: true, description: 爭議解決時間 }
        created_at: { type: string, format: date-time, description: 建立時間 }
        updated_at: { type: string, format: date-time, description: 更新時間 }

    DisputeEnvelope:
      type: object
      description: 單筆爭議信封（data 包裝，對應 getDisputeV2 / openDisputeV2 / action endpoints 回應）
      properties:
        data:
          $ref: '#/components/schemas/Dispute'
          nullable: true

    DisputePage:
      type: object
      required: [has_more]
      description: 爭議分頁（cursor 分頁，對應 listDisputesV2 200 response）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
          nullable: true
        next_cursor: { type: string, nullable: true, description: 下一頁游標（opaque base64） }
        has_more: { type: boolean }

    # --- M10 Inventory v2 schemas (FR-0007 / CR-0004 §8 / ADR-0052 / ADR-0053) ---

    InventoryItem:
      type: object
      required:
        - id
        - tenant_id
        - part_number
        - name
        - quantity_on_hand
        - reorder_point
        - owner
        - serial_required
        - is_active
        - stock_status
        - created_at
        - updated_at
      description: 庫存品項（saas.inventory_item，含衍生 stock_status）
      properties:
        id: { type: string, format: uuid, description: 品項 UUID }
        tenant_id: { type: string, format: uuid, description: 租戶 UUID }
        part_number: { type: string, description: 零件編號（tenant 內唯一） }
        name: { type: string, description: 品項名稱 }
        category: { type: string, nullable: true, description: 分類 }
        brand_compatibility:
          type: array
          items: { type: string }
          nullable: true
          description: 相容品牌列表（text[]）
        unit_cost: { type: string, nullable: true, description: '單價（numeric string，2 位小數）' }
        quantity_on_hand: { type: integer, minimum: 0, description: 現有庫存量 }
        reorder_point: { type: integer, minimum: 0, description: 安全庫存量（低於此值觸發補貨通知） }
        supplier: { type: string, nullable: true, description: 供應商 }
        owner:
          type: string
          enum: [platform, brand, locksmith]
          description: 所有者（ADR-0052）
        serial_required:
          type: boolean
          description: 是否強制序號（ADR-0053；主鎖 + 高價零件 True）
        is_active: { type: boolean, description: 品項是否啟用 }
        stock_status:
          type: string
          enum: [out_of_stock, low_stock, in_stock]
          description: '衍生庫存狀態：out_of_stock (qty=0) / low_stock (0<qty<=reorder_point) / in_stock (qty>reorder_point)'
        created_at: { type: string, format: date-time, description: 建立時間 }
        updated_at: { type: string, format: date-time, description: 更新時間 }

    InventoryItemEnvelope:
      type: object
      description: 單筆品項信封（data 包裝，對應 createInventoryItemV2 / getInventoryItemV2 response）
      properties:
        data:
          $ref: '#/components/schemas/InventoryItem'
          nullable: true

    InventoryItemPage:
      type: object
      required: [has_more]
      description: 品項分頁（cursor 分頁，對應 listInventoryItemsV2 200 response）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }
          nullable: true
        next_cursor: { type: string, nullable: true, description: 下一頁游標（opaque base64） }
        has_more: { type: boolean }

    InventoryTransaction:
      type: object
      required: [id, tenant_id, item_id, transaction_type, quantity, created_at]
      description: 庫存交易記錄（saas.inventory_transaction）
      properties:
        id: { type: string, format: uuid, description: 交易 UUID }
        tenant_id: { type: string, format: uuid, description: 租戶 UUID }
        item_id: { type: string, format: uuid, description: 品項 UUID }
        transaction_type:
          type: string
          enum: [purchase, consume, return, adjust]
          description: 交易類型
        quantity: { type: integer, description: 交易數量 }
        work_order_id: { type: string, format: uuid, nullable: true, description: 關聯工單 UUID }
        technician_id: { type: string, format: uuid, nullable: true, description: 技師 UUID }
        serial: { type: string, nullable: true, description: 序號（consume 時填入，ADR-0053） }
        notes: { type: string, nullable: true, description: 備註 }
        created_at: { type: string, format: date-time, description: 交易時間 }

    InventoryTxnResult:
      type: object
      description: 庫存操作結果（consume / return / restock 共用，data 包裝含 item + transaction）
      properties:
        data:
          type: object
          nullable: true
          properties:
            item:
              $ref: '#/components/schemas/InventoryItem'
              nullable: true
            transaction:
              $ref: '#/components/schemas/InventoryTransaction'
              nullable: true

    # --- M11 Pricing Rules v2 schemas (Track B S4 / CR-0004 §8 C3 / ADR-0046) ---
    PricingSurcharge:
      type: object
      required: [name, amount]
      description: 附加費用項目（modifiers 陣列元素）
      properties:
        name:
          type: string
          description: 費用名稱（例："夜間服務"）
        amount:
          type: string
          description: 金額（2 位小數字串；例："200.00"）
        condition:
          type: string
          nullable: true
          description: 觸發條件說明（選填）

    PricingRule:
      type: object
      required: [id, tenant_id, brand, lock_type, base_price, labor_cost, parts_cost, surcharges, is_active, created_at]
      description: 計價規則（saas.price_rule，對應 _row_to_dict 回傳形狀）
      properties:
        id:
          type: string
          format: uuid
          description: 規則 UUID
        tenant_id:
          type: string
          format: uuid
          description: 租戶 UUID
        brand:
          type: string
          description: 品牌
        lock_type:
          type: string
          description: 鎖具類型
        difficulty:
          type: string
          nullable: true
          enum: [easy, medium, hard]
          description: 難度（選填）
        base_price:
          type: string
          description: 基本費用（2 位小數字串；例："1200.00"）
        labor_cost:
          type: string
          description: 工資（2 位小數字串；例："300.00"）
        parts_cost:
          type: string
          description: 零件費用（2 位小數字串；例："200.00"）
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/PricingSurcharge'
          description: 附加費用列表（對應 DB modifiers jsonb 正規化輸出）
        is_active:
          type: boolean
          description: 是否啟用
        created_at:
          type: string
          format: date-time
          description: 建立時間
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 更新時間

    PricingRuleEnvelope:
      type: object
      description: 單筆計價規則信封（data 包裝，對應 createPricingRuleV2 / getPricingRuleV2 / updatePricingRuleV2 response）
      properties:
        data:
          $ref: '#/components/schemas/PricingRule'
          nullable: true

    PricingRulePage:
      type: object
      required: [has_more]
      description: 計價規則分頁（cursor 分頁，對應 listPricingRulesV2 200 response）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PricingRule' }
          nullable: true
        next_cursor:
          type: string
          nullable: true
          description: 下一頁游標（opaque base64）
        has_more:
          type: boolean

    # --- M09 Data Corrections v2 schemas (Track B S5 / CR-0004 §8 / ADR-0029) ---
    DataCorrection:
      type: object
      required: [id, user_id, note, status, created_at, tenant_id]
      description: 資料修正記錄（saas.data_corrections，11 欄對齊 migration 009 / _row_to_dict）
      properties:
        id:
          type: integer
          description: BIGINT PK（非 uuid）
        user_id:
          type: string
          nullable: true
          description: LINE user ID（提交修正的終端使用者）
        note:
          type: string
          description: 使用者填寫的修正說明
        conversation_context:
          type: object
          nullable: true
          description: 對話上下文快照（JSONB；GDPR PII 標 follow-up FR-0053）
          additionalProperties: true
        user_facts:
          type: object
          nullable: true
          description: 使用者已知事實快照（JSONB；GDPR PII 標 follow-up FR-0053）
          additionalProperties: true
        status:
          type: string
          enum: [pending, approved, resolved, rejected]
          description: 四態狀態機（HD-2）
        created_at:
          type: string
          format: date-time
          description: 建立時間（ISO 8601）
        reviewed_by:
          type: string
          nullable: true
          description: 審核人員 user ID（admin）
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          description: 審核時間（ISO 8601）
        review_note:
          type: string
          nullable: true
          description: 審核備註（approve / reject / resolve 時填入）
        tenant_id:
          type: string
          nullable: true
          description: 租戶 UUID（tenant_id guard；HD-1 方案 B 就地補欄）

    DataCorrectionEnvelope:
      type: object
      description: 單筆資料修正信封（data 包裝，對應 getDataCorrectionV2 / approveDataCorrectionV2 / rejectDataCorrectionV2 / resolveDataCorrectionV2 response）
      properties:
        data:
          $ref: '#/components/schemas/DataCorrection'
          nullable: true

    DataCorrectionPage:
      type: object
      required: [has_more]
      description: 資料修正分頁（cursor 分頁，對應 listDataCorrectionsV2 200 response）
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DataCorrection' }
          nullable: true
        next_cursor:
          type: string
          nullable: true
          description: 下一頁游標（opaque base64；null 表示已到最後一頁）
        has_more:
          type: boolean

    ResolveResponse:
      type: object
      required: [layer, answer]
      description: 解決方案引擎回應（對應 resolveProblemSuggestV2 / legacy resolveProblem 200 response）
      properties:
        layer:
          type: string
          enum: [faq_match, knowledge_base_rag, llm_generation, escalation]
          description: 引擎命中層級（L1 faq_match / L2 knowledge_base_rag / L3 llm_generation / L4 escalation）
        answer:
          type: string
          description: 引擎產生的解答文字
        sources:
          type: array
          nullable: true
          items:
            type: object
            properties:
              type:
                type: string
                enum: [case, manual]
                nullable: true
                description: 來源類型
              id:
                type: string
                format: uuid
                nullable: true
                description: 來源 UUID
              snippet:
                type: string
                nullable: true
                description: 摘錄文字
              score:
                type: number
                nullable: true
                description: 相似度分數
          description: 引擎引用的來源清單（nullable；escalation 層無 sources）
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
          description: 引擎信心度（0.0–1.0；escalation 層無此值）
