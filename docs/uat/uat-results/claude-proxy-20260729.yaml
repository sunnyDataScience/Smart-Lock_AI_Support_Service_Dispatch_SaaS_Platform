defects:
  - id: UAT-D-001
    severity: P1
    title: brand-portal 本機全站 503 —— CR-0190 server-side proxy 缺 runtime API_BASE_URL
    found_in: 環境啟動（非案例）
    detail: >-
      runtimeConfig.apiBaseUrl() 在 NEXT_PUBLIC_API_BASE_URL 為空時，瀏覽器端改走
      本站 /api-proxy；而 serverApiProxy.proxyApiRequest() 讀不到 runtime 環境變數
      API_BASE_URL 時直接回 503 API_PROXY_NOT_CONFIGURED。
      web/brand-portal/docker-compose.yml 的 web service **完全沒有 environment 區塊**，
      故 dashboard、auth/refresh、通知一律 503，前端滿版「載入失敗」，且 WS 403。
      只有 brand-portal 受影響：tech/platform/landing 的 compose 都把
      NEXT_PUBLIC_API_BASE_URL 烤成非空預設值，瀏覽器走直連、不碰 proxy。
      該行的既有註解「空 → 前端 fallback localhost:8001」是 CR-0190 之前的事實，已失效。
    fix: >-
      compose web service 補 environment: API_BASE_URL=http://api:8080、
      PLATFORM_API_BASE_URL=http://platform-api:8080（走 service 名，proxy 在容器內執行）。
    verified: >-
      修復後 /api-proxy/health → 200 且回傳真實 API 回應；瀏覽器端 login 200、
      session 200、dashboard/stats 200、work-orders 200、technicians 200，
      頁面「載入失敗」字樣由滿版降為 0。
    status: FIXED

  - id: UAT-D-002
    severity: P2
    title: 師傅現場上傳接受 HEIC，但瀏覽器無法解碼 —— 完工證據看得到列、看不到圖
    found_in: TC-WEB-MEDIA-01
    detail: >-
      media_service._ALLOWED_CONTENT_TYPES 收 image/heic，而
      web/tech-portal/src/app/my-orders/[id]/page.tsx:639 與
      .../door-check/page.tsx:206,213 三處 accept="image/*" —— iOS 在此設定下
      直接送 HEIC 原檔、不自動轉 JPEG。實測：GET /api/v1/media/{id} 回
      200 image/heic（2,509,465 bytes），瀏覽器 Image 解碼 failed。
      本機 media volume 已有 12 個 .heic。
      **團隊已知此機制**：technician_kyc_service.py:40-41 的註解逐字寫著
      「不收 HEIC —— 瀏覽器 <img> 無法解碼，審核頁無從預覽；前端 accept 不含 heic 時
      iPhone 會自動轉 JPEG」，且 brand-portal 與 RegistrationDocUpload 都已收窄 accept；
      唯獨師傅現場上傳這三處沒套用。
      後果：師傅用 iPhone 上傳完工／門況照片 → 存得進去、完工硬閘也算「有照片」，
      但品牌端審核時是破圖 —— 閘門過了，證據看不到。
    fix_suggestion: >-
      三處 accept 收窄為 image/jpeg,image/png,image/webp（比照 KYC 與 brand-portal），
      並考慮是否要把 image/heic 移出 media_service 白名單（屬 contract 變更，需裁決）。
    status: OPEN

  - id: UAT-D-003
    severity: P3
    title: 6 個純 GET 端點以 CROSS_TENANT_WRITE 回報跨租戶違規（應為 READ）
    found_in: TC-SEC-TENANT-01
    detail: >-
      AST 掃描 215 個純 GET 端點，其中 6 個在跨租戶時 raise ApiError("CROSS_TENANT_WRITE")：
      audit_v2.py:58 list_audit_events_v2、audit_v2.py:98 verify_audit_chain_v2、
      config_m18.py:124 list_config_namespaces、config_m18.py:147 get_config_active_version、
      config_m18.py:350 list_config_audit、refunds_v2.py:130 get_refund_sod。
      codebase 明確區分兩碼（READ 77 處 / WRITE 88 處），故此為 mislabel 而非設計。
      阻擋行為正確（403），僅分類錯誤；但這 6 個全是治理／安全的**讀取**路徑，
      依 error_code 做稽核分類或告警時會把讀取違規計入寫入違規。
    status: OPEN

  - id: UAT-D-004
    severity: P3
    title: tech / platform / landing 的 /api-proxy 路由是活的但恆回 503
    found_in: 環境盤點
    detail: >-
      三站的 serverApiProxy 路由存在且可被打到（實測 /api-proxy/health → 503
