# Trace overrides — manually-maintained TC → flow/fr mapping rules.
#
# Read by scripts/ci/extract-test-cases.py and MERGED into registry.yaml trace
# (existing inline trace wins; this fills in trace.flow / trace.fr).
#
# Two rule types:
#   1. by_module: <module-stem> → trace      (applies to all TCs whose source is in modules/<stem>.md)
#   2. by_bdd_range: <start_id>-<end_id> → trace  (applies to BDD-NNNN within inclusive range)
#
# Trace inference precedence:
#   inline (in source file) > by_bdd_range > by_module > empty

by_module:
  # V1.0 5 完整 modules
  conversation-manager:
    flow: [F-001, F-002]
    fr: [FR-0001, FR-0025]
