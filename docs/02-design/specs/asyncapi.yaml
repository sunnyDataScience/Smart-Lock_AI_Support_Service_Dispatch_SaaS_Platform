asyncapi: 2.6.0

info:
  title: Smart Lock Platform Async API
  version: 0.1.0-draft
  contact:
    name: 前後端協作組
    url: https://github.com/Zenobia0000/Smart-Lock_AI_Support_Service_Dispatch_SaaS_Platform
    email: api-contract@sunnydata.example.com
  license:
    name: Proprietary
    url: https://github.com/Zenobia0000/Smart-Lock_AI_Support_Service_Dispatch_SaaS_Platform
  description: |
    WebSocket、SSE、Webhook、Domain Event 的統一契約。與 `openapi.yaml` 互補。

    **頻道總覽（對齊 `MAPPING.md §7` 與 `E5x--frontend-architecture.md §8.4`）：**
    10 個即時頻道，依用途分為工單/派工/佇列/退款/爭議/SLA/RBAC/庫存/診斷/通知。

    **狀態：** 骨架階段 — 含頻道結構與事件信封，欄位依 Week 3 計畫補完。

defaultContentType: application/json

servers:
  production:
    url: wss://api.sunnydata.example.com/realtime
    protocol: wss
    description: Production
    security:
      - bearerAuth: []
  staging:
    url: wss://api-staging.sunnydata.example.com/realtime
    protocol: wss
  local:
    url: ws://localhost:8000/realtime
    protocol: ws

#####################################################################
# Channels
#####################################################################
channels:

  /realtime/work-orders/{id}:
    description: 單一工單的即時更新（訂閱頁：A12 工單詳情、T3 技師工單詳情）
    parameters:
      id:
        $ref: '#/components/parameters/WorkOrderId'
    subscribe:
      operationId: subscribeWorkOrderUpdates
      summary: 訂閱工單狀態變化與行為事件
      message:
        oneOf:
          - $ref: '#/components/messages/WorkOrderStatusChanged'
          - $ref: '#/components/messages/WorkOrderAssigned'
          - $ref: '#/components/messages/WorkOrderCompleted'

  /realtime/dispatch-queue:
    description: 派工佇列監控（訂閱頁：A28 派工佇列監控）
    subscribe:
      operationId: subscribeDispatchQueue
      message:
        $ref: '#/components/messages/DispatchQueueSnapshot'

  /realtime/pool/{tech_id}:
    description: 技師案件池即時派發（訂閱頁：T1 案件池）
    parameters:
      tech_id:
        $ref: '#/components/parameters/TechnicianId'
    subscribe:
      operationId: subscribeTechnicianPool
      message:
        $ref: '#/components/messages/WorkOrderAvailable'

  /realtime/refunds:
    description: 退款決策事件（訂閱頁：A17 退款審批）
    subscribe:
      operationId: subscribeRefundEvents
      message:
        $ref: '#/components/messages/RefundDecisionMade'

  /realtime/disputes:
    description: 爭議仲裁事件（訂閱頁：A22 爭議仲裁）
    subscribe:
      operationId: subscribeDisputeEvents
      message:
        $ref: '#/components/messages/DisputeCreated'

  /realtime/sla-alerts:
    description: SLA 告警（訂閱頁：A1 儀表板、A29 KPI）
    subscribe:
      operationId: subscribeSlaAlerts
      message:
        $ref: '#/components/messages/SlaAlert'

  /realtime/rbac:
    description: RBAC 權限更新（全域訂閱 — 所有登入 session）
    subscribe:
      operationId: subscribeRbacUpdates
      summary: 權限矩陣變更後即時生效，前端據此重繪按鈕與 hide/show 元件
      message:
        $ref: '#/components/messages/RbacPermissionChanged'

  /realtime/inventory/low-stock:
    description: 低庫存告警（訂閱頁：A19 庫存管理）
    subscribe:
      operationId: subscribeLowStockAlerts
      message:
        $ref: '#/components/messages/LowStockAlert'

  /realtime/diagnostics/{conv_id}:
    description: AI 診斷推理追溯（SSE 逐 token 串流，訂閱頁：A32）
    parameters:
      conv_id:
        $ref: '#/components/parameters/ConversationId'
    subscribe:
      operationId: subscribeDiagnosticStream
      summary: 以 SSE 單向推送 reasoning step，可被前端中斷/覆寫
      message:
        $ref: '#/components/messages/DiagnosticReasoningStep'

  /realtime/notifications/{user_id}:
    description: 個人通知（全域）
    parameters:
      user_id:
        $ref: '#/components/parameters/UserId'
    subscribe:
      operationId: subscribeUserNotifications
      message:
        $ref: '#/components/messages/UserNotification'

#####################################################################
# Components
#####################################################################
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkOrderId:
      description: 工單 ID
      schema:
        type: string
        format: uuid
    TechnicianId:
      description: 技師 ID
      schema:
        type: string
        format: uuid
    ConversationId:
      description: 對話 ID
      schema:
        type: string
        format: uuid
    UserId:
      description: 使用者 ID
      schema:
        type: string
        format: uuid

  #####################################################################
  # 事件信封（Domain Event Envelope）
  #####################################################################
  schemas:

    DomainEventEnvelope:
      type: object
      description: |
        所有 domain event 的統一外層。`data` 依 `event_type` 決定 schema。
      required: [event_id, event_type, event_time, tenant_id, version, data]
      properties:
        event_id:
          type: string
          format: uuid
          description: 全域唯一事件 ID，用於冪等消費
        event_type:
          type: string
          description: 事件類型（dot-separated），e.g. `work_order.status.changed`
          pattern: '^[a-z_]+(\.[a-z_]+)+$'
        event_time:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        actor:
          type: object
          properties:
            actor_type: { type: string, enum: [user, technician, system, customer] }
            actor_id: { type: string }
        version:
          type: integer
          description: 事件 schema 版本（breaking change 必須 bump）
        correlation_id:
          type: string
          format: uuid
          description: 跨事件的追蹤 ID（對應 HTTP X-Request-ID）
        causation_id:
          type: string
          format: uuid
          description: 觸發此事件的上游事件 ID
        data:
          description: 事件專屬載荷

    # -------- 工單事件 --------
    WorkOrderStatusChangedData:
      type: object
      required: [work_order_id, from_status, to_status]
      properties:
        work_order_id: { type: string, format: uuid }
        from_status: { type: string }
        to_status: { type: string }
        reason: { type: string }

    WorkOrderAssignedData:
      type: object
      required: [work_order_id, technician_id]
      properties:
        work_order_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        assigned_by: { type: string, enum: [auto_dispatch, manual, self_pickup] }

    WorkOrderCompletedData:
      type: object
      required: [work_order_id, completion_time]
      properties:
        work_order_id: { type: string, format: uuid }
        completion_time: { type: string, format: date-time }
        actual_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'

    DispatchQueueSnapshotData:
      type: object
      properties:
        pending: { type: integer }
        assigning: { type: integer }
        assigned: { type: integer }
        sla_at_risk: { type: integer }

    WorkOrderAvailableData:
      type: object
      required: [work_order_id, district, estimated_reward]
      properties:
        work_order_id: { type: string, format: uuid }
        district: { type: string }
        estimated_reward: { type: string }
        urgency: { type: string }

    # -------- 退款 / 爭議 --------
    RefundDecisionMadeData:
      type: object
      required: [refund_id, decision]
      properties:
        refund_id: { type: string, format: uuid }
        decision: { type: string, enum: [approve, reject, escalate] }
        dual_sign_pending: { type: boolean }

    DisputeCreatedData:
      type: object
      required: [dispute_id, work_order_id]
      properties:
        dispute_id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        severity: { type: string, enum: [low, medium, high] }

    # -------- SLA / RBAC --------
    SlaAlertData:
      type: object
      required: [alert_type, target_id]
      properties:
        alert_type: { type: string, enum: [quote_expiring, dispatch_delay, response_overdue] }
        target_id: { type: string, format: uuid }
        threshold_minutes: { type: integer }

    RbacPermissionChangedData:
      type: object
      required: [role_id, changed_codes]
      properties:
        role_id: { type: string, format: uuid }
        changed_codes:
          type: array
          items: { type: string }
          description: 扁平化權限碼 `resource.action.scope`

    # -------- 庫存 --------
    LowStockAlertData:
      type: object
      required: [part_id, current_stock, threshold]
      properties:
        part_id: { type: string, format: uuid }
        current_stock: { type: integer }
        threshold: { type: integer }

    # -------- AI 診斷 --------
    DiagnosticReasoningStepData:
      type: object
      required: [conversation_id, step_index, content_delta]
      properties:
        conversation_id: { type: string, format: uuid }
        step_index: { type: integer }
        content_delta: { type: string }
        is_final: { type: boolean }

    # -------- 使用者通知 --------
    UserNotificationData:
      type: object
      required: [title, body, severity]
      properties:
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        link: { type: string, format: uri }

  #####################################################################
  # Messages（DomainEventEnvelope + 專屬 data）
  #####################################################################
  messages:

    WorkOrderStatusChanged:
      name: work_order.status.changed
      contentType: application/json
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              event_type:
                const: work_order.status.changed
              data:
                $ref: '#/components/schemas/WorkOrderStatusChangedData'

    WorkOrderAssigned:
      name: work_order.assigned
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              event_type:
                const: work_order.assigned
              data:
                $ref: '#/components/schemas/WorkOrderAssignedData'

    WorkOrderCompleted:
      name: work_order.completed
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              event_type:
                const: work_order.completed
              data:
                $ref: '#/components/schemas/WorkOrderCompletedData'

    DispatchQueueSnapshot:
      name: dispatch.queue.snapshot
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/DispatchQueueSnapshotData'

    WorkOrderAvailable:
      name: work_order.available
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              event_type:
                const: work_order.available
              data:
                $ref: '#/components/schemas/WorkOrderAvailableData'

    RefundDecisionMade:
      name: refund.decision.made
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/RefundDecisionMadeData'

    DisputeCreated:
      name: dispute.created
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/DisputeCreatedData'

    SlaAlert:
      name: sla.alert
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/SlaAlertData'

    RbacPermissionChanged:
      name: rbac.permission.changed
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/RbacPermissionChangedData'

    LowStockAlert:
      name: inventory.low_stock.alert
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/LowStockAlertData'

    DiagnosticReasoningStep:
      name: diagnostic.reasoning.step
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/DiagnosticReasoningStepData'

    UserNotification:
      name: user.notification
      payload:
        allOf:
          - $ref: '#/components/schemas/DomainEventEnvelope'
          - type: object
            properties:
              data:
                $ref: '#/components/schemas/UserNotificationData'

#####################################################################
# Delivery / Ordering / Replay 規範（Week 3）
#####################################################################
#
# 本 section 定義所有 WebSocket / SSE 頻道的共通交付語義。
# 詳細規則請搭配 `E5x--frontend-architecture.md §8.4` 與 `webhook-spec.md`。
#
# ── 交付語義 ──
# 預設：at-least-once（可能重複）
#   - 消費端必須以 event_id 做冪等去重（24h 窗口記憶體 / Redis SET）
#   - 寫 DB 的關鍵事件採 UPSERT by event_id
# 例外：exactly-once 不提供（分散式系統不可實現 + 成本過高）
#
# ── 事件順序 ──
# 保證：同 tenant_id + 同 aggregate_id（如 work_order_id）→ 順序保留
#   - 後端採 Kafka-like log，按 aggregate_id 路由到同 partition
# 不保證：跨 aggregate（例：WO-42 的事件 vs WO-43 的事件）
#   - 前端不應假設跨 work_order 事件順序
#
# ── 連線生命週期 ──
# 訂閱建立：Client 送 Authorization: Bearer <jwt> + X-Tenant-ID + channel_path
# 訂閱確認：Server 回 SUBSCRIBED { channel, cursor, replay_available }
# 心跳：30 秒雙向 PING/PONG；連續 3 次未回 → 斷線重連
# 重連：Client 帶上次收到的 event_id 作為 cursor → Server replay 漏收事件（上限 100 筆 / 5 分鐘內）
# 權限變更：伺服器主動下推 rbac.permission.changed → Client 若失權限 → Server 斷該訂閱
#
# ── Replay 規範 ──
# 預設保留：每個頻道最近 5 分鐘或最近 100 筆，視先達者
# Replay 請求：Client 於重連時帶 last_event_id；超出保留範圍 → Server 回 REPLAY_UNAVAILABLE，
#              Client 需走 REST 拉最新狀態（/api/v1/<resource>/{id}）
#
# ── Backpressure ──
# 慢消費者：Server 持有 outbound queue 上限 500 筆，超過 → 斷線並記錄 audit.slow_consumer
# 客戶端應避免在 WS message handler 內做耗時操作（建議 postMessage 至 Web Worker）

#####################################################################
# Webhook 契約（inbound）
#####################################################################
#
# Webhook 是「第三方系統 → 本平台」的入站通知。
# 本區塊記錄事件拓樸與 domain event 對應，詳細規格見 `webhook-spec.md`。
#
# ── LINE Messaging API Webhook ──
# Endpoint: POST /webhook
# Signature: X-Line-Signature (base64 HMAC-SHA256, channel_secret)
# Event 映射至 domain events：
#   message.text          → conversation.message.received
#   message.image|audio   → conversation.media.received
#   postback              → 依 data.action 映射（rsvp / dispatch_accept / complaint_ack）
#   follow / unfollow     → customer.relationship.changed
#
# ── 金流 Webhook ──
# Endpoints:
#   POST /webhook/payments/line-pay   (X-LinePay-Signature)
#   POST /webhook/payments/ecpay      (CheckMacValue, 特殊演算法)
#   POST /webhook/payments/newebpay   (TradeSha, AES+SHA256)
# 統一內部格式 payment_webhook_normalized（見 webhook-spec §3.4）
# Domain events:
#   payment.confirmed
#   payment.failed
#   payment.refund.processed
#   payment.refund.failed
#   payment.chargeback
#
# ── 電子發票 Webhook ──
# Endpoint: POST /webhook/invoice (X-MOF-Signature 或加值中心簽名)
# 台灣電子發票平台：number 格式 ^[A-Z]{2}\d{8}$，作廢期限當月 25 日
# Domain events:
#   invoice.issued
#   invoice.voided
#   invoice.allowance.issued
#   invoice.allowance.voided
#   invoice.winning
#
# ── 三件套通用規範 ──
# 1) 簽名（X-Signature / X-Line-Signature / CheckMacValue 等平台特規）：
#    HMAC-SHA256，raw body 輸入，租戶或平台專屬 secret。驗證失敗 → 401
#    + error_code=WEBHOOK_SIGNATURE_INVALID
# 2) 重試（Retry-After）：指數退避 1min → 5min → 30min → 2hr → 24hr，
#    上限 5 次。5xx / 423 回應可帶 Retry-After header 指示何時重試。
#    5 次都失敗 → 熔斷並通知 tenant_admin。
# 3) 冪等（Idempotency-Key）：24h 窗，相同 key + 相同 body hash → 回首次
#    結果不重複執行副作用。不同 body 但同 key → 409 IDEMPOTENCY_KEY_REUSED。
#    金流 / 發票強制帶；LINE 以 webhookEventId 替代。
#
# 新增錯誤碼（需同步 error-codes.md）：
#   WEBHOOK_SIGNATURE_INVALID          401
#   WEBHOOK_IDEMPOTENCY_REPLAY         200 (警告類)
#   WEBHOOK_WORK_ORDER_NOT_FOUND       404
#   WEBHOOK_AMOUNT_MISMATCH            422
#   WEBHOOK_PAYMENT_ALREADY_FINAL      409
#   INVOICE_NUMBER_INVALID             422
#   INVOICE_CATEGORY_MISMATCH          422
#   INVOICE_VOID_WINDOW_EXPIRED        410
#   INVOICE_DUPLICATE_NUMBER           409
