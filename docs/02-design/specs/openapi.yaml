openapi: 3.1.0

info:
  title: Smart Lock AI Support & Service Dispatch Platform API
  version: 0.2.0
  summary: 前後端分離開發的 API 單一事實來源（SSOT）
  description: |
    本檔案是 `/api/v1/*` 所有 REST 端點的機器可讀契約，**並為唯一事實來源（SSOT）**。
    與 Markdown 敘述文件並行：

    - 敘述（narrative）：`E5--api-design-specification.md`、`E5x--frontend-architecture.md §8`
    - 契約（machine-readable）：**本檔（SSOT）** + `asyncapi.yaml` + `error-codes.md`

    **衝突處理：** 當 YAML 與 E5 敘述文件不一致時，**以本檔為準**。
    E5 為導讀與設計理由說明，後續變更應先進 YAML，再回頭更新 E5。

    **使用方式：**
    - 後端 FastAPI 應 `assert app.openapi() == load(openapi.yaml)`（或以此生成 Pydantic）
    - 前端以 `openapi-typescript` 產生 `docs/02-design/specs/generated/api.generated.ts`
    - CI 以 `spectral lint` 把關、`schemathesis` 做契約測試
    - 本機 mock：`./scripts/mock-server.sh` 啟動 Prism on port 4010

    **狀態：** SSOT — 已對齊 E5--api-design-specification.md v1.1 全部 V1.0 端點。
  contact:
    name: 前後端協作組
    url: https://github.com/Zenobia0000/Smart-Lock_AI_Support_Service_Dispatch_SaaS_Platform
    email: api-contract@sunnydata.example.com
  license:
    name: Proprietary
    url: https://github.com/Zenobia0000/Smart-Lock_AI_Support_Service_Dispatch_SaaS_Platform

servers:
  - url: https://api.sunnydata.example.com
    description: Production
  - url: https://api-staging.sunnydata.example.com
    description: Staging
  - url: http://localhost:8000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 認證與登入 (user_management)
  - name: user_management
    description: 使用者與角色 (user_management)
  - name: customer_service
    description: 對話與問題卡 (customer_service)
  - name: knowledge_base
    description: 知識庫（案例、手冊、SOP）
  - name: dispatch
    description: 派工 / 工單 / 技師 / 客戶
  - name: accounting
    description: 帳務 / 退款 / 爭議 / 保固
  - name: inventory
    description: 庫存與零件
  - name: audit
    description: 稽核日誌
  - name: reports
    description: 報表（KPI / 排行 / 營收）
  - name: agent_harness
    description: AI 診斷推理追溯
  - name: multi_tenant
    description: 多租戶 / 超管（V3.0）
  - name: e_signature
    description: 電子簽章與雙簽
  - name: realtime
    description: WebSocket / SSE 端點說明（實際契約見 asyncapi.yaml）

#####################################################################
# Paths — 骨架：每個 Bounded Context 至少一個代表性 endpoint
#####################################################################
paths:

  # -----------------------------
  # auth
  # -----------------------------
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 管理員登入
      operationId: loginAdmin
      security: []  # 登入本身無需 Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/technicians/login:
    post:
      tags: [auth]
      summary: 技師登入
      operationId: loginTechnician
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # -----------------------------
  # customer_service
  # -----------------------------
  /api/v1/conversations:
    get:
      tags: [customer_service]
      summary: 對話列表（cursor 分頁）
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ConversationStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/conversations/{id}:
    get:
      tags: [customer_service]
      summary: 對話詳情
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/problem-cards:
    get:
      tags: [customer_service]
      summary: 問題卡列表
      operationId: listProblemCards
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: conversation_id
          schema:
            type: string
            format: uuid
          description: 過濾特定對話下的問題卡
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemCardPage'
    post:
      tags: [customer_service]
      summary: 建立問題卡
      operationId: createProblemCard
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemCardCreateRequest'
      responses:
        '201':
          description: 已建立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemCardEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  # -----------------------------
  # dispatch — work orders
  # -----------------------------
  /api/v1/work-orders:
    get:
      tags: [dispatch]
      summary: 工單列表
      operationId: listWorkOrders
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - in: query
          name: problem_card_id
          schema:
            type: string
            format: uuid
          description: 過濾特定問題卡的工單
        - in: query
          name: technician_id
          schema:
            type: string
            format: uuid
          description: 過濾指派給特定技師的工單
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'

  /api/v1/work-orders/{id}:
    get:
      tags: [dispatch]
      summary: 工單詳情
      operationId: getWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/work-orders/{id}/accept:
    post:
      tags: [dispatch]
      summary: 技師接單（強制 Idempotency-Key）
      description: 防技師雙擊接單。Idempotency-Key 於 24h 內重複視為同一請求。
      operationId: acceptWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 接單成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'
        '409':
          description: 狀態衝突（工單已被他人接單 / 狀態不允許）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/work-orders/{id}/complete:
    post:
      tags: [dispatch]
      summary: 完工回報（強制 Idempotency-Key）
      operationId: completeWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionReport'
      responses:
        '200':
          description: 完工回報已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'

  /api/v1/work-orders/{id}/cancel:
    post:
      tags: [dispatch]
      summary: 取消工單（強制 Idempotency-Key）
      description: 將工單從非結案狀態（created/assigned/accepted/in_progress）轉為 cancelled。
      operationId: cancelWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderCancelRequest'
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'
        '409':
          description: 狀態衝突（工單已結案無法取消）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/work-orders/pool:
    get:
      tags: [dispatch]
      summary: 技師案件池（可接工單列表）
      operationId: listWorkOrderPool
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'

  /api/v1/work-orders/dispatch-queue:
    get:
      tags: [dispatch]
      summary: 派工佇列監控
      description: 管理員派工監控主介面，搭配 WS `/realtime/dispatch-queue`。
      operationId: getDispatchQueue
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchQueueSnapshot'

  /api/v1/dispatch-logs:
    get:
      tags: [dispatch]
      summary: 派工歷程列表
      description: 管理員派工監控明細表格資料源；以 (work_order_id, created_at) 排序。
      operationId: listDispatchLogs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: work_order_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DispatchAction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchLogPage'

  # -----------------------------
  # accounting — refunds / disputes / warranty
  # -----------------------------
  /api/v1/refunds:
    get:
      tags: [accounting]
      summary: 退款申請列表
      operationId: listRefundRequests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RefundRequestStatus'
        - name: work_order_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestPage'

  /api/v1/refunds/{id}:
    get:
      tags: [accounting]
      summary: 退款申請詳情
      operationId: getRefundRequest
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequestEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/disputes:
    get:
      tags: [accounting]
      summary: 爭議案件列表
      operationId: listDisputes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeStatus'
        - name: dispute_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeType'
        - name: work_order_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputePage'

  /api/v1/disputes/{id}:
    get:
      tags: [accounting]
      summary: 爭議案件詳情
      operationId: getDispute
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/warranty-claims:
    get:
      tags: [accounting]
      summary: 保固申請列表
      operationId: listWarrantyClaims
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WarrantyClaimStatus'
        - name: customer_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: work_order_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimPage'

  /api/v1/warranty-claims/{id}:
    get:
      tags: [accounting]
      summary: 保固申請詳情
      operationId: getWarrantyClaim
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/refunds/{id}/decision:
    post:
      tags: [accounting]
      summary: 退款審批決策（強制 Idempotency-Key + 雙簽流程起點）
      operationId: submitRefundDecision
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundDecision'
      responses:
        '200':
          description: 決策已記錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundEnvelope'

  # -----------------------------
  # e_signature
  # -----------------------------
  /api/v1/work-orders/{id}/signature:
    post:
      tags: [e_signature]
      summary: 雙方電子簽章（強制 Idempotency-Key）
      description: T9 客戶+技師雙方簽章，簽署後不可重複。
      operationId: submitWorkOrderSignature
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignaturePayload'
      responses:
        '200':
          description: 簽章完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGeneric'

  # -----------------------------
  # dispatch — 手動介入與候選（Week 2 from validation-gate A37）
  # -----------------------------
  /api/v1/dispatch/candidates:
    get:
      tags: [dispatch]
      summary: 查詢候選技師（A37 派工人工介入）
      description: 依 work_order_id 計算綜合分（0.4 匹配 + 0.3 距離 + 0.3 評分）排序的候選清單
      operationId: listDispatchCandidates
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: query
          name: work_order_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: skills
          schema: { type: array, items: { type: string } }
        - in: query
          name: areas
          schema: { type: array, items: { type: string } }
        - in: query
          name: levels
          schema:
            type: array
            items: { $ref: '#/components/schemas/TechnicianLevel' }
        - in: query
          name: exclude_circuit
          schema: { type: boolean, default: true }
        - in: query
          name: rating_min
          schema: { type: number, format: float, minimum: 0, maximum: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        technician: { $ref: '#/components/schemas/Technician' }
                        score:
                          type: number
                          format: float
                          minimum: 0
                          maximum: 100
                        distance_km: { type: number, format: float }
                        skill_match:
                          type: number
                          format: float
                          minimum: 0
                          maximum: 1
                        availability_eta_minutes: { type: integer }
                  total: { type: integer }
                  auto_dispatch_attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        technician_id: { type: string, format: uuid }
                        attempted_at: { type: string, format: date-time }
                        outcome: { type: string, enum: [accepted, declined, timeout] }

  /api/v1/work-orders/{id}/assign:
    post:
      tags: [dispatch]
      summary: 手動指派技師（強制 Idempotency-Key + decision reason）
      operationId: assignWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderAssignRequest'
      responses:
        '200':
          description: 指派成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'
        '409':
          description: 衝突（含 DISPATCH_OVERRIDE_REQUIRED / WORK_ORDER_CONFLICT / TECHNICIAN_CIRCUIT_BREAKER_OPEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/v1/work-orders/{id}/escalate:
    post:
      tags: [dispatch]
      summary: 升級工單至更高層級
      operationId: escalateWorkOrder
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderEscalateRequest'
      responses:
        '200':
          description: 已升級
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'

  # -----------------------------
  # 改期日曆（Week 2 from T11）
  # -----------------------------
  /api/v1/technicians/me/availability:
    get:
      tags: [dispatch]
      summary: 查詢技師自己某日可用時段
      operationId: getTechnicianAvailability
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - in: query
          name: work_order_id
          schema: { type: string, format: uuid }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        end: { type: string, format: date-time }
                        status:
                          type: string
                          enum: [available, soft_conflict, hard_conflict]
                        conflict_reason:
                          type: [string, "null"]
                          enum: [buffer_insufficient, another_order, customer_dnd, holiday, null]
                  customer_preferences:
                    type: object
                    properties:
                      preferred_hours: { type: array, items: { type: string } }
                      dnd_hours: { type: array, items: { type: string } }
                  past_reschedule_count: { type: integer }

  /api/v1/work-orders/{id}/reschedule:
    post:
      tags: [dispatch]
      summary: 送出改期請求給客戶（T11）
      description: 技師提交 1-3 個備選時段，系統 LINE Flex push 給客戶 RSVP（24h TTL）
      operationId: proposeReschedule
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_slots, message_to_customer]
              properties:
                proposed_slots:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start: { type: string, format: date-time }
                      end: { type: string, format: date-time }
                message_to_customer: { type: string, maxLength: 120 }
                warning_acknowledged_at: { type: [string, "null"], format: date-time }
                send_via:
                  type: string
                  enum: [line, line_and_sms]
                  default: line
      responses:
        '200':
          description: 改期請求已發送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderEnvelope'
        '409':
          description: RESCHEDULE_SLOT_TAKEN / WORK_ORDER_CONFLICT
        '422':
          description: RESCHEDULE_LIMIT_EXCEEDED（24h 內已 3 次）

  # -----------------------------
  # 通知中心（Week 2 from G1）
  # -----------------------------
  /api/v1/notifications:
    get:
      tags: [realtime]
      summary: 通知列表（G1 通知中心）
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: status
          schema:
            type: string
            enum: [unread, read, archived, all]
        - in: query
          name: type
          schema:
            type: array
            items:
              type: string
              enum: [work_order, refund, dispute, rbac, inventory, sla, system, mention]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
                  unread_count: { type: integer }

  /api/v1/notifications/{id}:
    patch:
      tags: [realtime]
      summary: 標記通知狀態
      operationId: updateNotification
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read_at: { type: [string, "null"], format: date-time }
                archived_at: { type: [string, "null"], format: date-time }
      responses:
        '200':
          description: OK

  /api/v1/notifications/bulk:
    post:
      tags: [realtime]
      summary: 批量處理通知
      operationId: bulkUpdateNotifications
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  maxItems: 1000
                  items: { type: string, format: uuid }
                action:
                  type: string
                  enum: [mark_read, mark_unread, archive, delete]
      responses:
        '200':
          description: OK
        '422':
          description: NOTIFICATION_BULK_LIMIT_EXCEEDED

  /api/v1/notifications/mark-all-read:
    post:
      tags: [realtime]
      summary: 全部標為已讀（Critical 類除外）
      operationId: markAllNotificationsRead
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  properties:
                    type:
                      type: array
                      items: { type: string }
      responses:
        '200':
          description: OK

