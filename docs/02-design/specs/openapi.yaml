  # /api/v1/roles                                GET/POST/PUT/DELETE — G1 RBAC
  # /api/v1/audit-events                         GET — G2
  # /api/v1/audit-events/export                  POST — G2
  # /api/v1/inventory/parts                      GET/POST — G3
  # /api/v1/inventory/low-stock                  GET — G3
  # /api/v1/inventory/purchase-orders            POST — G3
