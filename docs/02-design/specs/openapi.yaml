#####################################################################
# Components
#####################################################################
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token，由 `POST /api/v1/auth/login` 或 `POST /api/v1/technicians/login` 發出。
        前端實作：Next.js Middleware 從 httpOnly Cookie 注入至 Authorization Header。

  #####################################################################
  # 全域參數（Global Parameters）
  #####################################################################
  parameters:

    XTenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: 多租戶識別（V3.0 強制）。由 Middleware 從 JWT payload 或 Cookie 注入。
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        寫操作冪等性鍵（UUID v4）。24h 內相同 Key 視為同一請求，回傳首次結果。
        強制範圍：接單、完工、雙簽、退款決策、金流類 mutation。
      schema:
        type: string
        format: uuid

    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 分散式追蹤 Correlation ID，若無則後端自動生成。
      schema:
        type: string
        format: uuid

    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor-based 分頁游標，首頁省略。
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortBy:
      name: sort_by
      in: query
      required: false
      schema:
        type: string

    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  #####################################################################
  # 通用回應（Shared Responses）
  #####################################################################
  responses:

    LoginSuccess:
      description: 登入成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'

    Unauthorized:
      description: 未認證
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    Conflict:
      description: 狀態衝突（樂觀鎖、重複操作、狀態機不允許）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

    ValidationError:
      description: 輸入驗證失敗（欄位級錯誤見 details）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  #####################################################################
  # Schemas
  #####################################################################
  schemas:

    # --------- 通用信封 ---------
    ApiResponseGeneric:
      type: object
      required: [data]
      properties:
        data:
          description: 實際載荷，由各 endpoint 具體化
        message:
          type: string

    ApiErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          description: 統一錯誤碼（見 `docs/02-design/error-codes.md`）
          examples:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - OPTIMISTIC_LOCK_FAILED
            - RATE_LIMITED
            - IDEMPOTENCY_KEY_REUSED
            - TENANT_MISMATCH
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - WORK_ORDER_CONFLICT
            - WORK_ORDER_STATUS_INVALID
            - QUOTE_EXPIRED
            - TECHNICIAN_CIRCUIT_BREAKER_OPEN
            - TECHNICIAN_SCHEDULE_CONFLICT
            - DISPATCH_NO_TECHNICIAN_AVAILABLE
            - DISPATCH_OVERRIDE_REQUIRED
            - DISPATCH_REASON_MISSING
            - SIGNATURE_ALREADY_SIGNED
            - APPEARANCE_CHANGE_SIGNATURE_REJECTED
            - APPEARANCE_CHANGE_EVIDENCE_INCOMPLETE
            - REFUND_DUAL_SIGN_REQUIRED
            - REFUND_DECISION_LOCKED
            - COMPLAINT_ALREADY_IN_DISPUTE
            - DISPUTE_MERGE_FAILED
            - DISPUTE_EXTERNAL_PENDING
            - DISPUTE_SLA_OVERDUE
            - INVENTORY_INSUFFICIENT
            - INVENTORY_PART_NOT_FOUND
            - ROLE_IN_USE
            - PERMISSION_CODE_INVALID
            - AUDIT_EXPORT_TOO_LARGE
            - DIAGNOSTIC_STREAM_CLOSED
            - TENANT_SUSPENDED
            - TENANT_LINE_BINDING_FAILED
            - TENANT_NOT_FOUND
            - BRAND_CONFIG_INVALID
            - BRAND_REVIEW_PENDING
            - TENANT_QUOTA_EXCEEDED
            - NOTIFICATION_NOT_FOUND
            - NOTIFICATION_BULK_LIMIT_EXCEEDED
            - RESCHEDULE_LIMIT_EXCEEDED
            - RESCHEDULE_RSVP_EXPIRED
            - RESCHEDULE_SLOT_TAKEN
        message:
          type: string
          description: 使用者可見訊息（依 Accept-Language i18n）
        details:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'

    ApiFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    CursorPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        total_count:
          type: integer

    # --------- 認證 ---------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              type: object
              required: [access_token, refresh_token, token_type, expires_in]
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                  description: 用於 /auth/refresh 換發 access token
                token_type:
                  type: string
                  enum: [Bearer]
                  default: Bearer
                expires_in:
                  type: integer
                  description: access_token 有效秒數

    # --------- 對話 / 問題卡 ---------
    ConversationStatus:
      type: string
      enum: [active, waiting_human, closed]

    Conversation:
      type: object
      required: [id, line_user_id, display_name, status, message_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        line_user_id: { type: string }
        display_name: { type: string }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        resolution_layer:
          type: [string, "null"]
          enum: [case_library, rag, human, null]
        message_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConversationEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Conversation'

    ConversationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    ProblemCardStatus:
      type: string
      enum: [draft, confirmed, resolved]

    Urgency:
      type: string
      enum: [low, medium, high]

    ProblemCard:
      type: object
      required: [id, conversation_id, brand, model, symptom, category, urgency, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        brand: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        symptom: { type: string, maxLength: 1000 }
        category: { type: string }
        urgency: { $ref: '#/components/schemas/Urgency' }
        confidence_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: AI 分類信心分數（閾值 0.6 以下觸發人工覆核）
        status: { $ref: '#/components/schemas/ProblemCardStatus' }
        media_urls:
          type: array
          items:
            type: string
            format: uri
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProblemCardPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProblemCard'

    # --------- 工單 ---------
    WorkOrderStatus:
      type: string
      description: |
        16 狀態工單狀態機（見 `E5x--work-order-interaction-flows.md §18.3`）
      enum:
        - inquiring
        - qualified
        - quoted
        - negotiating
        - accepted
        - scheduled
        - dispatching
        - assigned
        - en_route
        - arrived
        - in_progress
        - completed
        - billed
        - paid
        - closed
        - cancelled

    WorkOrder:
      type: object
      required: [id, problem_card_id, status, district, address, brand, model, urgency, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        problem_card_id: { type: string, format: uuid }
        technician_id:
          type: [string, "null"]
          format: uuid
        status: { $ref: '#/components/schemas/WorkOrderStatus' }
        district: { type: string }
        address: { type: string }
        brand: { type: string }
        model: { type: string }
        urgency: { $ref: '#/components/schemas/Urgency' }
        estimated_reward:
          type: string
          description: Decimal(10,2) 序列化為字串以避免 JS 浮點誤差
          pattern: '^-?\d+(\.\d{1,2})?$'
        scheduled_time: { type: [string, "null"], format: date-time }
        actual_arrival: { type: [string, "null"], format: date-time }
        completion_time: { type: [string, "null"], format: date-time }
        version:
          type: integer
          description: 樂觀鎖版本號，更新時 server 比對
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkOrderEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkOrder'

    WorkOrderPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WorkOrder'

    CompletionReport:
      type: object
      required: [summary]
      description: |
        完工回報。`photos_before` / `photos_after` 暫時為 optional（`minItems: 0`），
        待媒體上傳模組接入後再上修為必填。
      properties:
        summary:
          type: string
          maxLength: 2000
        photos_before:
          type: array
          items: { type: string, format: uri }
          minItems: 0
        photos_after:
          type: array
          items: { type: string, format: uri }
          minItems: 0
        parts_used:
          type: array
          items:
            type: object
            required: [part_id, quantity]
            properties:
              part_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
        actual_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'

    WorkOrderCancelRequest:
      type: object
      description: 工單取消理由（管理員或上層流程觸發）。
      properties:
        reason:
          type: string
          maxLength: 500

    WorkOrderAssignRequest:
      type: object
      description: 手動指派技師（admin override）。technician_id + reason_code 必填；override_flags 預留 circuit-breaker / cross-area，MVP 一律 false。
      required: [technician_id, reason_code]
      properties:
        technician_id: { type: string, format: uuid }
        reason_code:
          type: string
          enum: [auto_dispatch_exhausted, customer_requested_specific_tech, skill_shortage_override, sla_rescue, other]
        reason_text: { type: string, maxLength: 500 }
        override_flags:
          type: object
          properties:
            allow_circuit: { type: boolean, default: false }
            allow_cross_area: { type: boolean, default: false }

    WorkOrderEscalateRequest:
      type: object
      description: 工單升級至上層覆審。level 指定接收者；reason 必填留稽核軌跡。MVP 不切狀態，僅將 priority 推進到 urgent 並記入 service_report；上層 escalation_logs 表上線後再正規化。
      required: [level, reason]
      properties:
        level:
          type: string
          enum: [operations_manager, tenant_admin]
        reason:
          type: string
          maxLength: 500

    # --------- 保固申請（list/get） ---------
    WarrantyClaimStatus:
      type: string
      enum: [filed, approved, rejected, in_progress, closed]

    WarrantyClaim:
      type: object
      description: 保固申請（read-only）
      required:
        - id
        - customer_id
        - device_brand
        - device_model
        - warranty_start_date
        - warranty_end_date
        - claim_date
        - is_within_warranty
        - status
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: [string, "null"], format: uuid }
        customer_id: { type: string, format: uuid }
        device_brand: { type: string }
        device_model: { type: string }
        purchase_date: { type: [string, "null"], format: date }
        warranty_start_date:
          type: string
          format: date
          description: 保固起始日（以「交屋日期」為準）
        warranty_end_date: { type: string, format: date }
        claim_date: { type: string, format: date }
        is_within_warranty: { type: boolean }
        status: { $ref: '#/components/schemas/WarrantyClaimStatus' }
        dispute_reason: { type: [string, "null"] }
        verification_source: { type: [string, "null"] }
        resolution: { type: [string, "null"] }
        discount_offered:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 折讓金額（無保固但提供折讓時）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarrantyClaimEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WarrantyClaim'

    WarrantyClaimPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WarrantyClaim'

    # --------- 退款申請（list/get） ---------
    RefundRequestStatus:
      type: string
      enum: [pending, approved, rejected, escalated, executed, cancelled]

    RefundRequest:
      type: object
      description: 退款申請（read-only；雙簽流程經 submitRefundDecision 推進）
      required: [id, work_order_id, requested_by, amount, reason, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        invoice_id: { type: [string, "null"], format: uuid }
        complaint_id: { type: [string, "null"], format: uuid }
        requested_by: { type: string, format: uuid }
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        reason: { type: string }
        status: { $ref: '#/components/schemas/RefundRequestStatus' }
        requires_dual_sign: { type: boolean }
        approval_chain:
          type: array
          description: 審批鏈（已記錄的決策步驟，順序由舊到新）
          items:
            type: object
            additionalProperties: true
        executed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RefundRequestEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RefundRequest'

    RefundRequestPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RefundRequest'

    # --------- 爭議案件（list/get） ---------
    DisputeType:
      type: string
      description: 爭議類型（pricing 價格 / quality 品質 / warranty 保固 / cancellation_fee 取消費 / settlement 結算）
      enum: [pricing, quality, warranty, cancellation_fee, settlement]

    DisputeStatus:
      type: string
      description: 爭議狀態（filed 待處理 / in_review 調解中 / resolved 已結案 / rejected 已駁回 / closed 已關閉）
      enum: [filed, in_review, resolved, rejected, closed]

    Dispute:
      type: object
      description: 爭議案件（read-only；調解動作待 submitDisputeResolution 上線後接入）
      required:
        - id
        - filed_by
        - dispute_type
        - status
        - description
        - filed_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: [string, "null"], format: uuid }
        invoice_id: { type: [string, "null"], format: uuid }
        filed_by: { type: string, format: uuid }
        dispute_type: { $ref: '#/components/schemas/DisputeType' }
        status: { $ref: '#/components/schemas/DisputeStatus' }
        description: { type: string }
        evidence:
          description: 雙方證據（jsonb；通常為 customer/technician 兩段結構）
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }
            - type: "null"
        resolution: { type: [string, "null"] }
        resolution_amount:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 調解金額（部分退款 / 全額退款時填寫）
        resolved_by: { type: [string, "null"], format: uuid }
        filed_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        sla_deadline: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DisputeEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Dispute'

    DisputePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Dispute'

    # --------- 退款（雙簽流程） ---------
    RefundDecision:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject, escalate]
        reason:
          type: string
          maxLength: 500
        dual_sign_required:
          type: boolean
          description: 金額門檻以上需第二簽核者

    RefundEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'

    # --------- 簽章 ---------
    SignaturePayload:
      type: object
      required: [customer_signature, technician_signature]
      properties:
        customer_signature:
          type: string
          description: Base64 編碼的簽章影像或 SVG Path
        technician_signature:
          type: string
        gps_lat:
          type: number
        gps_lng:
          type: number
        signed_at:
          type: string
          format: date-time

    # --------- 派工佇列 ---------
    DispatchAction:
      type: string
      description: 派工事件類型（assign 指派 / accept 接受 / reject 拒絕 / timeout 超時 / reassign 重派 / cancel 取消）
      enum: [assign, accept, reject, timeout, reassign, cancel]

    DispatchLog:
      type: object
      description: 派工歷程紀錄（read-only；單一工單可有多筆代表派工嘗試序列）
      required: [id, work_order_id, action, created_at]
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/DispatchAction' }
        technician_id: { type: [string, "null"], format: uuid }
        technician_name: { type: [string, "null"], description: 由 technicians 表 JOIN 取得方便前端顯示 }
        match_score: { type: [number, "null"], description: AI 媒合分數（0-100） }
        match_factors:
          description: 媒合因子（jsonb；通常為 distance/skill/availability 加權結構）
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        rejection_reason: { type: [string, "null"] }
        timeout_seconds: { type: [integer, "null"] }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    DispatchLogPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DispatchLog'

    DispatchQueueSnapshot:
      type: object
      required: [pending, assigning, assigned]
      properties:
        pending:
          type: integer
        assigning:
          type: integer
        assigned:
          type: integer
        sla_at_risk:
          type: integer
          description: 2 小時內可能逾期的工單數

    # --------- Quote（Week 2 完整化） ---------
    QuoteStatus:
      type: string
      enum: [draft, sent, negotiating, accepted, rejected, expired]

    Quote:
      type: object
      description: |
        工單報價（對齊 E5x--work-order-interaction-flows.md §17）。
        採區間制：min/max 為當前報價區間，客戶 accept 後 scalar 欄位為最終金額。
      required: [id, work_order_id, status, min_amount, max_amount, currency, valid_until, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        min_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: Decimal(10,2) 字串，對應區間下限
        max_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TWD]
          default: TWD
        final_amount:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 客戶 accept 後的最終金額
        breakdown:
          type: array
          description: 報價明細項
          items:
            type: object
            required: [item_type, description, amount]
            properties:
              item_type:
                type: string
                enum: [labor, parts, travel, holiday_surcharge, appearance_change, other]
              description: { type: string, maxLength: 200 }
              amount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
        valid_until:
          type: string
          format: date-time
          description: 有效期（預設 48h）
        negotiation_history:
          type: array
          description: 議價輪次記錄
          items:
            type: object
            properties:
              round: { type: integer, minimum: 1 }
              proposed_by: { type: string, enum: [system, customer, technician, admin] }
              proposed_amount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$' }
              proposed_at: { type: string, format: date-time }
              outcome: { type: string, enum: [pending, accepted, rejected, counter_offered] }
        version:
          type: integer
          description: 樂觀鎖
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    QuoteEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Quote'

    # --------- Exception（Week 2 完整化） ---------
    ExceptionType:
      type: string
      enum:
        - no_show                       # 技師未到
        - customer_absent               # 客戶不在場
        - scope_change_rejected         # 客戶拒絕範圍變更
        - material_shortage             # 缺料
        - delay_severe                  # 嚴重延遲
        - appearance_refused            # 拒簽外觀變更
        - payment_failed                # 付款失敗
        - quality_complaint             # 品質不合格
        - schedule_conflict             # 排班衝突（Flow 14）
        - other

    ExceptionStatus:
      type: string
      enum: [open, investigating, resolved, escalated, closed]

    Exception:
      type: object
      description: |
        工單異常記錄（對齊 E5x--work-order-interaction-flows.md §22 異常返回節點 + 熔斷規則）
      required: [id, work_order_id, exception_type, status, severity, created_at]
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        exception_type: { $ref: '#/components/schemas/ExceptionType' }
        status: { $ref: '#/components/schemas/ExceptionStatus' }
        severity:
          type: string
          enum: [low, medium, high, critical]
        description: { type: string, maxLength: 2000 }
        return_to_stage:
          type: [string, "null"]
          description: 異常處理後工單應返回的 WorkOrder 狀態
        triggers_circuit_breaker:
          type: boolean
          description: 是否觸發技師熔斷計數（24hr 3 次或 12 月 3 次放鴿子）
        actor:
          type: object
          properties:
            actor_type: { type: string, enum: [customer, technician, system, admin] }
            actor_id: { type: string }
        resolution:
          type: [string, "null"]
          description: 處理結果描述
        resolved_at: { type: [string, "null"], format: date-time }
        resolved_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExceptionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Exception'

    ExceptionPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Exception'

    # --------- Invoice（Week 2 完整化） ---------
    InvoiceStatus:
      type: string
      enum: [pending, issued, allowance_pending, voided, reopened]

    Invoice:
      type: object
      description: |
        電子發票（對齊 E5x--work-order-interaction-flows.md §21 EX5）
      required: [id, work_order_id, invoice_number, amount, status, issued_at, created_at]
      properties:
        id: { type: string, format: uuid }
        work_order_id: { type: string, format: uuid }
        invoice_number:
          type: string
          pattern: '^[A-Z]{2}\d{8}$'
          description: 台灣電子發票號碼（如 AB12345678）
        tax_id:
          type: [string, "null"]
          pattern: '^\d{8}$'
          description: 買方統編（選填）
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        tax_type:
          type: string
          enum: [taxable, zero_rated, exempt]
          default: taxable
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        issued_at: { type: string, format: date-time }
        voided_at: { type: [string, "null"], format: date-time }
        void_reason: { type: [string, "null"] }
        allowance_amount:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 折讓金額（退款時部分折讓）
        category:
          type: string
          enum: [service_fee, travel_fee, parts, other]
          description: 稅務分類 — 車馬費獨立開立，不與工單合併
        reopened_from:
          type: [string, "null"]
          format: uuid
          description: 重開發票的原發票 ID
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InvoiceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Invoice'

    InvoicePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Invoice'

    # --------- Technician（Week 2） ---------
    TechnicianLevel:
      type: string
      enum: [S, A, B, C]

    TechnicianAvailability:
      type: string
      enum: [available, busy, offline, on_leave, circuit_breaker_open]

    Technician:
      type: object
      required: [id, name, phone, level, availability, skills, service_areas, rating, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, pattern: '^09\d{8}$' }
        level: { $ref: '#/components/schemas/TechnicianLevel' }
        availability: { $ref: '#/components/schemas/TechnicianAvailability' }
        skills:
          type: array
          items: { type: string }
          description: 可服務品牌 / 技能碼清單
        service_areas:
          type: array
          items: { type: string }
          description: 服務區域代碼（行政區）
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
        completed_orders_count: { type: integer, minimum: 0 }
        circuit_breaker_until: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    TechnicianEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Technician'

    TechnicianPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Technician'

    # --------- Customer（read-only 客戶主檔） ---------
    Customer:
      type: object
      required:
        - id
        - display_name
        - total_conversations
        - total_orders
        - created_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: 顯示名稱（LINE 名稱或從電話 / userId 推導）
        line_user_id:
          type: [string, "null"]
          description: LINE Platform User ID（U + 32 hex），可能為空（非 LINE 來源）
        phone:
          type: [string, "null"]
        address:
          type: [string, "null"]
        last_active_at:
          type: [string, "null"]
          format: date-time
          description: 最近一次互動時間（users.last_active_at）
        total_conversations:
          type: integer
          minimum: 0
        total_orders:
          type: integer
          minimum: 0
          description: 此客戶累積工單數（穿越 conversations → problem_cards → work_orders）
        last_service_at:
          type: [string, "null"]
          format: date-time
          description: 最近一次工單完工時間
        created_at:
          type: string
          format: date-time

    CustomerEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Customer'

    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Customer'

    # --------- Role / RBAC（read-only 權限矩陣） ---------
    RoleResource:
      type: string
      description: 系統定義的權限資源類別
      enum:
        - work_orders
        - technicians
        - customers
        - accounting
        - invoices
        - refunds
        - inventory
        - warranty
        - disputes
        - audit_logs
        - roles
        - system_settings

    RolePermission:
      type: object
      required: [resource, read, write, delete]
      properties:
        resource:
          $ref: '#/components/schemas/RoleResource'
        read:
          type: boolean
        write:
          type: boolean
        delete:
          type: boolean
        locked:
          type: boolean
          description: 是否為系統強制鎖定的權限（不可被自訂角色覆寫）
          default: false

    Role:
      type: object
      required:
        - id
        - name
        - description
        - user_count
        - is_system
        - permissions
      properties:
        id:
          type: string
          description: 角色 ID（system roles 為固定字串：admin / reviewer / technician / brand_oem / line_user）
        name:
          type: string
        description:
          type: string
        user_count:
          type: integer
          minimum: 0
          description: 本租戶內擁有此角色的使用者數
        is_system:
          type: boolean
          description: 是否為系統內建角色（不可刪除）
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RolePermission'

    RolesEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Role'

    # --------- Inventory ---------
    InventoryStockStatus:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: 庫存狀態（衍生自 quantity_on_hand 與 reorder_point 比較）

    InventoryItem:
      type: object
      required:
        - id
        - part_number
        - name
        - category
        - quantity_on_hand
        - reorder_point
        - stock_status
        - is_active
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        part_number:
          type: string
          description: 料號（unique；例：BAT-AA-001）
        name: { type: string }
        category:
          type: string
          description: 類別（battery / lock_body / circuit_board / screw / side_panel / other）
        brand_compatibility:
          type: [array, "null"]
          items:
            type: string
          description: 適用品牌清單
        unit_cost:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 單位成本（TWD，decimal 字串；NULL 表示未設定）
        quantity_on_hand:
          type: integer
          minimum: 0
        reorder_point:
          type: integer
          minimum: 0
          description: 安全庫存量；quantity_on_hand <= reorder_point 觸發補貨警示
        stock_status:
          $ref: '#/components/schemas/InventoryStockStatus'
        supplier:
          type: [string, "null"]
        is_active: { type: boolean }
        last_restocked_at:
          type: [string, "null"]
          format: date-time
          description: 最近一次入庫時間（衍生自 inventory_transactions purchase 紀錄；NULL 表示尚未補貨過）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InventoryItemPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InventoryItem'

    InventoryItemEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InventoryItem'

    # --------- Notification（Week 2 from G1） ---------
    NotificationType:
      type: string
      enum: [work_order, refund, dispute, rbac, inventory, sla, system, mention]

    NotificationSeverity:
      type: string
      enum: [info, warning, critical]

    Notification:
      type: object
      required: [id, type, severity, title, body, source, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        source:
          type: string
          enum: [websocket, line_push, system, email_fallback]
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        related_entity:
          type: [object, "null"]
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
            url: { type: string, format: uri }
        actions:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              endpoint: { type: string }
              method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        raw_event_id:
          type: [string, "null"]
          format: uuid
          description: 對應 domain event，除錯用

    # --------- 訊息（對話內訊息） ---------
    MessageRole:
      type: string
      enum: [user, assistant, system]

    MessageType:
      type: string
      enum: [text, image, audio, video, sticker]

    Message:
      type: object
      required: [id, conversation_id, role, type, content, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/MessageRole' }
        type: { $ref: '#/components/schemas/MessageType' }
        content: { type: string }
        media_url: { type: [string, "null"], format: uri }
        created_at: { type: string, format: date-time }

    MessagePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    # --------- 問題卡（Create/Update 與 Export） ---------
    ProblemCardCreateRequest:
      type: object
      required: [conversation_id, brand, model, symptom, urgency]
      properties:
        conversation_id: { type: string, format: uuid }
        brand: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        symptom: { type: string, maxLength: 1000 }
        category: { type: string }
        urgency: { $ref: '#/components/schemas/Urgency' }
        location: { type: string }
        door_status:
          type: string
          enum: [locked_out, partially_functional, normal]
        network_status:
          type: string
          enum: [online, offline, unknown]
        symptoms:
          type: array
          items: { type: string }
        intent:
          type: string
          enum: [unlock_request, repair_request, installation, inquiry]
        media_urls:
          type: array
          items: { type: string, format: uri }

    ProblemCardUpdateRequest:
      type: object
      properties:
        brand: { type: string }
        model: { type: string }
        symptom: { type: string }
        category: { type: string }
        urgency: { $ref: '#/components/schemas/Urgency' }
        status: { $ref: '#/components/schemas/ProblemCardStatus' }
        media_urls:
          type: array
          items: { type: string, format: uri }

    ProblemCardResolveRequest:
      type: object
      description: 問題卡結案。resolution_layer 必填，記錄最終由哪一層解決。
      required: [resolution_layer]
      properties:
        resolution_layer:
          type: string
          enum: [L1, L2, L3]
          description: L1=AI 直接回覆、L2=技師遠端指導、L3=現場派工。

    ProblemCardEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProblemCard'

    ProblemCardExport:
      type: object
      required: [format, content]
      properties:
        format:
          type: string
          enum: [pdf, json, csv]
        content:
          type: string
          description: Base64 編碼內容或下載 URL（依 format 決定）
        download_url: { type: [string, "null"], format: uri }

    # --------- 知識庫案例 ---------
    CaseEntryEmbeddingStatus:
      type: string
      enum: [processing, ready, failed]

    CaseEntry:
      type: object
      required: [id, title, problem_description, solution, brand, verified, embedding_status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        problem_description: { type: string, maxLength: 2000 }
        solution: { type: string, maxLength: 5000 }
        brand: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        tags:
          type: array
          items: { type: string }
        verified: { type: boolean }
        embedding_status: { $ref: '#/components/schemas/CaseEntryEmbeddingStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CaseEntryCreateRequest:
      type: object
      required: [title, problem_description, solution, brand]
      properties:
        title: { type: string, maxLength: 200 }
        problem_description: { type: string, maxLength: 2000 }
        solution: { type: string, maxLength: 5000 }
        brand: { type: string, maxLength: 50 }
        model: { type: string, maxLength: 100 }
        tags:
          type: array
          items: { type: string }

    CaseEntryUpdateRequest:
      type: object
      properties:
        title: { type: string }
        problem_description: { type: string }
        solution: { type: string }
        brand: { type: string }
        model: { type: string }
        tags:
          type: array
          items: { type: string }
        verified: { type: boolean }

    CaseEntryEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CaseEntry'

    CaseEntryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CaseEntry'

    CaseSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 500 }
        brand: { type: string }
        model: { type: string }
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        similarity_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.75

    CaseSearchHit:
      type: object
      required: [case, score]
      properties:
        case: { $ref: '#/components/schemas/CaseEntry' }
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1

    CaseSearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/CaseSearchHit' }

    # --------- 知識庫手冊 ---------
    ManualStatus:
      type: string
      enum: [processing, ready, failed]

    Manual:
      type: object
      required: [id, title, brand, file_name, file_size_bytes, status, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        brand: { type: string }
        model: { type: string }
        file_name: { type: string }
        file_size_bytes: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/ManualStatus' }
        chunk_count: { type: [integer, "null"], minimum: 0 }
        created_at: { type: string, format: date-time }

    ManualEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Manual'

    ManualPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Manual'

    # --------- SOP Drafts ---------
    SopDraftStatus:
      type: string
      enum: [draft, under_review, approved, rejected]

    SopDraftStep:
      type: object
      required: [order, title, description]
      properties:
        order: { type: integer, minimum: 1 }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    SopDraft:
      type: object
      required: [id, title, steps, status, created_at]
      properties:
        id: { type: string, format: uuid }
        case_event_id: { type: [string, "null"], format: uuid }
        problem_card_id: { type: [string, "null"], format: uuid }
        title: { type: string, maxLength: 200 }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SopDraftStep' }
        status: { $ref: '#/components/schemas/SopDraftStatus' }
        reviewer_id: { type: [string, "null"], format: uuid }
        reviewed_at: { type: [string, "null"], format: date-time }
        review_comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    SopDraftEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SopDraft'

    SopDraftPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SopDraft'

    SopDraftReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        comment: { type: string, maxLength: 1000 }

    SopDraftAdoptRequest:
      type: object
      properties:
        target_case_id: { type: [string, "null"], format: uuid, description: 採納為現有案例的更新；省略則建立新案例 }

    # --------- Resolution Engine ---------
    ResolveRequest:
      type: object
      required: [problem_card_id]
      properties:
        problem_card_id: { type: string, format: uuid }

    ResolveResponse:
      type: object
      required: [layer, answer]
      properties:
        layer:
          type: string
          enum: [faq_match, knowledge_base_rag, llm_generation, escalation]
        answer: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [case, manual] }
              id: { type: string, format: uuid }
              snippet: { type: string }
              score: { type: number, format: float }
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    # --------- Auth 補充 ---------
    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthLogoutRequest:
      type: object
      properties:
        refresh_token: { type: [string, "null"] }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      description: |
        變更密碼。new_password 至少 8 字元（與 bcrypt 72 byte 上限一致），
        且不可與 current_password 相同。
      properties:
        current_password:
          type: string
          minLength: 8
          maxLength: 72
        new_password:
          type: string
          minLength: 8
          maxLength: 72

    # --------- Dashboard ---------
    DashboardPeriod:
      type: string
      enum: [today, "7d", "30d", "90d"]

    DashboardStats:
      type: object
      required: [period, conversations, resolution]
      properties:
        period: { $ref: '#/components/schemas/DashboardPeriod' }
        conversations:
          type: object
          required: [total, active, resolved, escalated]
          properties:
            total: { type: integer, minimum: 0 }
            active: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            escalated: { type: integer, minimum: 0 }
        resolution:
          type: object
          properties:
            ai_resolution_rate: { type: number, format: float, minimum: 0, maximum: 1 }
            avg_resolution_time_seconds: { type: integer, minimum: 0 }
            by_layer:
              type: object
              additionalProperties:
                type: integer
        hot_topics:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              count: { type: integer, minimum: 0 }
        token_usage:
          type: object
          properties:
            total_tokens: { type: integer }
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            estimated_cost_usd: { type: number, format: float }
        top_brands:
          type: array
          items:
            type: object
            properties:
              brand: { type: string }
              count: { type: integer, minimum: 0 }
        work_orders:
          type: object
          description: 派工今日 KPI（today_count / completion_rate / overdue_count）。
          properties:
            today_count:
              type: integer
              minimum: 0
              description: 今日新建工單數
            completion_rate:
              type: number
              format: float
              minimum: 0
              maximum: 1
              nullable: true
              description: 今日完工率 = 今日完工 / 今日新建（today_count == 0 時為 null）
            overdue_count:
              type: integer
              minimum: 0
              description: 排程時間已過且未結案（status NOT IN completed/closed/cancelled）
        technicians:
          type: object
          description: 技師概況 KPI（total_count / online_count / dispatchable_count）。
          properties:
            total_count:
              type: integer
              minimum: 0
              description: 此租戶啟用中（status='active'）的技師總數
            online_count:
              type: integer
              minimum: 0
              description: 目前可派遣的技師數（active 且不在執行中工單）
            dispatchable_count:
              type: integer
              minimum: 0
              description: 已上線且可立即指派（保留欄位，目前等同 online_count）

    # --------- Revenue Reports ---------
    RevenueKpis:
      type: object
      required: [month_revenue, average_invoice_amount, paid_rate, outstanding_amount, outstanding_count]
      properties:
        month_revenue:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 本月營收（已開立 invoice issued + paid 加總，TWD 字串）
        average_invoice_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 平均 invoice 金額
        paid_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: 付款成功率 = paid / (issued + paid + cancelled)；無發票時為 null
        outstanding_amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 未收帳款金額（DB status='draft' 加總）
        outstanding_count:
          type: integer
          minimum: 0
          description: 未收帳款筆數

    RevenueTrendPoint:
      type: object
      required: [period, revenue, order_count]
      properties:
        period:
          type: string
          description: 期間標籤（例 2026-04）
        revenue:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
          description: 期間內已開立 invoice 金額（TWD 字串）
        order_count:
          type: integer
          minimum: 0
          description: 期間內 invoice 筆數

    RevenueByBrandPoint:
      type: object
      required: [brand, revenue, share]
      properties:
        brand: { type: string }
        revenue:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        share:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 占總營收比例

    RevenueSummary:
      type: object
      required: [granularity, kpis, trend, by_brand]
      properties:
        granularity:
          type: string
          enum: [day, week, month]
        kpis:
          $ref: '#/components/schemas/RevenueKpis'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/RevenueTrendPoint'
        by_brand:
          type: array
          items:
            $ref: '#/components/schemas/RevenueByBrandPoint'

    # --------- KPI Report ---------
    KpiFunnel:
      type: object
      required: [conversations, problem_cards, work_orders, dispatched, completed]
      description: |
        轉換漏斗（值為計數，過濾條件以 created_at 落在 period 區間內）。
        - dispatched：work_orders.status IN (assigned, in_progress, completed, confirmed)
        - completed：work_orders.status IN (completed, confirmed)
      properties:
        conversations: { type: integer, minimum: 0 }
        problem_cards: { type: integer, minimum: 0 }
        work_orders: { type: integer, minimum: 0 }
        dispatched: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }

    KpiDisputeRates:
      type: object
      description: |
        異常率（分母為 period 區間內 work_orders 總數，分母為 0 時欄位為 null）。
      properties:
        refund_rate:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: 退款率（refund_requests 數 / work_orders 總數）
        warranty_claim_rate:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: 保固索賠率（warranty_claims 數 / work_orders 總數）
        dispute_rate:
          type: [string, "null"]
          pattern: '^-?\d+(\.\d{1,4})?$'
          description: 爭議升級率（disputes 數 / work_orders 總數）

    KpiTechnicianEfficiency:
      type: object
      description: |
        技師效率指標。avg_handle_minutes 取 period 區間內所有 status='completed/confirmed'
        且具備 started_at + completed_at 工單的平均值。
      properties:
        avg_handle_minutes:
          type: [number, "null"]
          minimum: 0
          description: 平均處理時長（分鐘）；無樣本時 null
        completed_count:
          type: integer
          minimum: 0

    KpiReport:
      type: object
      required: [period, generated_at, funnel, dispute_rates, technician_efficiency]
      properties:
        period: { $ref: '#/components/schemas/DashboardPeriod' }
        generated_at: { type: string, format: date-time }
        funnel: { $ref: '#/components/schemas/KpiFunnel' }
        dispute_rates: { $ref: '#/components/schemas/KpiDisputeRates' }
        technician_efficiency:
          $ref: '#/components/schemas/KpiTechnicianEfficiency'
        notes:
          type: array
          description: 暫不可計算的指標（SLA / NPS / 滿意度 / FTFR / 差評率）說明
          items: { type: string }

    # --------- System Config ---------
    SystemConfig:
      type: object
      description: |
        系統設定（部分更新）。各區塊允許獨立 PATCH，未指定的子鍵不變動。
      properties:
        rag:
          type: object
          properties:
            similarity_threshold: { type: number, format: float, minimum: 0, maximum: 1 }
            max_results: { type: integer, minimum: 1 }
            chunk_size: { type: integer, minimum: 1 }
            chunk_overlap: { type: integer, minimum: 0 }
        llm:
          type: object
          properties:
            model: { type: string }
            temperature: { type: number, format: float, minimum: 0, maximum: 2 }
            max_tokens: { type: integer, minimum: 1 }
            system_prompt_version: { type: string }
        resolution:
          type: object
          properties:
            faq_confidence_threshold: { type: number, format: float, minimum: 0, maximum: 1 }
            rag_confidence_threshold: { type: number, format: float, minimum: 0, maximum: 1 }
            auto_escalation_enabled: { type: boolean }
        line_bot:
          type: object
          properties:
            greeting_message_enabled: { type: boolean }
            max_conversation_turns: { type: integer, minimum: 1 }

    # --------- Audit Logs ---------
    AuditLogType:
      type: string
      enum: [api_call, llm_interaction, rag_retrieval, admin_action, agent_message]

    AuditLogEntry:
      type: object
      required: [id, log_type, action, created_at]
      properties:
        id: { type: string, format: uuid }
        log_type: { $ref: '#/components/schemas/AuditLogType' }
        actor_id: { type: [string, "null"], format: uuid }
        action: { type: string, maxLength: 200 }
        details:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogEntry'

    # --------- Sentiment Alerts ---------
    SentimentAlertStatus:
      type: string
      enum: [pending, acknowledged, resolved]

    SentimentAlert:
      type: object
      required: [id, conversation_id, sentiment_label, confidence, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        consumer_message: { type: string, maxLength: 2000 }
        sentiment_label:
          type: string
          enum: [negative, very_negative, neutral, positive]
        confidence: { type: number, format: float, minimum: 0, maximum: 1 }
        detected_keywords:
          type: array
          items: { type: string }
        problem_card_id: { type: [string, "null"], format: uuid }
        status: { $ref: '#/components/schemas/SentimentAlertStatus' }
        notified_admin_ids:
          type: array
          items: { type: string, format: uuid }
        admin_note: { type: [string, "null"], maxLength: 1000 }
        created_at: { type: string, format: date-time }

    SentimentAlertUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/SentimentAlertStatus' }
        admin_note: { type: string, maxLength: 1000 }

    SentimentAlertPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SentimentAlert'

    # --------- Family Reviews ---------
    FamilyReviewAction:
      type: string
      enum: [approved, rejected]

    FamilyReviewPendingItem:
      type: object
      required: [sop_draft_id, title, awaiting_family_review_since]
      properties:
        sop_draft_id: { type: string, format: uuid }
        title: { type: string }
        admin_reviewer: { type: string }
        admin_approved_at: { type: string, format: date-time }
        awaiting_family_review_since: { type: string, format: date-time }

    FamilyReviewPendingResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FamilyReviewPendingItem' }

    FamilyReviewCreateRequest:
      type: object
      required: [sop_draft_id, action]
      properties:
        sop_draft_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/FamilyReviewAction' }
        comment: { type: string, maxLength: 1000 }

    FamilyReview:
      type: object
      required: [id, sop_draft_id, action, reviewer_id, created_at]
      properties:
        id: { type: string, format: uuid }
        sop_draft_id: { type: string, format: uuid }
        action: { $ref: '#/components/schemas/FamilyReviewAction' }
        reviewer_id: { type: string, format: uuid }
        comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    FamilyReviewPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FamilyReview'

    # --------- KB Vector Export ---------
    KbExportStatus:
      type: string
      enum: [queued, running, completed, failed]

    KbExportRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [all, cases_only, manuals_only]
          default: all
        brand: { type: string }

    KbExportJob:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/KbExportStatus' }
        download_url: { type: [string, "null"], format: uri }
        item_count: { type: [integer, "null"], minimum: 0 }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    # --------- Technicians 補充 ---------
    TechnicianRegisterRequest:
      type: object
      required: [name, phone, email, password, capabilities, regions]
      properties:
        name: { type: string }
        phone: { type: string, pattern: '^09\d{8}$' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        capabilities:
          type: array
          items: { type: string }
        regions:
          type: array
          items: { type: string }

    TechnicianProfile:
      allOf:
        - $ref: '#/components/schemas/Technician'
        - type: object
          properties:
            email: { type: string, format: email }

    TechnicianProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TechnicianProfile'

    TechnicianUpdateRequest:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, pattern: '^09\d{8}$' }
        email: { type: string, format: email }
        capabilities:
          type: array
          items: { type: string }
        regions:
          type: array
          items: { type: string }

    # --------- Work Order Confirm（客戶評價） ---------
    WorkOrderConfirmRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        feedback: { type: string, maxLength: 1000 }

    # --------- Dispatch ---------
    DispatchAutoMatchRequest:
      type: object
      required: [problem_card_id]
      properties:
        problem_card_id: { type: string, format: uuid }
        urgency:
          type: string
          enum: [normal, emergency]
          default: normal
        max_candidates:
          type: integer
          minimum: 1
          maximum: 10
          default: 3

    DispatchCandidate:
      type: object
      required: [technician_id, score]
      properties:
        technician_id: { type: string, format: uuid }
        technician_name: { type: string }
        score: { type: number, format: float, minimum: 0, maximum: 1 }
        distance_km: { type: number, format: float }
        eta_minutes: { type: integer, minimum: 0 }
        rating: { type: number, format: float, minimum: 0, maximum: 5 }

    DispatchAutoMatchResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: { $ref: '#/components/schemas/DispatchCandidate' }

    DispatchAssignRequest:
      type: object
      description: |
        E5 §8.3：批次或顯式指派工單。`work_order_id` + `technician_id` 必填；
        與 `/api/v1/work-orders/{id}/assign` 之差異：本端點接受 body 中傳遞工單 id，
        適用於從候選列表批次派發。
      required: [work_order_id, technician_id]
      properties:
        work_order_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        override_reason: { type: string, maxLength: 500 }

    # --------- Pricing ---------
    LockType:
      type: string
      enum: [digital_deadbolt, smart_lock, padlock, other]

    DifficultyLevel:
      type: string
      enum: [simple, moderate, complex]

    PricingCalculateRequest:
      type: object
      required: [brand, lock_type, difficulty]
      properties:
        brand: { type: string }
        model: { type: string }
        lock_type: { $ref: '#/components/schemas/LockType' }
        difficulty: { $ref: '#/components/schemas/DifficultyLevel' }
        is_emergency: { type: boolean, default: false }
        is_night_service: { type: boolean, default: false }
        additional_items:
          type: array
          items: { type: string }

    PricingSurcharge:
      type: object
      required: [name, amount]
      properties:
        name: { type: string }
        condition: { type: string }
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'

    PricingCalculateResponse:
      type: object
      required: [base_price, total]
      properties:
        base_price:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        surcharges:
          type: array
          items: { $ref: '#/components/schemas/PricingSurcharge' }
        total:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TWD]
          default: TWD

    PricingRule:
      type: object
      required: [id, brand, lock_type, difficulty, base_price, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        brand: { type: string }
        lock_type: { $ref: '#/components/schemas/LockType' }
        difficulty: { $ref: '#/components/schemas/DifficultyLevel' }
        base_price:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        surcharges:
          type: array
          items: { $ref: '#/components/schemas/PricingSurcharge' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PricingRuleCreateRequest:
      type: object
      required: [brand, lock_type, difficulty, base_price]
      properties:
        brand: { type: string }
        lock_type: { $ref: '#/components/schemas/LockType' }
        difficulty: { $ref: '#/components/schemas/DifficultyLevel' }
        base_price:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        surcharges:
          type: array
          items: { $ref: '#/components/schemas/PricingSurcharge' }

    PricingRuleUpdateRequest:
      type: object
      properties:
        base_price:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        surcharges:
          type: array
          items: { $ref: '#/components/schemas/PricingSurcharge' }

    PricingRuleEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiResponseGeneric'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PricingRule'

    PricingRulePage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PricingRule'

    # --------- Accounting ---------
    ReconciliationStatus:
      type: string
      enum: [pending, approved, disputed]

    Reconciliation:
      type: object
      required: [id, technician_id, period_start, period_end, total_orders, total_revenue, technician_payout, status, created_at]
      properties:
        id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        technician_name: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        total_orders: { type: integer, minimum: 0 }
        total_revenue:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        platform_fee:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        technician_payout:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        status: { $ref: '#/components/schemas/ReconciliationStatus' }
        approved_by: { type: [string, "null"], format: uuid }
        approved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ReconciliationApproveRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }

    ReconciliationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Reconciliation'

    SettlementStatus:
      type: string
      enum: [pending, paid, failed]

    Settlement:
      type: object
      required: [id, reconciliation_id, technician_id, amount, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        reconciliation_id: { type: string, format: uuid }
        technician_id: { type: string, format: uuid }
        technician_name: { type: string }
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TWD]
          default: TWD
        status: { $ref: '#/components/schemas/SettlementStatus' }
        payment_method:
          type: string
          enum: [bank_transfer, other]
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    SettlementPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Settlement'

    Voucher:
      type: object
      description: |
        會計憑證（傳票），對應一筆對帳/結算/退款的雙分錄記錄。
      required: [id, voucher_number, debit_account, credit_account, amount, currency, posting_date, created_at]
      properties:
        id: { type: string, format: uuid }
        voucher_number: { type: string }
        related_entity_type:
          type: string
          enum: [reconciliation, settlement, refund, invoice]
        related_entity_id: { type: [string, "null"], format: uuid }
        debit_account: { type: string }
        credit_account: { type: string }
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,2})?$'
        currency:
          type: string
          enum: [TWD]
          default: TWD
        posting_date: { type: string, format: date }
        memo: { type: string }
        created_at: { type: string, format: date-time }

    VoucherPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Voucher'

    # --------- Notification 推送 ---------
    NotificationPushRequest:
      type: object
      required: [target_type, target_id, type, title, body]
      properties:
        target_type:
          type: string
          enum: [technician, admin, customer]
        target_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        data:
          type: [object, "null"]
          additionalProperties: true
        channels:
          type: array
          items:
            type: string
            enum: [push, sms, line, email]

    # --------- AuditEvent / DomainEvent 保留 ---------
    # AuditEvent — 隨 /api/v1/audit-events 端點 Week 3 補完
    # DomainEvent — 見 asyncapi.yaml DomainEventEnvelope
