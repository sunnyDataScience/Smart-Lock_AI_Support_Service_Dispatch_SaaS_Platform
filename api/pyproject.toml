[project]
name = "smart-lock-api"
version = "0.1.0"
description = "Smart Lock REST API backend (FastAPI + JWT + Pydantic v2)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # === Web 框架 ===
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # === Schema / Validation ===
    "pydantic>=2.6",
    "pydantic[email]>=2.6",
    # === DB ===
    "psycopg[binary]>=3.2",
    # === Auth ===
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    # === PDF generation (vouchers / reports) ===
    "reportlab>=4.0",
    # === 雜項 ===
    "python-dotenv>=1.0",
    "jsonschema>=4.23.0",
]

[tool.uv]
package = false
