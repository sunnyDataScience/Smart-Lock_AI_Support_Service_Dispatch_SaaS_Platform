[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
# 測試金字塔分層 markers（對應 root pyproject.toml 與 E7x §5.2）
markers =
    unit: 純函式單元測試（無 I/O）
    component: 元件測試（API router + 真 DB / dev seeds）
    contract: 合約測試（OpenAPI / AsyncAPI 形狀）
    e2e: 端到端測試
    slow: 預期 > 30s 的測試
